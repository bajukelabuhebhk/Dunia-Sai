<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantau Dunia Sai</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/shared/icons/favicon.png">
<link rel="stylesheet" href="/shared/css/dunia.css">
</head>
<body>
<!--
  The owner's dashboard is its own app at PANTAU_URL (folder /pantau-app, a separate Cloudflare Pages project).
  Opening this page marks the phone as the owner's, so /shared/js/jejak.js stops counting its visits.
-->
<div class="wrap" style="max-width:480px;text-align:center;padding-top:10vh">
  <img src="/shared/icons/icon-192.png" alt="" width="72" height="72" style="border-radius:16px;margin:0 auto">
  <h1 style="font-size:1.4rem;margin-top:14px">Pantau Dunia Sai</h1>
  <p id="status" style="color:var(--muted)"></p>
  <p><a class="btn" id="buka">Buka dashboard Pantau</a></p>
  <p><button class="btn garis kecil" id="tukar"></button></p>
</div>
<script>
(() => {
  const PANTAU_URL = 'https://pantau-dunia-sai.pages.dev/';
  const KEY = 'ds_jejak_off';
  const store = (() => { try { return localStorage; } catch (e) { return null; } })();
  const params = new URLSearchParams(location.search);
  if (store && !params.has('kira')) store.setItem(KEY, '1');
  if (store && params.has('kira')) store.removeItem(KEY);
  function show() {
    const off = store && store.getItem(KEY);
    document.getElementById('status').textContent = off
      ? '✅ Lawatan dari phone ini tidak dikira dalam Pantau.'
      : 'Lawatan dari phone ini dikira seperti pelawat biasa.';
    document.getElementById('tukar').textContent = off ? 'Kira semula phone ini' : 'Jangan kira phone ini';
  }
  document.getElementById('tukar').addEventListener('click', () => {
    if (!store) return;
    store.getItem(KEY) ? store.removeItem(KEY) : store.setItem(KEY, '1');
    show();
  });
  document.getElementById('buka').href = PANTAU_URL;
  show();
})();
</script>
</body>
</html>
