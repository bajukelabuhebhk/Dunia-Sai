<script>
'use strict';
/* =====================================================================
   MISI SELAMAT UBAT: DWI-PERANAN
   Permainan pendidikan satu fail. Bahagian kod:
   1. Asas & utiliti   2. Simpanan   3. Bunyi   4. Data (tahap, kad, kedai)
   5. Lukisan watak & ubat   6. Enjin tahap   7. Mod A (Rumah)
   8. Mod B (Farmasi)   9. Skrin menu   10. Input & gelung utama
   ===================================================================== */

/* ---------- 1. ASAS & UTILITI ---------- */
const W = 1280, H = 720, OUT = '#3E2723';
const FON = '"Trebuchet MS","Segoe UI",Verdana,sans-serif';
const cv = document.getElementById('kanvas'), ctx = cv.getContext('2d');
let skala = 1, ox = 0, oy = 0, dpr = 1, masa = 0;
const ptr = { x: W / 2, y: H / 2, turun: false };
let zonKlik = [];
const HALANG = { x: 0, y: 0, w: W, h: H, fn() {} };

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(Array.isArray(r) ? r[0] : r || 0, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
function ubahSaiz() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  skala = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * skala) / 2; oy = (cv.height - H * skala) / 2;
}
const rnd = n => Math.floor(Math.random() * n);
const pilihRawak = a => a[rnd(a.length)];
const kocok = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dalam = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const had = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');

function box(x, y, w, h, r, isi, garis = OUT, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (isi) { ctx.fillStyle = isi; ctx.fill(); }
  if (garis) { ctx.lineWidth = lw; ctx.strokeStyle = garis; ctx.stroke(); }
}
function circ(x, y, r, isi, garis = OUT, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (isi) { ctx.fillStyle = isi; ctx.fill(); }
  if (garis) { ctx.lineWidth = lw; ctx.strokeStyle = garis; ctx.stroke(); }
}
function garis(x1, y1, x2, y2, warna = OUT, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = warna; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function txt(s, x, y, sz = 20, warna = OUT, al = 'center', tebal = true, maks) {
  ctx.font = (tebal ? 'bold ' : '') + sz + 'px ' + FON; ctx.fillStyle = warna; ctx.textAlign = al; ctx.textBaseline = 'middle';
  if (maks) ctx.fillText(s, x, y, maks); else ctx.fillText(s, x, y);
}
function balut(s, x, y, maks, sz, warna = OUT, al = 'center', tebal = false) {
  ctx.font = (tebal ? 'bold ' : '') + sz + 'px ' + FON;
  const kata = String(s).split(' '), lh = sz * 1.32; let baris = '', n = 0;
  for (const k of kata) {
    const uji = baris ? baris + ' ' + k : k;
    if (ctx.measureText(uji).width > maks && baris) { txt(baris, x, y + n * lh, sz, warna, al, tebal); n++; baris = k; }
    else baris = uji;
  }
  if (baris) { txt(baris, x, y + n * lh, sz, warna, al, tebal); n++; }
  return n * lh;
}
function bintang(x, y, r, isi = '#FFC107', garisW = OUT) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.46 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = isi; ctx.fill();
  if (garisW) { ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.strokeStyle = garisW; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function syilingIkon(x, y, r) { circ(x, y, r, '#FFCA28', OUT, 2.5); circ(x, y, r * 0.62, '#FFE082', '#F9A825', 2); txt('C', x, y + 1, r * 0.9, '#E65100'); }
function mangga(x, y, s = 1) {
  ctx.beginPath(); ctx.arc(x, y - 8 * s, 8 * s, Math.PI, 0); ctx.lineWidth = 4 * s; ctx.strokeStyle = OUT; ctx.stroke();
  box(x - 12 * s, y - 8 * s, 24 * s, 20 * s, 4 * s, '#FFCA28', OUT, 2.5);
  circ(x, y + 1 * s, 2.6 * s, OUT, null);
}
function palang(x, y, r, warna = '#2E7D32') { box(x - r * 0.33, y - r, r * 0.66, r * 2, r * 0.15, warna, null); box(x - r, y - r * 0.33, r * 2, r * 0.66, r * 0.15, warna, null); }
function butang(x, y, w, h, label, fn, o = {}) {
  const r = o.r == null ? 16 : o.r;
  box(x, y + 5, w, h, r, 'rgba(62,39,35,.28)', null);
  box(x, y, w, h, r, o.mati ? '#CFCFCF' : (o.warna || '#FFB300'));
  if (label) txt(label, x + w / 2, y + h / 2 + 1, o.sz || 22, o.mati ? '#8D8D8D' : (o.teks || OUT), 'center', true, w - 14);
  zonKlik.push({ x, y, w, h, fn: o.mati ? () => {} : fn });
}

/* ---------- 2. SIMPANAN (localStorage) ---------- */
const KUNCI = 'misiSelamatUbat_v1';
function simpananAsal() { return { prog: { A: {}, B: {} }, akhir: 0, syiling: 0, naik: {}, kad: [], rekod: { A: 0, B: 0 }, beg: 0, senyap: false }; }
let simpan = simpananAsal();
try {
  const s = JSON.parse(localStorage.getItem(KUNCI) || 'null');
  if (s && typeof s === 'object') { simpan = Object.assign(simpananAsal(), s); simpan.prog = Object.assign({ A: {}, B: {} }, s.prog); simpan.rekod = Object.assign({ A: 0, B: 0 }, s.rekod); }
} catch (e) { /* storan tidak tersedia – main tanpa simpanan */ }
function tulis() { try { localStorage.setItem(KUNCI, JSON.stringify(simpan)); } catch (e) {} }
function jumlahBintang() {
  let n = simpan.akhir || 0;
  for (const m of ['A', 'B']) for (const k in simpan.prog[m]) n += simpan.prog[m][k];
  return n;
}

/* ---------- 3. BUNYI (Web Audio API) ---------- */
const Bunyi = {
  ak: null,
  mula() {
    if (!this.ak) { try { this.ak = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ak = null; } }
    if (this.ak && this.ak.state === 'suspended') this.ak.resume();
    this.muatBgm();
  },
  /* Dunia Sai: BGM CC0 oleh mintodog (OpenGameArt "Cozy Puzzle"), lihat LESEN-MUZIK.md */
  bgm: { buf: {}, dimuat: false, mahu: '', main: '', src: null, gain: null },
  muatBgm() {
    const B = this.bgm; if (B.dimuat || !this.ak) return; B.dimuat = true;
    B.gain = this.ak.createGain(); B.gain.gain.value = 0; B.gain.connect(this.ak.destination);
    for (const k of ['menu', 'main']) {
      fetch('muzik-' + k + '.mp3').then(r => r.arrayBuffer()).then(d => new Promise((ok, no) => this.ak.decodeAudioData(d, ok, no)))
        .then(b => { B.buf[k] = b; }).catch(() => {});
    }
  },
  kemasBgm(mahu) {
    const B = this.bgm; if (!this.ak || !B.gain) return;
    if (simpan.senyap || document.hidden) mahu = '';
    if (mahu && !B.buf[mahu]) return;
    if (mahu === B.main) return;
    const t = this.ak.currentTime, lama = B.src;
    B.gain.gain.cancelScheduledValues(t); B.gain.gain.setValueAtTime(B.gain.gain.value, t); B.gain.gain.linearRampToValueAtTime(0, t + 0.5);
    if (lama) { try { lama.stop(t + 0.55); } catch (e) {} }
    B.src = null; B.main = mahu;
    if (!mahu) return;
    const src = this.ak.createBufferSource(); src.buffer = B.buf[mahu]; src.loop = true; src.connect(B.gain); src.start(t + 0.55);
    B.gain.gain.linearRampToValueAtTime(0, t + 0.55); B.gain.gain.linearRampToValueAtTime(mahu === 'main' ? 0.22 : 0.3, t + 1.6);
    B.src = src;
  },
  nada(f, d = 0.12, jenis = 'sine', v = 0.15, lewat = 0, f2) {
    if (simpan.senyap || !this.ak) return;
    const t = this.ak.currentTime + lewat, o = this.ak.createOscillator(), g = this.ak.createGain();
    o.type = jenis; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.ak.destination); o.start(t); o.stop(t + d + 0.03);
  },
  klik() { this.nada(540, 0.06, 'triangle', 0.12); this.nada(270, 0.08, 'square', 0.035, 0.02); },
  imbas() { this.nada(900, 0.4, 'sawtooth', 0.04, 0, 1900); this.nada(1760, 0.09, 'sine', 0.1, 0.42); },
  penggera() { for (let i = 0; i < 3; i++) { this.nada(880, 0.12, 'sine', 0.1, i * 0.3); this.nada(1108, 0.12, 'sine', 0.1, i * 0.3 + 0.14); } },
  kombo(n) { const f = [523, 587, 659, 784, 880, 988, 1047][Math.min(Math.max(n, 1), 7) - 1]; this.nada(f, 0.12, 'sine', 0.14); this.nada(f * 1.5, 0.22, 'sine', 0.09, 0.08); },
  salah() { this.nada(230, 0.28, 'triangle', 0.14, 0, 150); },
  amaran() { this.nada(440, 0.18, 'sine', 0.09); this.nada(370, 0.26, 'sine', 0.09, 0.2); },
  menang() { [523, 659, 784, 1047].forEach((f, i) => this.nada(f, 0.24, 'triangle', 0.13, i * 0.13)); },
  kalah() { [392, 330, 262].forEach((f, i) => this.nada(f, 0.3, 'sine', 0.11, i * 0.2)); },
  gosok() { this.nada(170 + Math.random() * 90, 0.05, 'sawtooth', 0.018); }
};

/* ---------- 11. Dunia Sai: PAPAN SKOR (pemain berkongsi satu peranti) ----------
   Setiap tahap yang tamat direkod di bawah nama pemain aktif Dunia Sai (ds_anak, dipilih di sini atau di /app/).
   Disimpan dalam peranti ini sahaja: localStorage misiSelamatUbat_skor_v1 = { v:1, ev:[{ t, a, m, k, menang, bt, skor }] }.
   Kemajuan game (bab terbuka, syiling, kad) masih dikongsi semua pemain dalam peranti yang sama. */
const Skor = (() => {
  const KEY = 'misiSelamatUbat_skor_v1', DAY = 86400000, TANPA = '(tanpa nama)';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = document.getElementById('skor');
  let julat = 'semua', tambah = false;
  const baca = () => { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); return d && Array.isArray(d.ev) ? d.ev : []; } catch (e) { return []; } };
  const anak = () => window.DSAnak ? DSAnak.read() : { names: [], active: '' };
  const pemain = () => anak().active || '';
  const namaTahap = k => k === 'F' ? 'Tahap Akhir' : k === 'E' ? 'Tanpa Had' : LEVELS[k] ? LEVELS[k].id : String(k);
  function rekod(r) {
    const ev = baca(), a = pemain();
    ev.push({ t: Date.now(), a, m: peranan, k: r.tanpaHad ? 'E' : r.k, menang: !!r.menang, bt: r.bintang || 0, skor: r.skor || 0 });
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, ev: ev.slice(-2000) })); } catch (e) {}
    return a;
  }
  function dari() { const d = new Date(); d.setHours(0, 0, 0, 0); return julat === 'hari' ? d.getTime() : julat === 'minggu' ? d.getTime() - 6 * DAY : 0; }
  // The best name(s) when at least two players scored
  function juara(m) { const e = Object.entries(m).filter(([, v]) => v > 0); if (e.length < 2) return []; const t = Math.max(...e.map(([, v]) => v)); return e.filter(([, v]) => v === t).map(([k]) => k); }
  function lukis() {
    const A = anak(), all = baca(), ev = all.filter(x => x.t >= dari());
    const nama = A.names.slice(); all.forEach(x => { if (x.a && !nama.includes(x.a)) nama.push(x.a); });
    const kol = nama.slice(); if (ev.some(x => !x.a)) kol.push(TANPA);
    const P = {}; kol.forEach(n => P[n] = { best: {}, main: 0, lulus: 0, tanpa: { A: 0, B: 0 } });

      if (x.k === 'E') { p.tanpa[x.m] = Math.max(p.tanpa[x.m], x.skor); continue; }
      if (x.menang) p.lulus++;
      const id = x.m + ':' + x.k; p.best[id] = Math.max(p.best[id] || 0, x.bt);
    }
    const bt = n => Object.values(P[n].best).reduce((a, b) => a + b, 0);
    const raja = juara(Object.fromEntries(kol.map(n => [n, bt(n)])));
    const ids = []; for (const m of ['A', 'B']) { LEVELS.forEach((L, i) => { if (kol.some(n => P[n].best[m + ':' + i] !== undefined)) ids.push([m, i]); }); if (kol.some(n => P[n].best[m + ':F'] !== undefined)) ids.push([m, 'F']); }
    const baris = ids.map(([m, k]) => { const id = m + ':' + k, j = juara(Object.fromEntries(kol.map(n => [n, P[n].best[id] || 0])));
      return `<tr><th scope="row">${m === 'A' ? '🏠' : '💊'} ${esc(namaTahap(k))}</th>${kol.map(n => { const v = P[n].best[id]; return v === undefined ? '<td class="kosong">–</td>' : `<td class="${j.includes(n) ? 'atas' : ''}">${v ? '⭐'.repeat(v) : 'belum lulus'}</td>`; }).join('')}</tr>`; }).join('');
    const tanpa = ['A', 'B'].filter(m => kol.some(n => P[n].tanpa[m] > 0)).map(m => { const j = juara(Object.fromEntries(kol.map(n => [n, P[n].tanpa[m]])));
      return `<tr><th scope="row">${m === 'A' ? '🏠' : '💊'} Tanpa Had (skor)</th>${kol.map(n => P[n].tanpa[m] ? `<td class="${j.includes(n) ? 'atas' : ''}">${j.includes(n) ? '👑 ' : ''}${P[n].tanpa[m]}</td>` : '<td class="kosong">–</td>').join('')}</tr>`; }).join('');
    const bila = { hari: 'hari ini', minggu: 'dalam 7 hari ini', semua: 'lagi' }[julat];
    const terkini = ev.slice(-8).reverse().map(x => { const d = new Date(x.t); return `<tr><td>${d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' })} ${d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</td><th scope="row">${esc(x.a || TANPA)}</th><td>${x.m === 'A' ? '🏠' : '💊'} ${esc(namaTahap(x.k))}</td><td>${x.k === 'E' ? 'Skor ' + x.skor : x.menang ? '⭐'.repeat(x.bt) : 'Cuba lagi'}</td></tr>`; }).join('');
    el.innerHTML = `<div class="sk-atas"><button type="button" class="sk-btn" data-tutup>◀ Kembali</button><h1>🏆 Papan Skor</h1></div><div class="sk-isi">
      <div class="sk-kotak"><h2>🎮 Giliran siapa sekarang?</h2><p class="sk-kecil">Tekan nama sebelum main. Setiap tahap yang tamat akan direkod untuk nama itu.</p>
        <div class="sk-baris">${nama.map(n => `<button type="button" class="sk-nama ${n === A.active ? 'aktif' : ''}" data-pilih="${esc(n)}" aria-pressed="${n === A.active}">${n === A.active ? '⭐ ' : ''}${esc(n)}</button>`).join('')}<button type="button" class="sk-nama tambah" data-tambah>＋ Tambah pemain</button></div>
        <form ${tambah ? '' : 'hidden'}><label for="skBaru" style="position:absolute;left:-9999px">Nama pemain</label><input id="skBaru" maxlength="30" placeholder="Nama pemain" autocomplete="off"><button class="sk-btn utama">Tambah</button></form>
        ${A.active ? `<p class="sk-nota">Sekarang: <b>${esc(A.active)}</b>. <button type="button" class="sk-btn utama" data-tutup style="margin-left:6px">Jom main ▶</button></p>` : ''}</div>
      <div class="sk-kotak"><h2>🏆 Skor pemain</h2>
        <div class="sk-baris" role="group" aria-label="Tempoh">${[['hari', 'Hari ini'], ['minggu', '7 hari'], ['semua', 'Semua']].map(([k, l]) => `<button type="button" class="sk-masa ${julat === k ? 'aktif' : ''}" data-julat="${k}" aria-pressed="${julat === k}">${l}</button>`).join('')}</div>
        ${ev.length ? `<div class="sk-kad">${kol.map(n => `<div class="sk-p ${n === A.active ? 'aktif' : ''}"><b>${raja.includes(n) ? '👑 ' : ''}${esc(n)}</b><div class="bt">⭐ ${bt(n)}</div><small>bintang terbaik</small><small>✅ ${P[n].lulus} lulus · 🎮 ${P[n].main} main</small></div>`).join('')}</div>
        ${baris || tanpa ? `<div class="sk-skrol"><table class="sk-jadual"><thead><tr><th scope="col">Tahap</th>${kol.map(n => `<th scope="col">${esc(n)}</th>`).join('')}</tr></thead><tbody>${baris}${tanpa}</tbody></table></div>` : ''}`
        : `<p class="sk-nota">Belum ada skor ${bila}. Pilih nama di atas, kemudian main mana-mana tahap.</p>`}
        <p class="sk-kecil" style="margin-top:8px">⭐ = bintang terbaik setiap tahap (🏠 Mod Rumah, 💊 Mod Farmasi). 👑 = paling banyak bintang.</p></div>
      ${terkini ? `<div class="sk-kotak"><h2>🕘 Main terkini</h2><div class="sk-skrol"><table class="sk-jadual"><tbody>${terkini}</tbody></table></div>
        <button type="button" class="sk-padam" data-padam>🗑 Padam semua skor</button></div>` : ''}
      <p class="sk-kecil">🔐 Skor disimpan dalam peranti ini sahaja. Bab yang terbuka, syiling dan kad dikongsi semua pemain dalam peranti ini.</p></div>`;
  }
  // The Dunia Sai 🏠 and 💬 side buttons would cover the sheet, so hide them while it is open
  const sisi = on => ['ds-balik', 'ds-komen'].forEach(id => { const x = document.getElementById(id); if (x) x.style.visibility = on ? '' : 'hidden'; });
  function buka() { modal = null; tambah = false; lukis(); el.classList.add('buka'); el.scrollTop = 0; sisi(false); ruangHenti(); }
  function tutup() { el.classList.remove('buka'); sisi(true); }
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if ('tutup' in b.dataset) tutup();
    else if (b.dataset.pilih && window.DSAnak) { DSAnak.choose(b.dataset.pilih); lukis(); }
    else if ('tambah' in b.dataset) { tambah = true; lukis(); const i = el.querySelector('#skBaru'); if (i) i.focus(); }
    else if (b.dataset.julat) { julat = b.dataset.julat; lukis(); }
    else if ('padam' in b.dataset) { if (confirm('Padam semua skor dalam Papan Skor? Bab, syiling dan kad tidak terjejas.')) { try { localStorage.removeItem(KEY); } catch (er) {} lukis(); } }
  });
  el.addEventListener('submit', e => { e.preventDefault(); const v = el.querySelector('#skBaru').value; if (v.trim() && window.DSAnak) { DSAnak.add(v); tambah = false; lukis(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && el.classList.contains('buka')) tutup(); });
  return { rekod, buka, pemain };
})();

/* ---------- Dunia Sai: skrin Mod Pameran ---------- */
function lukisPameran() {
  latarMenu();
  txt('Misi Selamat Ubat', 330, 70, 50, '#2E7D32'); txt('CABARAN PAMERAN 60 SAAT', 330, 118, 26, '#E65100');

  const p = 1 + Math.sin(masa * 4) * 0.035;
  ctx.save(); ctx.translate(330, 530); ctx.scale(p, p); butang(-200, -50, 400, 100, 'MULA ▶', () => { pamBaru = null; mulaTahap('P'); }, { warna: '#66BB6A', sz: 44, r: 30 }); ctx.restore();
  zonKlik[zonKlik.length - 1] = { x: 130, y: 480, w: 400, h: 100, fn: () => { pamBaru = null; mulaTahap('P'); } };
  txt('Permainan pendidikan keselamatan ubat oleh Dunia Sai. Tidak bergabung dengan KKM.', 330, 640, 14, '#6D4C41', 'center', false, 600);
  // papan skor
  box(660, 40, 580, 640, 26, '#FFF8E1');
  bintang(720, 92, 22); txt('10 Skor Tertinggi', 960, 92, 32, OUT);
  if (!pam.skor.length) txt('Belum ada skor. Jadilah yang pertama!', 950, 330, 22, '#6D4C41', 'center', false);
  pam.skor.forEach((r, i) => {
    const y = 140 + i * 52, baru = pamBaru && pamBaru.i === i;
    box(690, y, 520, 44, 14, baru ? '#FFF59D' : i < 3 ? '#FFFFFF' : 'rgba(255,255,255,.6)', baru ? '#F9A825' : OUT, baru ? 4 : 2);
    if (i < 3) circ(722, y + 22, 16, ['#FFC107', '#B0BEC5', '#D7A86E'][i], OUT, 2);
    txt(String(i + 1), 722, y + 23, 18, OUT);
    txt(r.n, 756, y + 23, 22, OUT, 'left', true, 280);
    txt(String(r.s), 1190, y + 23, 24, '#2E7D32', 'right');
  });
  if (pamBaru && pamBaru.t > 0) { box(380, 600, 520, 54, 20, '#1565C0'); txt(pamBaru.i >= 0 ? 'Tahniah ' + pamBaru.n + '! Kedudukan #' + (pamBaru.i + 1) : 'Skor ' + pamBaru.s + ' · Cuba lagi untuk masuk 10 teratas!', 640, 628, 22, '#FFFFFF', 'center', true, 500); }
  // zon staf (tekan & tahan penjuru kanan atas)
  if (pamTahan) { const f = had((masa - pamTahan) / 3, 0, 1); ctx.beginPath(); ctx.arc(W - 40, 40, 22, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.lineWidth = 6; ctx.strokeStyle = '#8D6E63'; ctx.stroke(); }
}
const PAPAN = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
function lukisNamaPameran() {
  latarMenu(); const r = hasil;
  box(140, 24, 1000, 672, 34, '#FFF8E1');
  txt('Masa tamat!', 640, 70, 40, '#2E7D32');
  txt('Skor anda: ' + r.skor, 640, 122, 46, OUT);
  txt('Betul ' + r.betul + ' · Salah ' + r.salah, 640, 166, 20, '#6D4C41', 'center', false);
  txt('Taip nama panggilan (bukan nama penuh):', 640, 208, 20, '#5D4037', 'center', false);
  box(390, 228, 500, 64, 16, '#FFFFFF', OUT, 3);
  txt(pamNama + (Math.floor(masa * 2) % 2 ? '|' : ''), 640, 261, 34, OUT);
  const kw = 84, kh = 62, gap = 10;
  PAPAN.forEach((row, ri) => {
    const lebar = row.length * kw + (row.length - 1) * gap, x0 = (W - lebar) / 2, y = 312 + ri * (kh + gap);
    [...row].forEach((c, ci) => butang(x0 + ci * (kw + gap), y, kw, kh, c, () => { if (pamNama.length < 10) pamNama += c; pamSentuh = masa; }, { warna: '#FFFFFF', sz: 28, r: 12 }));
  });
  const y4 = 312 + 3 * (kh + gap);
  butang(250, y4, 200, kh, '⌫ Padam', () => { pamNama = pamNama.slice(0, -1); pamSentuh = masa; }, { warna: '#FFCC80', sz: 22, r: 12 });
  butang(470, y4, 340, kh, 'Ruang', () => { if (pamNama.length < 10 && pamNama && !pamNama.endsWith(' ')) pamNama += ' '; pamSentuh = masa; }, { warna: '#FFFFFF', sz: 22, r: 12 });
  butang(830, y4, 200, kh, 'SIAP ✓', simpanSkorPam, { warna: '#66BB6A', sz: 24, r: 12 });
  txt('Skrin kembali sendiri selepas 30 saat tanpa sentuhan.', 640, 668, 15, '#8D6E63', 'center', false);
}
function lukisModalPam() {
  ctx.fillStyle = 'rgba(62,39,35,.6)'; ctx.fillRect(0, 0, W, H); zonKlik.push(HALANG);
  box(330, 150, 620, 420, 30, '#FFF8E1');
  if (modal.jenis === 'masukPam') {
    txt('Mod Pameran', 640, 200, 34, '#2E7D32');
    balut('Untuk staf di pameran: cabaran 60 saat dengan papan skor 10 teratas. Butang 🏠 disembunyikan supaya pengunjung tidak keluar.', 640, 250, 540, 20, OUT);
    balut('Untuk keluar: tekan dan tahan penjuru kanan atas skrin pameran selama 3 saat.', 640, 350, 540, 19, '#C62828', 'center', true);
    butang(370, 470, 260, 66, 'Batal', () => { modal = null; }, { warna: '#FFFFFF' });
    butang(650, 470, 260, 66, 'Mula Pameran', masukPameran, { warna: '#66BB6A', sz: 24 });
  } else {
    txt('Menu Staf', 640, 200, 34, '#2E7D32');
    butang(410, 250, 460, 66, 'Tutup', () => { modal = null; pamSentuh = masa; }, { warna: '#FFFFFF' });
    butang(410, 336, 460, 66, modal.sah ? 'Tekan sekali lagi untuk padam' : 'Kosongkan Papan Skor', () => { if (modal.sah) { pam.skor = []; pamBaru = null; tulisPam(); modal = null; } else modal.sah = true; }, { warna: modal.sah ? '#EF5350' : '#FFB300', sz: 22 });
    butang(410, 422, 460, 66, 'Keluar Mod Pameran', keluarPameran, { warna: '#90CAF9', sz: 22 });
  }
}
function kemasPameran(dt) {
  if (pamBaru && pamBaru.t > 0) pamBaru.t -= dt;
  if (skrin === 'pameran' && pamTahan && ptr.turun && masa - pamTahan >= 3) { pamTahan = null; modal = { jenis: 'staf' }; }
  if (skrin === 'pameran' && !ptr.turun) pamTahan = null;
  if (skrin === 'namaPameran' && masa - pamSentuh > 30) simpanSkorPam();
  if (pam.aktif && skrin === 'pameran' && modal && modal.jenis === 'staf' && masa - pamSentuh > 60) modal = null;
}

/* ---------- 10. INPUT & GELUNG UTAMA ---------- */
function kedudukan(e) { const r = cv.getBoundingClientRect(), kx = cv.width / (r.width || 1), ky = cv.height / (r.height || 1); return { x: ((e.clientX - r.left) * kx - ox) / skala, y: ((e.clientY - r.top) * ky - oy) / skala }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Bunyi.mula();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const p = kedudukan(e); ptr.x = p.x; ptr.y = p.y; ptr.turun = true; pamSentuh = masa;
  if (skrin === 'pameran' && !modal && p.x > W - 110 && p.y < 100) { pamTahan = masa; return; }
  for (let i = zonKlik.length - 1; i >= 0; i--) if (dalam(p.x, p.y, zonKlik[i])) { if (zonKlik[i] !== HALANG) Bunyi.klik(); zonKlik[i].fn(); return; }
  if (skrin === 'main' && !modal && g) { if (g.mod === 'A') tekanA(p.x, p.y); else tekanB(p.x, p.y); }
});
cv.addEventListener('pointermove', e => {
  const p = kedudukan(e); ptr.x = p.x; ptr.y = p.y;
  if (skrin === 'main' && !modal && g && ptr.turun) { if (g.mod === 'A') gerakA(p.x, p.y); else gerakB(p.x, p.y); }
});
function lepas(e) {
  const p = kedudukan(e); ptr.turun = false;
  if (skrin === 'main' && g) { if (g.mod === 'A') lepasA(p.x, p.y); else lepasB(p.x, p.y); }
}
cv.addEventListener('pointerup', lepas); cv.addEventListener('pointercancel', lepas);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', ubahSaiz); window.addEventListener('orientationchange', ubahSaiz);
document.addEventListener('visibilitychange', () => { if (document.hidden && skrin === 'main' && g && !g.habis && !modal) modal = { jenis: 'jeda' }; });

function kemas(dt) {
  Bunyi.kemasBgm(skrin === 'main' ? 'main' : 'menu');
  if (skrin === 'main' && g && !modal) kemasMain(dt);
  kemasPameran(dt);
  for (const z of zarah) { z.t -= dt; z.x += z.vx * dt; z.y += z.vy * dt; z.vy += 520 * dt; z.pusing += dt * 5; }
  zarah = zarah.filter(z => z.t > 0);
  for (const a of apung) { a.t -= dt; a.y -= dt * 14; }
  apung = apung.filter(a => a.t > 0);
}
function lukis() {
  zonKlik = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#FFE9B8'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(skala, 0, 0, skala, ox, oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (skrin === 'tajuk') lukisTajuk();
  else if (skrin === 'peta') lukisPeta();
  else if (skrin === 'kedai') lukisKedai();
  else if (skrin === 'kad') lukisKoleksi();
  else if (skrin === 'main') lukisMain();
  else if (skrin === 'keputusan') lukisKeputusan();
  else if (skrin === 'pameran') lukisPameran();
  else if (skrin === 'namaPameran') lukisNamaPameran();
  if (modal) { if (modal.jenis === 'masukPam' || modal.jenis === 'staf') lukisModalPam(); }
  if (modal) { if (modal.jenis === 'taklimat') lukisTaklimat(); else if (modal.jenis === 'kad') lukisKadBesar(); else if (modal.jenis === 'jeda') lukisJeda(); }
  lukisKesan();
  ctx.restore();
}
let lalu = 0;
function gelung(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lalu) / 1000)); lalu = t; masa += dt;
  kemas(dt); lukis(); requestAnimationFrame(gelung);
}
if (pam.aktif) { skrin = 'pameran'; setTimeout(() => pamUiDs(true), 0); addEventListener('load', () => pamUiDs(true)); }
ubahSaiz(); requestAnimationFrame(t => { lalu = t; requestAnimationFrame(gelung); });
</script>
