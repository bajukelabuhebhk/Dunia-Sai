<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kenal Jawi · Dunia Sai</title>
  <meta name="theme-color" content="#23855a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/shared/icons/favicon.png">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/css/theme.css">
  <style>
    .papan-huruf {
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    }
    .papan-huruf button {
      position: relative;
      display: grid; place-items: center; gap: 0;
      aspect-ratio: 1; padding: 4px;
      background: var(--kertas); color: var(--dakwat);
      border: 0; border-radius: var(--r-tile); cursor: pointer;
      box-shadow: inset 0 0 0 3px var(--garis), 0 5px 0 0 var(--garis);
      touch-action: manipulation;
    }
    .papan-huruf button:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px var(--garis), 0 2px 0 0 var(--garis); }
    .papan-huruf .huruf { font: 700 2.1rem/1.3 var(--font-jawi); }
    .papan-huruf .nama { font-size: 0.8rem; color: var(--dakwat-lembut); direction: ltr; }
    .papan-huruf button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--hijau), 0 5px 0 0 var(--hijau); background: var(--hijau-muda); }
    .papan-huruf button.dilihat .nama::after { content: ' ✓'; color: var(--hijau); }

    .butiran {
      background: var(--kertas); border-radius: var(--r-card);
      padding: 20px; margin-bottom: 20px;
      box-shadow: inset 0 0 0 3px var(--hijau-muda);
    }
    .butiran-atas { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .huruf-besar {
      font: 700 6rem/1.25 var(--font-jawi); color: var(--hijau);
      min-width: 1.4em; text-align: center;
    }
    .bentuk {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px;
      direction: rtl;
    }
    .bentuk div {
      text-align: center; padding: 8px 4px; border-radius: var(--r-tile); background: var(--kapur);
    }
    .bentuk .glif { font: 700 2.6rem/1.5 var(--font-jawi); display: block; }
    .bentuk .label { font-size: var(--t-sm); color: var(--dakwat-lembut); direction: ltr; display: block; }
    .bentuk .tiada .glif { color: var(--garis); }

    /* Nakhoda: voyage strip */
    .laut {
      position: relative; height: 72px; margin: 8px 0 16px;
      border-radius: var(--r-card);
      background:
        repeating-linear-gradient(90deg, transparent 0 22px, rgb(255 255 255 / .35) 22px 30px) 0 70% / 100% 4px no-repeat,
        linear-gradient(#7fc4e8, #3b8fc4);
      overflow: hidden;
    }
    .laut .pulau { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 2.2rem; }
    .laut .kapal {
      position: absolute; top: 50%; font-size: 2.4rem;
      right: calc(8px + var(--jarak, 0%) * 0.82);
      transform: translateY(-55%) scaleX(1);
      transition: right 500ms ease;
    }
    .pelayaran-senarai { display: grid; gap: 12px; max-width: 560px; margin-inline: auto; }
    .pelayaran {
      position: relative;
      display: flex; align-items: center; gap: 14px; text-align: left;
      padding: 14px 16px; width: 100%;
      font: inherit; color: var(--dakwat); background: var(--kertas);
      border: 0; border-radius: var(--r-card); cursor: pointer;
      box-shadow: inset 0 0 0 3px var(--garis), 0 5px 0 0 var(--garis);
    }
    .pelayaran .no {
      display: grid; place-items: center; flex: none;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--hijau); color: #fff; font-weight: 700; font-size: var(--t-md);
    }
    .pelayaran strong { display: block; }
    .pelayaran small { color: var(--dakwat-lembut); }
    .pelayaran .skor { margin-left: auto; white-space: nowrap; }
    .soalan-jawi { font: 700 5rem/1.4 var(--font-jawi); color: var(--hijau); text-align: center; margin: 0; }
    .grid-pilihan .pilihan.jawi { font-size: 2.6rem; font-family: var(--font-jawi); }
  </style>
</head>
<body>
  <header class="app-bar">
    <a class="balik" href="/app/" aria-label="Kembali ke semua aplikasi">‹</a>
    <h1>Kenal Jawi</h1>
    <span class="bintang-kiraan" aria-label="Jumlah bintang">⭐ <span data-bintang>0</span></span>
  </header>

  <nav class="tab-bar" role="tablist" aria-label="Aktiviti">
    <button role="tab" aria-controls="kenal">Kenal Huruf</button>
    <button role="tab" aria-controls="nakhoda">Nakhoda Jawi</button>
  </nav>

  <!-- Kenal Jawi: 37-letter chart, read right to left -->
  <section id="kenal" class="panel" role="tabpanel" aria-label="Kenal huruf Jawi">
    <div class="butiran" id="butiran" aria-live="polite"></div>
    <div class="papan-huruf" id="papan" dir="rtl"></div>
    <p style="margin-top:16px;color:var(--dakwat-lembut);font-size:var(--t-sm)">37 huruf Jawi mengikut susunan yang digunakan oleh Dewan Bahasa dan Pustaka. Tekan huruf untuk melihat bentuk tunggal dan bentuk sambungnya.</p>
  </section>

  <!-- Nakhoda Jawi: voyage quiz -->
  <section id="nakhoda" class="panel" role="tabpanel" aria-label="Permainan Nakhoda Jawi" hidden>
    <div id="nakhoda-isi"></div>
  </section>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/storage.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script>
  (() => {
    const MOD = 'jawi';
    const { sound, speak, toast, pujian, shuffle, choices, esc, gate, showResult } = EduUI;
    const FREE_LETTERS = 10;
    const ZWJ = '‍';

    // [glyph, name, sound hint, joins to the next letter]
    const HURUF = [
      ['ا','Alif','a',false], ['ب','Ba','b',true], ['ت','Ta','t',true], ['ة','Ta marbutah','t / h',false],
      ['ث','Sa','s',true], ['ج','Jim','j',true], ['ح','Ha','h',true], ['چ','Ca','c',true],
      ['خ','Kha','kh',true], ['د','Dal','d',false], ['ذ','Zal','z',false], ['ر','Ra','r',false],
      ['ز','Zai','z',false], ['س','Sin','s',true], ['ش','Syin','sy',true], ['ص','Sad','s',true],
      ['ض','Dad','d',true], ['ط','Ta','t',true], ['ظ','Za','z',true], ['ع','Ain','a',true],
      ['غ','Ghain','gh',true], ['ڠ','Nga','ng',true], ['ف','Fa','f',true], ['ڤ','Pa','p',true],
      ['ق','Qaf','q',true], ['ک','Kaf','k',true], ['ݢ','Ga','g',true], ['ل','Lam','l',true],
      ['م','Mim','m',true], ['ن','Nun','n',true], ['و','Wau','w',false], ['ۏ','Va','v',false],
      ['ه','Ha','h',true], ['ء','Hamzah','ʼ',false], ['ي','Ya','y',true], ['ى','E','e',true],
      ['ڽ','Nya','ny',true],
    ].map(([g, nama, bunyi, sambung], i) => ({ i, g, nama, bunyi, sambung, id: 'h' + i }));

    // Forms rendered with zero-width joiners so the browser shapes them
    function bentuk(h) {
      const noLink = h.g === 'ء';
      const finalOnly = h.g === 'ة';
      return {
        tunggal: h.g,
        awal: h.sambung && !finalOnly ? h.g + ZWJ : null,
        tengah: h.sambung && !finalOnly ? ZWJ + h.g + ZWJ : null,
        akhir: noLink ? null : ZWJ + h.g,
      };
    }
    const LABEL = { tunggal: 'Tunggal', awal: 'Awal', tengah: 'Tengah', akhir: 'Akhir' };
    const isFree = (h) => h.i < FREE_LETTERS;
    // Ha (ح) and Ha (ه) share a name; tell them apart for speech and answers
    const label = (h) => h.i === 32 ? 'Ha (simpul)' : h.i === 6 ? 'Ha (pedas)' : h.i === 17 ? 'Ta (tebal)' : h.i === 2 ? 'Ta (nipis)' : h.nama;

    // ---------- Kenal Huruf ----------
    const papan = document.getElementById('papan');
    const butiran = document.getElementById('butiran');

    function renderPapan() {
      const seen = EduStore.getProgress(MOD).seen;
      const open = EduStore.hasAccess(MOD);
      papan.innerHTML = HURUF.map((h) => `
        <button type="button" data-i="${h.i}" class="${seen[h.id] ? 'dilihat' : ''} ${!open && !isFree(h) ? 'kunci' : ''}"
          aria-label="${esc(label(h))}${!open && !isFree(h) ? ', berkunci' : ''}">
          <span class="huruf" lang="ms-Arab">${h.g}</span>
          <span class="nama">${esc(h.nama)}</span>
        </button>`).join('');
    }

    function pilihHuruf(h, announce = true) {
      if (!gate(MOD, isFree(h), refreshAll)) return;
      papan.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.i == h.i));
      const f = bentuk(h);
      butiran.innerHTML = `
        <div class="butiran-atas">
          <div class="huruf-besar" lang="ms-Arab">${h.g}</div>
          <div>
            <h2 style="margin:0">${esc(h.nama)}</h2>
            <p style="margin:0 0 10px;color:var(--dakwat-lembut)">Bunyi: ${esc(h.bunyi)} · Huruf ke-${h.i + 1}</p>
            <button class="btn btn-hijau btn-kecil" data-dengar>🔊 Dengar</button>
          </div>
        </div>
        <div class="bentuk">
          ${Object.entries(f).map(([k, v]) => `
            <div class="${v ? '' : 'tiada'}">
              <span class="glif" lang="ms-Arab">${v || '—'}</span>
              <span class="label">${LABEL[k]}</span>
            </div>`).join('')}
        </div>
        ${h.sambung ? '' : `<p style="margin:12px 0 0;font-size:var(--t-sm);color:var(--dakwat-lembut)">${esc(h.nama)} tidak bersambung dengan huruf selepasnya.</p>`}`;
      butiran.querySelector('[data-dengar]').onclick = () => speak(h.nama);
      if (announce) {
        sound('click');
        speak(h.nama);
        if (butiran.getBoundingClientRect().top < 0) {
          butiran.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        }
      }
      EduStore.markSeen(MOD, h.id);
      papan.querySelector(`[data-i="${h.i}"]`)?.classList.add('dilihat');
    }

    papan.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (b) pilihHuruf(HURUF[+b.dataset.i]);
    });

    // ---------- Nakhoda Jawi ----------
    const PELAYARAN = [
      { id: 'p1', nama: 'Pelayaran 1', ket: 'Huruf Alif hingga Kha, bentuk tunggal', dari: 0, ke: 10, jenis: 'tunggal', free: true },
      { id: 'p2', nama: 'Pelayaran 2', ket: 'Huruf Dal hingga Ain, bentuk tunggal', dari: 9, ke: 20, jenis: 'tunggal' },
      { id: 'p3', nama: 'Pelayaran 3', ket: 'Huruf Ghain hingga Nya, bentuk tunggal', dari: 20, ke: 37, jenis: 'tunggal' },
      { id: 'p4', nama: 'Pelayaran 4', ket: 'Semua huruf, bentuk tunggal', dari: 0, ke: 37, jenis: 'tunggal' },
      { id: 'p5', nama: 'Pelayaran 5', ket: 'Bentuk sambung: awal, tengah dan akhir', dari: 0, ke: 37, jenis: 'sambung' },
    ];
    const SOALAN = 8;
    const isi = document.getElementById('nakhoda-isi');

    function renderSenarai() {
      const p = EduStore.getProgress(MOD);
      const open = EduStore.hasAccess(MOD);
      isi.innerHTML = `
        <p class="soalan" style="font-size:var(--t-md)">Bawa kapal ke pulau dengan menjawab ${SOALAN} soalan.</p>
        <div class="pelayaran-senarai">
          ${PELAYARAN.map((v, n) => {
            const s = p.stars[v.id] || 0;
            const locked = !open && !v.free;
            return `<button class="pelayaran ${locked ? 'kunci' : ''}" data-v="${n}">
              <span class="no">${n + 1}</span>
              <span><strong>${v.nama}</strong><small>${v.ket}</small></span>
              <span class="skor" aria-label="${s} bintang">${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>
            </button>`;
          }).join('')}
        </div>`;
    }

    isi.addEventListener('click', (e) => {
      const b = e.target.closest('[data-v]');
      if (!b) return;
      const v = PELAYARAN[+b.dataset.v];
      if (gate(MOD, v.free, refreshAll)) mulaPelayaran(+b.dataset.v);
    });

    function buatSoalan(v) {
      const pool = HURUF.slice(v.dari, v.ke);
      const qs = [];
      for (let n = 0; n < SOALAN; n++) {
        const h = pool[Math.floor(Math.random() * pool.length)];
        if (v.jenis === 'sambung') {
          const f = bentuk(h);
          const jenis = shuffle(['awal', 'tengah', 'akhir'].filter((k) => f[k]))[0];
          if (!jenis) { n--; continue; }
          qs.push({ jenis: 'bentuk', h, paparan: f[jenis], bentukNama: LABEL[jenis].toLowerCase(),
            pilihan: choices(pool, h, 4, (a, b) => a.i === b.i) });
        } else if (n % 2 === 0) {
          qs.push({ jenis: 'cari', h, pilihan: choices(pool, h, 4, (a, b) => a.i === b.i) });
        } else {
          qs.push({ jenis: 'nama', h, pilihan: choices(pool, h, 4, (a, b) => a.i === b.i) });
        }
      }
      return qs;
    }

    function mulaPelayaran(vi) {
      const v = PELAYARAN[vi];
      const qs = buatSoalan(v);
      let q = 0, betul = 0;

      function tunjuk() {
        if (q >= qs.length) {
          return showResult(isi, {
            moduleId: MOD, activityId: v.id, correct: betul, total: qs.length,
            onAgain: () => mulaPelayaran(vi),
            onNext: vi + 1 < PELAYARAN.length ? () => { renderSenarai(); } : null,
          });
        }
        const s = qs[q];
        const tanya = s.jenis === 'cari'
          ? `<p class="soalan">Cari huruf <span style="color:var(--hijau)">${esc(label(s.h))}</span></p>`
          : `<p class="soalan">${s.jenis === 'bentuk' ? `Huruf apakah ini? <small style="display:block;font-size:var(--t-sm);color:var(--dakwat-lembut)">bentuk ${s.bentukNama}</small>` : 'Huruf apakah ini?'}</p>
             <p class="soalan-jawi" lang="ms-Arab">${s.jenis === 'bentuk' ? s.paparan : s.h.g}</p>`;
        isi.innerHTML = `
          <div class="laut" aria-hidden="true" style="--jarak:${(betul / qs.length) * 100}%">
            <span class="pulau">🏝️</span><span class="kapal">⛵</span>
          </div>
          <p style="text-align:center;margin:0 auto 4px;color:var(--dakwat-lembut);font-size:var(--t-sm)">Soalan ${q + 1} daripada ${qs.length}</p>
          ${tanya}
          <div class="grid-pilihan">
            ${s.pilihan.map((h, n) => `<button class="pilihan ${s.jenis === 'cari' ? 'jawi' : ''}" data-n="${n}"
              ${s.jenis === 'cari' ? 'lang="ms-Arab"' : ''}>${s.jenis === 'cari' ? h.g : esc(label(h))}</button>`).join('')}
          </div>
          <p style="text-align:center;margin-top:20px"><button class="btn btn-garis btn-kecil" data-keluar>Berhenti belayar</button></p>`;
        if (s.jenis === 'cari') speak(s.h.nama);
        isi.querySelector('[data-keluar]').onclick = renderSenarai;
        isi.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => jawab(b, s));
      }

      function jawab(btn, s) {
        const pilih = s.pilihan[+btn.dataset.n];
        const ok = pilih.i === s.h.i;
        isi.querySelectorAll('[data-n]').forEach((b) => (b.disabled = true));
        if (ok) {
          betul++;
          btn.classList.add('betul');
          sound('correct');
          toast(pujian());
          isi.querySelector('.laut').style.setProperty('--jarak', `${(betul / qs.length) * 100}%`);
        } else {
          btn.classList.add('salah');
          sound('wrong');
          const idx = s.pilihan.findIndex((h) => h.i === s.h.i);
          isi.querySelector(`[data-n="${idx}"]`).classList.add('betul');
          toast(`Jawapannya ${label(s.h)}`);
        }
        q++;
        setTimeout(tunjuk, ok ? 900 : 1600);
      }
      sound('click');
      tunjuk();
    }

    function refreshAll() {
      renderPapan();
      renderSenarai();
    }

    EduUI.initModule(MOD);
    refreshAll();
    pilihHuruf(HURUF[0], false);
  })();
  </script>
</body>
</html>
