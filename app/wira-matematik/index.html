<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wira Matematik</title>
<meta name="theme-color" content="#0f4c3a">
<style id="wm-rpg2-css">
/* Wira Matematik RPG 2.0 — additive styles; original theme remains intact. */
.rpg-ribbon{background:linear-gradient(110deg,#246c58,#244f83);border:2px solid rgba(255,255,255,.2);border-radius:20px;padding:12px;display:grid;gap:10px}
.rpg-hub-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.15rem;font-weight:800}
.rpg-statline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.9rem;font-weight:800}
.rpg-xp{height:10px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;flex:1;min-width:80px}
.rpg-xp>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#58d6ff,#ffe17a)}
.rpg-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.rpg-nav button,.rpg-smallbtn{min-height:46px;border:0;background:#fdf6e3;color:#123b2e;border-radius:13px;padding:7px 5px;font-weight:800;font-size:.86rem;box-shadow:0 3px 0 #baac88;cursor:pointer}
.rpg-nav button:active,.rpg-smallbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #baac88}
.rpg-world-note{font-size:.86rem;color:#e3fce9;text-align:center;background:rgba(0,0,0,.2);border-radius:10px;padding:6px}
.rpg-side-quest{width:100%;min-height:44px;margin-top:10px;background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.45);border-radius:12px;font-size:.9rem;font-weight:800;cursor:pointer}
.rpg-side-quest:disabled{opacity:.5;cursor:default}
.rpg-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#e2f7d7;color:#14532d;font-weight:800;font-size:.8rem}
.rpg-tag{display:inline-block;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.15);font-size:.82rem;font-weight:800}
.rpg-section-title{font-size:1.25rem;font-weight:800;margin:0}
.rpg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.rpg-panel{background:#fdf6e3;color:#123b2e;border-radius:21px;padding:14px;display:grid;gap:9px}
.rpg-panel h2{font-size:1.3rem;margin:0;line-height:1.1}
.rpg-panel p{margin:0;color:#4a6b5e;font-size:1rem;line-height:1.3;font-weight:700}
.rpg-hero-preview{width:150px;height:150px;max-width:100%;margin:auto;filter:drop-shadow(0 6px 3px rgba(0,0,0,.1))}
.rpg-hero-preview svg{width:100%;height:100%;overflow:visible}
.rpg-gear-card{border:3px solid #d4dcbf;background:#fffdf3;color:#123b2e;border-radius:17px;padding:10px 7px;display:grid;gap:5px;justify-items:center;text-align:center;min-height:143px}
.rpg-gear-card.selected{border-color:#38a169;background:#eafce8}
.rpg-gear-card.locked{opacity:.7;filter:grayscale(.35)}
.rpg-gear-icon{font-size:2.4rem;line-height:1.1}
.rpg-gear-name{font-size:.95rem;font-weight:800;line-height:1.1}
.rpg-gear-note{font-size:.75rem;color:#526d5f;line-height:1.1}
.rpg-gear-card button{min-height:44px;width:100%;font-size:.85rem;font-weight:800;background:#ffb703;color:#123b2e;border:0;border-radius:10px;cursor:pointer}
.rpg-gear-card button:disabled{background:#d5dacd;cursor:default}
.rpg-slot-label{font-size:1rem;color:#bbebd5;font-weight:800;margin-top:8px}
.rpg-mastery-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:10px 12px;border-radius:14px;background:#fdf6e3;color:#123b2e;align-items:center}
.rpg-mastery-row small{display:block;color:#4a6b5e;font-weight:700}
.rpg-mastery-track{grid-column:1/-1;height:8px;background:#d6e4d8;border-radius:10px;overflow:hidden}
.rpg-mastery-track i{display:block;height:100%;background:#3fbf7f;border-radius:10px}
.rpg-battle-phase{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;background:rgba(17,45,57,.82);color:#fff;border-radius:99px;padding:4px 9px;font-size:.77rem;font-weight:800;pointer-events:none;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.rpg-stage-chip{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.4);color:#fff;border-radius:10px;padding:3px 9px;font-size:.75rem;font-weight:800;pointer-events:none}
.rpg-power{display:flex;align-items:center;justify-content:center;gap:8px;min-height:45px}
.rpg-power button{min-height:44px;min-width:180px;padding:7px 12px;border:0;border-radius:12px;color:#14372b;background:#94e6dd;font-weight:800;font-size:.92rem;box-shadow:0 3px 0 #2c9c95;cursor:pointer}
.rpg-power button:disabled{opacity:.5;filter:grayscale(.4);cursor:default}
.rpg-power .charge{font-weight:800;color:#ffe17a;letter-spacing:1px}
.rpg-question{font-size:clamp(1.22rem,4.4vw,1.7rem);line-height:1.2;font-weight:800;display:block;padding-top:4px}
.rpg-question-visual{font-size:1.3rem;line-height:1.25;padding:7px 4px;word-break:break-word}
.rpg-data-bars{font-size:.97rem;font-weight:800;line-height:1.3;text-align:left;display:inline-block;white-space:nowrap}
.rpg-question-answer{display:block;font-size:1.18rem;margin-top:5px;color:#24865a}
.rpg-hint{font-size:.96rem;line-height:1.3;padding:6px;color:#244f4e;font-weight:800}
.rpg-tip{font-size:.9rem;line-height:1.2;margin-top:7px;background:#fff1c9;border-radius:10px;padding:5px 7px;font-weight:800;color:#805315}
.rpg-battle-choices .ans{font-size:clamp(1.05rem,4.6vw,1.8rem);min-height:58px;padding:8px 3px;overflow-wrap:anywhere}
.rpg-interact{display:grid;gap:9px;justify-items:center;width:100%;background:rgba(255,255,255,.45);border-radius:17px;padding:12px;color:#123b2e}
.rpg-sort-tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.rpg-sort-tile{font-size:1.4rem;min-width:64px;min-height:51px;padding:6px 12px;background:#fffdf5;border:3px solid #3979c5;color:#123b2e;border-radius:13px;font-weight:800;cursor:pointer}
.rpg-sort-tile:disabled{opacity:.35}
.rpg-sort-progress{min-height:34px;font-size:1.18rem;font-weight:800;letter-spacing:.04em}
.rpg-submit{background:#ffb703!important;color:#123b2e!important;min-width:150px;min-height:50px;border:0;border-radius:14px;font-size:1.15rem!important;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #c98a00}
.rpg-counter{display:flex;align-items:center;justify-content:center;gap:15px}
.rpg-counter button{width:54px;height:54px;border:0;border-radius:15px;background:#3979c5;color:white;font-size:2rem;font-weight:800;cursor:pointer}
.rpg-counter output{font-size:2.3rem;font-weight:800;min-width:80px;text-align:center}
.rpg-object-row{font-size:1.4rem;max-width:100%;word-break:break-word}
.rpg-quest-scene{background:linear-gradient(150deg,#327c73,#3f638c);color:#fff;border-radius:20px;padding:14px;text-align:center;display:grid;gap:8px}
.rpg-npc{font-size:3.1rem;line-height:1}
.rpg-quest-progress{font-weight:800;font-size:1rem;color:#ffdf70}
.rpg-quest-btn{min-height:44px}
.rpg-reward{background:#e1f7d7;border:2px solid #96c98e;padding:8px;border-radius:14px;font-weight:800;color:#205633}
.rpg-book-note{font-size:.9rem;color:#a9f7d1;text-align:center}
.app .langbtn{min-height:44px}
@media(max-width:360px){.rpg-nav button{font-size:.77rem}.rpg-battle-choices .ans{font-size:1.1rem}.rpg-gear-icon{font-size:1.9rem}.rpg-sort-tile{min-width:58px}}
@media(max-height:700px){.app .arena{height:205px}.rpg-power{min-height:40px}.rpg-power button{min-height:40px}.app .qcard{padding:9px 12px}.rpg-interact{padding:8px}}
@media(orientation:landscape) and (max-height:620px) and (min-width:650px){
  .app:has(.arena){max-width:1000px;gap:7px;padding-top:6px;padding-bottom:6px}
  #view:has(.arena){display:grid;grid-template-columns:minmax(250px,1fr) minmax(290px,1fr);grid-template-rows:auto auto auto 1fr;column-gap:12px;row-gap:7px;align-items:stretch}
  #view:has(.arena) .arena{grid-column:1;grid-row:1 / span 4;height:auto;min-height:225px}
  #view:has(.arena) .qcard{grid-column:2;grid-row:1}
  #view:has(.arena) .combo{grid-column:2;grid-row:2}
  #view:has(.arena) .rpg-power{grid-column:2;grid-row:3}
  #view:has(.arena) .answers{grid-column:2;grid-row:4;align-content:start;gap:7px}
  #view:has(.arena) .ans{min-height:45px;padding:4px 0}
  #view:has(.arena) .qtext{font-size:1.8rem}
  #view:has(.arena) .rpg-question{font-size:1.15rem}
  #view:has(.arena) .rpg-question-visual{font-size:1rem;padding:3px}
  #view:has(.arena) .unit{width:112px;height:112px}
  #view:has(.arena) .unit.boss{width:136px;height:136px}
}
@media(prefers-reduced-motion:reduce){.rpg-gear-card,.rpg-submit,.rpg-sort-tile{animation:none!important;transition:none!important}}

</style>

:root{
  --bg:#0f4c3a; --bg2:#14634b; --card:#fdf6e3; --ink:#123b2e; --soft:#4a6b5e;
  --mango:#ffb703; --mangoD:#c98a00; --coral:#ef6f6c; --coralD:#b24745;
  --leaf:#3fbf7f; --leafD:#24865a; --sky:#5ec8e5; --skyD:#2f93ad; --muted:#9fd3bf;
  --grape:#a78bfa; --grapeD:#7357d1; --pink:#ff7eb0; --pinkD:#c94f80;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* The game scrolls inside itself: itch.io's embed frame turns page scrolling off */
html{overflow:hidden}
body{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body{background:var(--bg);color:var(--card);font-family:var(--display);font-size:15px;
  background-image:radial-gradient(circle at 20% 10%,var(--bg2) 0 18%,transparent 19%),radial-gradient(circle at 85% 90%,var(--bg2) 0 22%,transparent 23%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
[hidden]{display:none!important}
button{font-family:inherit;touch-action:manipulation;color:inherit}
button:focus-visible{outline:3px solid var(--card);outline-offset:3px}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;
  padding-block:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.hl{display:flex;align-items:center;gap:8px;min-width:0}
h1{margin:0;font-size:1.45rem;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 10px;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{border:0;border-radius:14px;background:var(--mango);color:var(--ink);font-size:1.4rem;width:48px;height:48px;flex:none;cursor:pointer;box-shadow:0 4px 0 var(--mangoD)}
.langbtn{border:0;border-radius:999px;background:var(--card);color:var(--ink);font-weight:800;font-size:.95rem;padding:6px 9px;min-height:40px;cursor:pointer;box-shadow:0 3px 0 #c9b98d;white-space:nowrap;flex:none}
header>.hl:last-child{flex:none;gap:6px}
.sound{background:transparent;border:0;font-size:1.4rem;cursor:pointer;min-width:40px;min-height:44px;padding:0}
.sound.off{opacity:.35;filter:grayscale(1)}
#bgmBtn{font-size:1.6rem;font-weight:700}
.btn{font-weight:800;border:0;border-radius:18px;padding:12px 22px;cursor:pointer;font-size:1.2rem;background:var(--mango);color:var(--ink);box-shadow:0 5px 0 var(--mangoD)}
.btn.alt{background:var(--card);box-shadow:0 5px 0 #c9b98d}
.btn.big{font-size:1.6rem;padding:14px 30px;border-radius:22px}
.btn:active,.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mangoD)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:rgba(0,0,0,.2);border-radius:22px;padding:14px}
.panel h2{margin:0 0 8px;font-size:1.1rem;color:var(--muted);font-weight:700}
.note{font-size:.9rem;color:var(--muted);margin:0;text-align:center}
.demo{border:0;border-radius:18px;background:rgba(0,0,0,.25);color:var(--card);font-weight:700;font-size:1rem;padding:12px 14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.demo b{color:var(--mango)}
.par{border:0;background:none;color:var(--muted);font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:underline;padding:6px}
.lhint{font-size:1rem;color:var(--soft);font-weight:700}
.gate{position:relative;overflow:hidden;width:100%;max-width:280px;margin:0 auto;border:0;border-radius:18px;padding:16px;font:800 1.15rem var(--display);background:#e6dcbf;color:var(--ink);cursor:pointer;touch-action:none}
.gate i{position:absolute;inset:0;width:0;background:var(--leaf);opacity:.6}
.gate span{position:relative}
.lic{font:600 .95rem/1.35 ui-monospace,Menlo,Consolas,monospace;border:3px solid #e6dcbf;border-radius:16px;padding:10px;width:100%;max-width:420px;min-height:7.5em;background:#fff;color:var(--ink);margin:0 auto;resize:vertical;word-break:break-all;user-select:text;-webkit-user-select:text}
.licid{font-weight:800;font-size:1.3rem;letter-spacing:.06em;color:var(--ink);user-select:all;-webkit-user-select:all}
.msg{font-weight:800;min-height:1.4em}
.buy{border-top:2px dashed #e6dcbf;padding-top:12px;align-items:center;width:100%}
.btn.wa{background:var(--leaf);box-shadow:0 5px 0 var(--leafD);color:var(--ink);text-decoration:none}
.land .lockmsg.pay{font-size:1rem;font-weight:800;background:rgba(0,0,0,.4);border-radius:99px;padding:2px 10px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;cursor:pointer;padding:8px}

/* Home */
.title{text-align:center;padding-top:4px}
.title .t1{font-size:2.6rem;font-weight:800;line-height:1;color:var(--mango);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.title .t2{font-size:1.05rem;color:var(--muted);font-weight:700}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcard{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:1rem;box-shadow:0 6px 0 #c9b98d;opacity:.6;transition:transform .12s,opacity .12s}
.hcard svg{width:84px;height:84px}
.hcard.on{opacity:1;background:var(--mango);box-shadow:0 6px 0 var(--mangoD);transform:translateY(-3px)}
.hcard small{font-weight:700;font-size:.75rem;color:var(--soft)}
.hcard.on small{color:var(--ink)}
.lvl{display:flex;justify-content:space-around;text-align:center;font-weight:800;font-size:1.3rem}
.lvl small{display:block;font-size:.8rem;color:var(--muted);font-weight:700}

/* Map */
.land{border-radius:24px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.land .lt{display:flex;align-items:center;gap:10px}
.land .le{font-size:2.2rem;line-height:1}
.land b{font-size:1.25rem;display:block;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.land span.topic{font-size:.9rem;font-weight:700;background:rgba(0,0,0,.28);border-radius:99px;padding:0 10px;display:inline-block;margin-top:2px}
.nodes{display:flex;justify-content:space-around;margin-top:10px;gap:6px}
.node{border:0;width:30%;border-radius:18px;padding:6px 2px 4px;background:var(--card);color:var(--ink);cursor:pointer;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;font-size:.85rem;line-height:1.1}
.node .ni{font-size:1.7rem;line-height:1.2}
.node .ns{font-size:.95rem;letter-spacing:1px;min-height:1.1em}
.node.now{background:var(--mango);animation:bob 1.3s ease-in-out infinite}
.node.lock{opacity:.45;cursor:default}
.land.lockd{filter:grayscale(.85) brightness(.7)}
.land .lockmsg{position:absolute;right:12px;top:10px;font-size:1.6rem}
@keyframes bob{50%{transform:translateY(-4px)}}

/* Arena (look adapted from the Aetherium battle stage: glowing sky, perspective floor, breathing units, lunges, floating numbers) */
.arena{position:relative;height:250px;border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.arena .floor{position:absolute;bottom:0;left:-10%;right:-10%;height:42%;
  background-image:linear-gradient(to right,rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.14) 1px,transparent 1px);
  background-size:40px 40px;transform:perspective(420px) rotateX(60deg);transform-origin:bottom center;pointer-events:none}
.arena .deco{position:absolute;font-size:1.6rem;opacity:.55;pointer-events:none}
.unit{position:absolute;bottom:22px;width:124px;height:124px;display:flex;align-items:flex-end;justify-content:center}
.unit svg{width:100%;height:100%;overflow:visible}
.unit::after{content:"";position:absolute;bottom:-4px;left:18%;right:18%;height:12px;border-radius:50%;background:rgba(0,0,0,.28);z-index:-1}
.unit.hero{left:5%}
.unit.mon{right:5%}
.unit.boss{width:150px;height:150px;right:2%}
.body{width:100%;height:100%}
.anim-breathe{animation:breathe 3s ease-in-out infinite}
.anim-float{animation:floatSlow 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-5px) scaleY(1.03)}}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.lunge-r{animation:lungeR .45s cubic-bezier(.22,1,.36,1)}
.lunge-l{animation:lungeL .45s cubic-bezier(.22,1,.36,1)}
.hit{animation:hitShake .45s ease-in-out}
.cast{animation:castPulse .6s ease-in-out}
.faint{animation:faint .8s ease-in forwards}
@keyframes lungeR{40%{transform:translateX(70px) scale(1.12)}}
@keyframes lungeL{40%{transform:translateX(-70px) scale(1.12)}}
@keyframes hitShake{20%{transform:translateX(-10px) rotate(-5deg);filter:brightness(2.2)}40%{transform:translateX(10px) rotate(5deg);filter:brightness(1.8)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes castPulse{50%{transform:scale(1.15);filter:drop-shadow(0 0 22px #fde047) brightness(1.5)}}
@keyframes faint{30%{transform:rotate(-10deg) scale(1.05)}100%{transform:translateY(30px) rotate(25deg) scale(.4);opacity:0}}
.fx{position:absolute;left:50%;top:6%;z-index:5;pointer-events:none;white-space:nowrap;font-weight:800;font-size:2rem;
  text-shadow:0 3px 0 rgba(0,0,0,.45);animation:floatUp 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-18px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(.95)}}
.bolt{position:absolute;top:44%;left:30%;font-size:2.4rem;z-index:4;pointer-events:none;animation:fly .4s linear forwards}
/* Super attacks: one big moment per hero (fire arrow rain, thunder slash, fire meteor) */
.arena.quake{animation:quake .5s ease-in-out}
@keyframes quake{10%,50%,90%{transform:translate(-6px,3px)}30%,70%{transform:translate(6px,-3px)}}
.sfx{position:absolute;pointer-events:none;z-index:6}
.flash{inset:0;background:radial-gradient(circle at 70% 60%,#fff7c2,#ffb703 45%,rgba(255,80,0,.0) 75%);animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
.sbanner{left:50%;top:30%;z-index:8;font-weight:800;font-size:2rem;white-space:nowrap;color:#fff7c2;letter-spacing:.02em;
  text-shadow:0 0 12px #ff7a00,0 3px 0 #b42d00,0 6px 14px rgba(0,0,0,.6);animation:banner 1.7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:1}
  80%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.arrow{width:26px;height:70px;margin-left:-13px;animation:rain .5s cubic-bezier(.5,0,1,.6) forwards;opacity:0}
@keyframes rain{0%{transform:translate(var(--dx),-200px) rotate(var(--r));opacity:1}100%{transform:translate(0,0) rotate(var(--r));opacity:1}}
.boomp{font-size:2.2rem;margin:-14px 0 0 -14px;animation:boom .75s ease-out forwards}
@keyframes boom{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}
.ring{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:6px solid #ffd166;box-shadow:0 0 24px #ff7a00,inset 0 0 18px #ff7a00;animation:ring .6s ease-out forwards}
@keyframes ring{to{transform:scale(11);opacity:0;border-width:1px}}
.slash{width:240px;height:240px;margin:-120px 0 0 -120px;filter:drop-shadow(0 0 10px #ff7a00);animation:slash .45s ease-out forwards}
@keyframes slash{0%{transform:rotate(-70deg) scale(.5);opacity:0}30%{opacity:1}100%{transform:rotate(40deg) scale(1.1);opacity:0}}
.thunder{width:44px;height:200px;margin-left:-22px;top:-10px;animation:thunder .45s steps(2) forwards}
@keyframes thunder{0%,60%{opacity:1}30%,100%{opacity:0}}
.meteor{width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff7c2,#ffd166 25%,#ff7a00 55%,#b42d00 80%);box-shadow:0 0 40px 14px rgba(255,122,0,.8);animation:meteor .6s cubic-bezier(.6,0,1,1) forwards}
.meteor::after{content:"";position:absolute;right:60%;bottom:60%;width:140px;height:40px;border-radius:40px;transform:rotate(38deg);transform-origin:right center;
  background:linear-gradient(90deg,rgba(255,122,0,0),rgba(255,180,60,.9));filter:blur(3px)}
@keyframes meteor{0%{transform:translate(-260px,-240px) scale(.5)}100%{transform:translate(0,0) scale(1.1)}}
@keyframes fly{from{transform:translateX(0) scale(.6)}to{transform:translateX(150px) scale(1.3);opacity:.2}}
.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;z-index:3}
.hud>div{background:rgba(0,0,0,.4);border-radius:14px;padding:3px 10px;font-weight:800;font-size:.9rem;line-height:1.2;max-width:48%}
.hearts{font-size:1rem;letter-spacing:-1px}
.hpbar{height:10px;width:110px;max-width:100%;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .35s}
.mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

/* Question */
.qcard{background:var(--card);color:var(--ink);border-radius:26px;padding:12px 14px;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.18);position:relative}
.qtext{font-size:2.8rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;padding:0 44px}
.qtext .gap{display:inline-block;min-width:1.2em;border-bottom:4px solid var(--coral);color:var(--coral)}
.qtext.show .gap{border-color:var(--leaf);color:var(--leafD)}
.qside{position:absolute;top:10px;width:44px;height:44px;border-radius:50%;border:0;font-size:1.3rem;cursor:pointer}
.qsay{right:10px;background:var(--sky);box-shadow:0 4px 0 var(--skyD)}
.qhint{left:10px;background:var(--mango);box-shadow:0 4px 0 var(--mangoD)}
.qsay:active,.qhint:active{transform:translateY(3px);box-shadow:none}
.hintbox{font-size:1.25rem;line-height:1.35;margin-top:6px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 10px}
.hintbox .grp{display:inline-flex;flex-wrap:wrap;gap:1px;max-width:100%;justify-content:center}
.hintbox.rows{gap:0;font-size:1rem;line-height:1.25}.hintbox.rows .grp{width:100%}
.hintbox .x{opacity:.25}
.hintbox .op{font-weight:800;font-size:1.4rem;color:var(--soft)}
.combo{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:800;color:var(--muted);font-size:.95rem;min-height:24px}
.combo i{font-style:normal;font-size:1.2rem;filter:grayscale(1);opacity:.35;transition:all .2s}
.combo i.on{filter:none;opacity:1;transform:scale(1.2)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border:0;border-radius:22px;background:var(--mango);color:var(--ink);font-weight:800;font-size:2.3rem;padding:8px 0;cursor:pointer;box-shadow:0 7px 0 var(--mangoD);font-variant-numeric:tabular-nums;transition:transform .1s}
.ans:active{transform:translateY(4px);box-shadow:0 3px 0 var(--mangoD)}
.ans.ok{background:var(--leaf);box-shadow:0 7px 0 var(--leafD);animation:pop .45s}
.ans.no{background:var(--coral);box-shadow:0 7px 0 var(--coralD);opacity:.6;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Result + book */
.result{background:var(--card);color:var(--ink);border-radius:28px;padding:20px 16px;text-align:center;align-items:center}
.result h2{margin:0;font-size:2.1rem;line-height:1.1}
.result p{margin:0;font-size:1.1rem;color:var(--soft);font-weight:700}
.result .rs svg{width:130px;height:130px}
.stars3{font-size:3rem;letter-spacing:4px}
.stars3 span{display:inline-block;animation:pop .5s backwards}
.stars3 .off{filter:grayscale(1);opacity:.3}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{background:var(--card);color:var(--ink);border-radius:18px;padding:4px 4px 6px;text-align:center;font-weight:800;font-size:.8rem;line-height:1.1}
.mcell svg{width:100%;height:auto;aspect-ratio:1}
.mcell.unk svg{filter:brightness(0) opacity(.25)}
.mcell.unk{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:16px;font-weight:800;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.35);text-align:center;max-width:90vw}
@media (prefers-reduced-motion:reduce){.anim-breathe,.anim-float,.node.now,.arena.quake{animation:none}}
@media (max-width:360px){.qtext{font-size:2.2rem}.ans{font-size:1.9rem}.unit{width:104px;height:104px}.unit.boss{width:124px;height:124px}}

/* ---------- Questions ---------- */
function makeQ(l,b){
  let a,c,op,ans,miss=false;
  const r=Math.random();
  if(l===0){a=rnd(1,9);c=rnd(1,10-a);op='+'}
  else if(l===1){a=rnd(2,10);c=rnd(1,a);op='−'}
  else if(l===2){if(r<.5){a=rnd(2,15);c=rnd(1,20-a);op='+'}else{a=rnd(6,20);c=rnd(1,Math.min(10,a));op='−'}miss=b===2&&Math.random()<.35}
  else if(l===3){if(r<.5){a=rnd(10,80);c=rnd(5,99-a);op='+'}else{a=rnd(20,99);c=rnd(5,a-5);op='−'}if(b===0){a=Math.round(a/10)*10||10;if(op==='+')c=rnd(1,9);else c=rnd(1,Math.min(9,a))}}
  else if(l===4){a=pick([2,3,4,5,10]);c=rnd(1,10);op='×';if(Math.random()<.5)[a,c]=[c,a]}
  else{if(r<.6||b===0){a=rnd(2,9);c=rnd(2,9);op='×'}else{c=rnd(2,9);ans=rnd(2,9);a=c*ans;op='÷'}}
  if(op==='+')ans=a+c;else if(op==='−')ans=a-c;else if(op==='×')ans=a*c;else ans=a/c;
  const q={a,c,op,ans,key:a+op+c};
  if(miss){q.miss=true;q.ans=c} // a op ? = result
  q.choices=choices(q,l);
  return q;
}
function choices(q,l){
  const n=l<2?3:4,t=q.ans,set=new Set([t]);
  let offs=q.op==='÷'?[1,-1,2,-2,3]:q.op==='×'?[1,-1,q.c,-q.c,2,-2]:t>=20?[1,-1,10,-10,2,-2,9,11]:[1,-1,2,-2,3,-3];
  if(q.op==='×'&&!q.miss)offs=[q.c,-q.c,q.a,-q.a,1,-1,2];
  for(const o of shuffle(offs)){if(set.size>=n)break;const v=t+o;if(v>=0&&v!==t)set.add(v)}
  let k=1;while(set.size<n){set.add(t+k);k++}
  return shuffle([...set]);
}
function qHTML(q,show){
  const res=q.miss?(q.op==='+'?q.a+q.c:q.a-q.c):null;
  if(q.miss)return `${q.a} ${q.op} <span class="gap">${show?q.ans:'?'}</span> = ${res}`;
  return `${q.a} ${q.op} ${q.c} = <span class="gap">${show?q.ans:'?'}</span>`;
}
function qSpeech(q){const o=t('ops')[q.op];return q.miss?t('sayMiss')(q.a,o,q.op==='+'?q.a+q.c:q.a-q.c):t('sayQ')(q.a,o,q.c)}
function qKeys(q){return q.miss?[...nk(q.a),OPK[q.op],'berapa','sama',...nk(q.op==='+'?q.a+q.c:q.a-q.c)]:[...nk(q.a),OPK[q.op],...nk(q.c),'sama-berapa']}
function hintHTML(q){
  const dots=(n,ch,cls)=>`<span class="grp">${Array.from({length:n},()=>`<span class="${cls||''}">${ch}</span>`).join('')}</span>`;
  if(q.op==='+'&&!q.miss)return dots(q.a,'🍎')+'<span class="op">+</span>'+dots(q.c,'🍏');
  if(q.op==='+'&&q.miss)return dots(q.a,'🍎')+'<span class="op">+ ? =</span>'+dots(q.a+q.c,'⚪');
  if(q.op==='−'&&!q.miss)return `<span class="grp">${Array.from({length:q.a},(_,i)=>`<span class="${i>=q.a-q.c?'x':''}">🍎</span>`).join('')}</span>`;
  if(q.op==='−'&&q.miss)return dots(q.a,'🍎')+'<span class="op">→</span>'+dots(q.a-q.c,'🍎');
  if(q.op==='×'){let h='';for(let i=0;i<q.a;i++)h+=dots(q.c,'⭐');return `<span class="op" style="width:100%">${t('groups')(q.a,q.c)}</span>`+h}
  return '';
}

async function answer(v,btn){
  if(!B||B.busy||B.dead)return;const me=B;me.busy=true;
  // Disable immediately after setting the synchronous guard; nextQ rebuilds the buttons.
  document.querySelectorAll('#ans .ans').forEach(button=>{button.disabled=true});
  me.total++;
  const q=me.q,hero=$('#uHero'),mon=$('#uMon'),hb=hero.firstElementChild,mb=mon.firstElementChild;
  $('#qt').classList.add('show');$('#qt').innerHTML=qHTML(q,true);
  if(v===q.ans){
    btn.classList.add('ok');me.right++;me.combo++;
    const sup=me.combo>=3;const dmg=sup?2:1;if(sup)me.combo=0;
    drawHud();
    if(sup){await superAttack(me.hero.id,hero,mon);if(me.dead)return}
    else{const pi=Math.floor(Math.random()*t('praise').length);fx(hero,t('praise')[pi],'#bbf7d0');say(t('praise')[pi],['puji-'+(pi+1)]);
      // The Knight's first and second hits use WM6's physical melee cut.
      // Ranged bolts remain on original Archer/Mage attacks only.
      SFX.slash();
      if(me.hero.id!=='kesatria'){
        restart(hb,'lunge-r');
        const bolt=document.createElement('div');bolt.className='bolt';bolt.textContent=me.hero.fx;
        mon.parentElement.appendChild(bolt);setTimeout(()=>bolt.remove(),450);
      }
      await wait(260);if(me.dead)return}
    const phaseFloor=(me.b===2&&me.l>=6)?(me.hp>5?5:me.hp>2?2:0):0;
    const dealt=Math.min(dmg,me.hp-phaseFloor);
    me.hp=Math.max(phaseFloor,me.hp-dmg);restart(mb,'hit');fx(mon,'-'+dealt,sup?'#fde047':'#fecaca');drawHud();
    await wait(sup?900:650);if(me.dead)return;
    if(me.hp<=0){mb.classList.remove('anim-float','hit');restart(mb,'faint');SFX.win();await wait(900);if(me.dead)return;return result(true)}
    nextQ();
  }else{
    btn.classList.add('no');SFX.wrong();me.combo=0;drawHud();
    const good=[...document.querySelectorAll('.ans')].find(x=>+x.dataset.v===q.ans);if(good)good.classList.add('ok');
    say(t('answerIs')(q.ans),['jawapannya',...nk(q.ans)]);
    await wait(500);if(me.dead)return;
    restart(mb,'lunge-l');await wait(240);if(me.dead)return;
    const protectedHit=!!me.rpgGuard;
    if(protectedHit)me.rpgGuard=false;else me.hearts--;

    await wait(1300);if(me.dead)return;
    if(me.hearts<=0){SFX.lose();return result(false)}
    nextQ();
  }
}

const BGM=(()=>{

    boss:{bpm:144,lead:'square',vol:0.032,echo:0.1,pump:true,chords:'Dm Bb C A Dm Bb C A',mel:'D5 D5 . F5 . D5 A5 - | Bb4 - D5 - F5 - D5 . | C5 C5 . E5 . C5 G5 - | A4 - C#5 - E5 - A5 . | D6 - A5 - F5 - D5 - | F5 - D5 - Bb4 - D5 F5 | E5 - G5 - C6 - G5 E5 | C#5 - - - A4 - - .'}};
  for(const k in T){const t=T[k];t.c=t.chords.split(' ');t.m=t.mel.replace(/\|/g,' ').trim().split(/\s+/)}

        visual:'🍰',hint:bt('Penyebut sama. Tambah pengangka sahaja.','Same denominator: add only the numerators.'),
        distractors:[ans+1,ans-1,ans+c,Math.max(0,a-d)]});
    case 10: // tenths and percent
      if(v===0){a=rnd(10,48);c=rnd(11,49);ans=a+c;
        return mathQ(ans,`${f2(a,'decimal')} + ${f2(c,'decimal')} = ?`,`${f2(a,'decimal')} + ${f2(c,'decimal')} = ?`,{
          format:'decimal',visual:'🧪',hint:bt('Sejajarkan titik perpuluhan ketika menambah.','Align decimal points when adding.'),
          distractors:[ans+10,ans-10,ans+1,ans-1]});}
      if(v===1){a=rnd(35,95);c=rnd(10,a-10);ans=a-c;
        return mathQ(ans,`${f2(a,'decimal')} − ${f2(c,'decimal')} = ?`,`${f2(a,'decimal')} − ${f2(c,'decimal')} = ?`,{
          format:'decimal',visual:'⚗️',hint:bt('Sejajarkan titik perpuluhan ketika menolak.','Align decimal points when subtracting.'),
          distractors:[ans+10,ans-10,ans+1,ans-1]});}
      a=randSome([10,20,25,50]);c=randSome([40,60,80,100,120]);ans=a*c/100;
      return mathQ(ans,`Berapakah ${a}% daripada ${c} kristal?`,`What is ${a}% of ${c} crystals?`,{
        visual:'💎 %',hint:bt('Peratus bermaksud daripada 100. Kira bahagian yang diminta.','Percent means out of 100. Find that part.'),
        distractors:[ans+10,ans-10,c-a,a]});
    case 11: // Measures
      if(v===0){a=rnd(1,5);c=rnd(1,9)*10;ans=a*100+c;
        return mathQ(ans,`${a} m ${c} cm bersamaan berapa cm?`,`How many centimetres are in ${a} m ${c} cm?`,{
          format:'cm',visual:'📏',hint:bt('1 meter = 100 sentimeter.','1 metre = 100 centimetres.'),
          distractors:[a*10+c,a*100,ans+100,ans-10]});}
      if(v===1){a=rnd(1,5);c=randSome([100,200,250,500,750]);ans=a*1000+c;
        return mathQ(ans,`${a} kg ${c} g bersamaan berapa gram?`,`How many grams are in ${a} kg ${c} g?`,{
          format:'grams',visual:'⚖️',hint:bt('1 kilogram = 1000 gram.','1 kilogram = 1000 grams.'),
          distractors:[a*100+c,a*1000,ans+1000,ans-100]});}
      a=rnd(1,3);c=randSome([100,200,300,500]);const extraMl=randSome([100,200,400]);ans=a*1000+c+extraMl;
      return mathQ(ans,`${a} L ${c} mL air ditambah ${extraMl} mL. Berapakah jumlah dalam mL?`,
        `${a} L ${c} mL of water plus ${extraMl} mL. What is the total in mL?`,{
        format:'ml',visual:'🫗 💧',hint:bt('1 liter = 1000 mL. Tukar dahulu, kemudian tambah.','1 litre = 1000 mL. Convert, then add.'),
        distractors:[a*100+c+extraMl,ans-extraMl,ans+100,ans-100]});
    case 12: // Shapes and geometry
      if(v===0){const sides=randSome([3,4,5,6,8]);ans=sides;
        const shapeNames={3:bt('segi tiga','triangle'),4:bt('segi empat','quadrilateral'),5:bt('pentagon','pentagon'),6:bt('heksagon','hexagon'),8:bt('oktagon','octagon')};
        return mathQ(ans,`Berapakah sisi bagi bentuk ${shapeNames[sides][0]}?`,
          `How many sides does a ${shapeNames[sides][1]} have?`,{
          visual:'📐 🔷',hint:bt('Kira semua sisi lurus pada bentuk itu.','Count each straight side of that shape.'),
          distractors:[ans+1,ans-1,ans+2,ans-2]});}
      if(v===1){a=rnd(3,12);c=rnd(3,10);ans=2*(a+c);
        return mathQ(ans,`Taman segi empat tepat berukuran ${a} cm × ${c} cm. Berapakah perimeter?`,
          `A rectangle is ${a} cm by ${c} cm. What is its perimeter?`,{
          format:'cm',visual:'▭',hint:bt('Perimeter = 2 × (panjang + lebar).','Perimeter = 2 × (length + width).'),
          distractors:[a*c,a+c,ans+2,ans-2]});}
      a=rnd(4,12);c=rnd(3,9);ans=a*c;
      return mathQ(ans,`Lantai segi empat tepat ${a} cm × ${c} cm. Berapakah luas?`,
        `A rectangle floor is ${a} cm by ${c} cm. What is its area?`,{
        format:'area',visual:'▦',hint:bt('Luas = panjang × lebar.','Area = length × width.'),
        distractors:[2*(a+c),a+c,ans+a,ans-a]});
    case 13: // Read and apply a chart
      a=rnd(3,9);c=rnd(5,12);const dataC=rnd(2,7);
      const visual=`<div class="rpg-data-bars">🍎 ${'▮'.repeat(a)} ${a}<br>🍐 ${'▮'.repeat(c)} ${c}<br>🍊 ${'▮'.repeat(dataC)} ${dataC}</div>`;
      if(v===0){ans=Math.max(a,c,dataC);
        return mathQ(ans,'Rujuk carta buah. Berapakah bilangan paling banyak?','Look at the fruit chart. What is the highest quantity?',{
          visual,hint:bt('Bandingkan panjang bar atau nombor pada hujungnya.','Compare the bar lengths or their numbers.'),
          distractors:[a,c,dataC,ans+2,ans-2]});}
      if(v===1){ans=Math.abs(a-c);
        return mathQ(ans,'Rujuk carta. Berapakah beza bilangan epal dan pir?','Use the chart. What is the difference between apples and pears?',{
          visual,hint:bt('Tolak bilangan yang kecil daripada yang besar.','Subtract the smaller count from the larger.'),
          distractors:[a+c,ans+1,ans+2,Math.abs(a-dataC)]});}
      ans=a+c-dataC;
      return mathQ(ans,'Jumlah epal dan pir, kemudian tolak bilangan oren. Berapakah hasilnya?',
        'Add the apples and pears, then subtract the oranges. What is the result?',{
        visual,hint:bt('Buat dua langkah: tambah, kemudian tolak.','Solve in two steps: add, then subtract.'),
        distractors:[a+c,ans+dataC,ans+1,ans-1]});
  }
  return mathQ(1,'1 + 0 = ?','1 + 0 = ?');
}

function oldStoryQ(l,b,base){
  if(l===0&&Math.random()<.28){
    const a=rnd(1,5),c=rnd(1,5);return mathQ(a+c,`Kumpul ${a} epal merah dan ${c} epal hijau. Berapakah jumlah?`,
      `Collect ${a} red and ${c} green apples. What is the total?`,{
      mode:'counter',counterMax:Math.max(10,a+c+2),visual:'🍎'.repeat(a)+' 🍏'.repeat(c),
      hint:bt('Kira semua buah satu demi satu.','Count all the fruit one by one.')});
  }
  if(l===3&&Math.random()<.28)return sortQ(99);
  if(Math.random()>.45)return base;
  const a=base.a,c=base.c,op=base.op;
  if(l===0)return mathQ(base.ans,`Wira menemui ${a} batu dan ${c} lagi. Berapa jumlahnya?`,
    `Your hero finds ${a} stones and ${c} more. How many in total?`,{
    visual:'🪨 + 🪨',hint:bt('Tambah kedua-dua kumpulan.','Add the two groups.'),choices:base.choices});
  if(l===1)return mathQ(base.ans,`Ada ${a} bekalan. ${c} telah digunakan. Berapa yang tinggal?`,
    `There are ${a} supplies. ${c} are used. How many remain?`,{
    visual:'🎒',hint:bt('Tolak bekalan yang digunakan.','Subtract the supplies used.'),choices:base.choices});
  if(l===4)return mathQ(base.ans,`${a} kumpulan mempunyai ${c} bintang setiap satu. Berapa semua?`,
    `${a} groups have ${c} stars each. How many altogether?`,{
    visual:'⭐ ✕',hint:bt('Darab bilangan kumpulan dengan setiap kumpulan.','Multiply groups by stars per group.'),choices:base.choices});
  if(l===5&&op==='÷')return mathQ(base.ans,`${a} ramuan dibahagi sama rata kepada ${c} wira. Berapa setiap wira?`,
    `${a} potions are shared equally by ${c} heroes. How many each?`,{
    visual:'🧪 ➗',hint:bt('Bahagikan kepada kumpulan sama banyak.','Divide into equal groups.'),choices:base.choices});
  if(base.miss)return base;
  return mathQ(base.ans,`${a} ${op} ${c} = ?`,`${a} ${op} ${c} = ?`,{
    hint:bt('Kira mengikut operasi yang ditunjukkan.','Use the shown operation.'),choices:base.choices});
}

const legacyMakeQ=makeQ,legacyQHTML=qHTML,legacyHintHTML=hintHTML;

makeQ=function(l,b){
  let q;

hintHTML=function(q){return q.kind==='rpg'?`<div class="rpg-hint">💡 ${escapeText(tr(q.hint))}</div>`:legacyHintHTML(q)};
hasHint=function(l,q){return q.kind==='rpg'||legacyHasHint(l,q)};

function masteryRecord(l,q,correct){
  if(l<0||l>=LANDS.length)return;
  const key='L'+l,raw=S.mastery[key];
  const m=raw&&typeof raw==='object'?raw:{seen:0,right:0,ids:[]};
  if(!Array.isArray(m.ids))m.ids=[];
  if(!Array.isArray(m.correctIds))m.correctIds=[];
  const id=q.key||((q.prompt?q.prompt[0]:`${q.a}${q.op}${q.c}`)+'|'+q.ans);
  if(!m.ids.includes(id)){
    m.seen=safeNumber(m.seen)+1;
    m.ids.push(id);if(m.ids.length>120)m.ids.shift();
  }
  if(correct&&!m.correctIds.includes(id)){
    m.right=safeNumber(m.right)+1;m.correctIds.push(id);
    if(m.correctIds.length>120)m.correctIds.shift();
  }
  S.mastery[key]=m;save();
}
function masteryTier(l){
  const m=S.mastery['L'+l];if(!m)return 0;
  const n=safeNumber(m.seen),ratio=safeNumber(m.right)/Math.max(1,n);
  return n>=10&&ratio>=.85?2:n>=6&&ratio>=.7?1:0;
}

function updatePowerButton(){

function renderRPGQuestion(){
  if(!B||!B.q)return;
  const q=B.q,box=$('#ans');if(!box)return;
  box.classList.add('rpg-battle-choices');
  box.style.display='grid';
  box.style.gridTemplateColumns=q.choices.length===3?'repeat(3,1fr)':'repeat(2,1fr)';
  if(q.kind!=='rpg')return;
  if(q.mode==='choice'){
    box.innerHTML=q.choices.map(v=>`<button class="ans" data-v="${v}">${escapeText(f2(v,q.format))}</button>`).join('');
    box.querySelectorAll('.ans').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.v),btn));
    return;
  }
  box.style.display='block';
  if(q.mode==='sort'){
    box.innerHTML=`<div class="rpg-interact"><div class="rpg-tag">${r2('tapOrder')}</div><div class="rpg-sort-tiles" id="sortTiles">${q.sortValues.map(v=>`<button class="rpg-sort-tile" data-n="${v}">${v}</button>`).join('')}</div>
      <div class="rpg-sort-progress" id="sortProgress">_ → _ → _</div><button class="ans rpg-submit" id="sortCheck" disabled>${r2('check')}</button></div>`;
    const chosen=[];const check=$('#sortCheck');
    box.querySelectorAll('.rpg-sort-tile').forEach(tile=>tile.onclick=()=>{
      if(B.busy)return;tile.disabled=true;chosen.push(+tile.dataset.n);
      $('#sortProgress').textContent=[...chosen,...Array(3-chosen.length).fill('_')].join(' → ');
      check.disabled=chosen.length!==3;SFX.tap();
    });
    check.onclick=()=>answer(chosen.every((n,i)=>n===q.sortAnswer[i])?1:0,check);
  }else{
    const max=Math.min(100,Math.max(5,q.counterMax));let value=0;
    box.innerHTML=`<div class="rpg-interact"><div class="rpg-tag">${r2('countInstruction')}</div><div class="rpg-counter"><button id="counterMinus" aria-label="Minus">−</button><output id="counterValue">0</output><button id="counterPlus" aria-label="Plus">+</button></div><button class="ans rpg-submit" id="counterCheck">${r2('check')}</button></div>`;
    const out=$('#counterValue');
    $('#counterMinus').onclick=()=>{value=Math.max(0,value-1);out.textContent=value;SFX.tap()};
    $('#counterPlus').onclick=()=>{value=Math.min(max,value+1);out.textContent=value;SFX.tap()};
    $('#counterCheck').onclick=()=>answer(value,$('#counterCheck'));
  }
}

  const arena=view.querySelector('.arena');
  arena.insertAdjacentHTML('beforeend',`<div class="rpg-battle-phase" id="rpgPhase"></div><div class="rpg-stage-chip" id="rpgStage"></div>`);
  view.querySelector('.combo').insertAdjacentHTML('afterend',`<div class="rpg-power"><span class="charge" id="rpgCharge">○○</span><button id="rpgPowerBtn" disabled>${r2('power')[B.hero.id]}</button></div>`);
  $('#rpgPowerBtn').onclick=useHeroPower;
  const body=view.querySelector('#uHero .body');if(body)body.classList.add('rpg-equipped-hero');
  updatePowerButton();setBossHUD();
};
answer=async function(v,btn){
  if(!B||B.busy)return;
  const q=B.q,correct=v===q.ans,land=B.l;
  masteryRecord(land,q,correct);
  if(!correct&&q.kind==='rpg'){
    const card=view.querySelector('.qcard');
    if(card)card.insertAdjacentHTML('beforeend',`<div class="rpg-tip" id="rpgTip">💡 ${escapeText(tr(q.hint))}</div>`);
  }
  await legacyAnswer(v,btn);
};

/* Learning rewards and result summaries. Legacy stars are still awarded by
   the original result() and saved under their original LxBy keys. */
let latestReward=null,lastResultData=null;
const legacyResult=result,legacyResultScreen=resultScreen;
resultScreen=function(R){
  lastResultData=R;legacyResultScreen(R);
  if(!R.won||!latestReward||latestReward.l!==R.l||latestReward.b!==R.b)return;
  const row=view.querySelector('.result .row');if(!row)return;
  const message=`<div class="rpg-reward">🎁 ${r2('reward')}<br>✨ +${latestReward.xp} XP · Lv ${rpgLevel()}`+
    (latestReward.newItems?`<br>🎒 ${r2('newItem')} +${latestReward.newItems}`:'')+'</div>';
  row.insertAdjacentHTML('beforebegin',message);
  row.insertAdjacentHTML('afterend',`<button class="btn alt rpg-quest-btn" id="goCamp">${r2('camp')}</button>`);
  $('#goCamp').onclick=()=>{SFX.tap();home()};
};
result=function(won){
  // Idempotent settlement per battle instance, not per stage: replays still earn 8 XP.
  // Lock before calling legacyResult, which clears B and persists the stars.
  if(!B||B.dead||B._rewardFinalized)return;
  B._rewardFinalized=true;
  const info={l:B.l,b:B.b,right:B.right,first:!starsOf(B.l,B.b)};
  latestReward=null;
  legacyResult(won);
  if(!won)return;
  const gain=info.first?70+Math.min(35,info.right*5)+(info.b===2?40:0):8;
  S.xp+=gain;
  const newItems=syncGear();save();
  latestReward={l:info.l,b:info.b,xp:gain,newItems};
  if(lastResultData)resultScreen(lastResultData);
};
const battleBeforeRewards=battle;
battle=function(l,b){latestReward=null;lastResultData=null;return battleBeforeRewards(l,b)};

function inventoryScreen(){
  stopBattle();syncGear();screen='rpgInventory';redraw=inventoryScreen;head(r2('inventory'),home);
  view.innerHTML=`<section class="rpg-panel" style="text-align:center">
    <h2>${r2('camp')} · Lv ${rpgLevel()}</h2><div class="rpg-hero-preview">${heroSVG(S.hero)}</div>
    ${progressXP()}<p>${r2('parental')}</p></section>`+
    SLOTS.map(slot=>{
      const items=GEAR.filter(i=>i.slot===slot);
      return `<h2 class="rpg-slot-label">${slotName(slot)} · ${r2('equipment')}</h2><div class="rpg-grid">`+
        items.map(i=>{
          const owned=haveItem(i.id),selected=S.equipped[slot]===i.id;
          const need=!owned?[r2('needStars')(i.stars),r2('needLevel')(i.level)].join(' · '):'';
          return `<div class="rpg-gear-card ${selected?'selected':''} ${owned?'':'locked'}">
            <div class="rpg-gear-icon">${i.icon}</div><div class="rpg-gear-name">${escapeText(tr(i.name))}</div>
            <div class="rpg-gear-note">${owned?selected?r2('equipped'):r2('earned'):need}</div>
            <button data-equip="${i.id}" ${!owned||selected?'disabled':''}>${selected?'✓ '+r2('equipped'):owned?r2('equip'):r2('locked')}</button></div>`;
        }).join('')+'</div>';
    }).join('')+`<button class="btn alt" id="invBack">${r2('camp')}</button>`;
  view.querySelectorAll('[data-equip]').forEach(el=>el.onclick=()=>{
    const item=GEAR.find(i=>i.id===el.dataset.equip);
    if(!item||!haveItem(item.id))return;
    S.equipped[item.slot]=item.id;save();SFX.magic();inventoryScreen();
  });
  $('#invBack').onclick=()=>{SFX.tap();home()};
}

function resetRPGProgress(){
  S.xp=0;S.inventory=[];S.equipped=Object.assign({},defaultEquip);
  S.mastery={};S.quests={};syncGear();save();
}

function masteryScreen(){
  stopBattle();screen='rpgMastery';redraw=masteryScreen;head(r2('mastery'),home);
  view.innerHTML=`<section class="rpg-panel"><h2>${r2('mastery')}</h2><p>${r2('masteryDesc')}</p></section>`+
    LANDS.map((L,l)=>{
      const m=S.mastery['L'+l]||{seen:0,right:0},n=safeNumber(m.seen),good=safeNumber(m.right),tier=masteryTier(l);
      const width=Math.min(100,n/10*100);
      return `<div class="rpg-mastery-row"><div><strong>${l+1}. ${escapeText(tr(L.name))}</strong><small>${escapeText(tr(L.topic))} · ${good}/${n}</small></div><span class="rpg-badge">${r2('masteryTier')[tier]}</span>
        <div class="rpg-mastery-track"><i style="width:${width}%"></i></div></div>`;
    }).join('')+`<button class="btn alt" id="masteryBack">${r2('camp')}</button>`;
  $('#masteryBack').onclick=()=>{SFX.tap();home()};
}

const NPCS=['👩‍🌾','🍄','⛏️','🌙','👨‍🏭','🏰','👩‍🔧','👩‍🍳','🧑‍✈️','🧑‍🌾','👩‍🔬','👷','🏗️','👩‍🏫'];
const QUESTS={
  ms:['Bantu petani mengira hasil tanaman.','Bantu pengumpul cendawan menyemak bekalan.',
    'Susun kristal untuk membaiki lampu gua.','Bantu penduduk tasik menyusun bekalan.',
    'Bantu tukang besi mengira bahan.','Bantu penjaga istana membahagikan ramuan.',
    'Bantu jurutera menyusun nilai tempat.','Bantu peniaga mengurus wang dan baki.',
    'Bantu pengembara tiba tepat pada masanya.','Bantu tukang masak membahagi makanan.',
    'Bantu saintis menyukat ramuan.','Bantu pembina menyukat bahan.',
    'Bantu arkitek membina bangunan.','Bantu guru membaca data kampung.'],
  en:['Help a farmer count the harvest.','Help a mushroom collector count supplies.',
    'Arrange crystals to repair cave lights.','Help lake villagers count supplies.',
    'Help the blacksmith calculate materials.','Help the castle keeper share potions.',
    'Help an engineer understand place value.','Help a merchant with money and change.',
    'Help a traveller arrive on time.','Help a cook share food equally.',
    'Help a scientist measure a mixture.','Help a builder measure materials.',
    'Help an architect plan a building.','Help a teacher read village data.']
};
function questBoard(){
  stopBattle();screen='rpgQuests';redraw=questBoard;head(r2('quests'),home);
  view.innerHTML=`<section class="rpg-panel"><h2>${r2('quests')}</h2><p>${r2('sideNote')}</p></section>`+
    LANDS.map((L,l)=>{
      const isOpen=!paid(l)&&unlocked(l,0),done=!!S.quests['L'+l];
      return `<section class="rpg-panel"><div class="rpg-hub-title"><span>${NPCS[l]} ${l+1}. ${escapeText(tr(L.name))}</span><span class="rpg-tag">${done?'✓':'⭐'}</span></div>
        <p>${escapeText(QUESTS[EN()?'en':'ms'][l])}</p><button class="rpg-smallbtn" data-quest="${l}" ${isOpen?'':'disabled'}>${done?r2('repeatQuest'):r2('startQuest')}</button></section>`;
    }).join('');
  view.querySelectorAll('[data-quest]').forEach(el=>el.onclick=()=>{SFX.tap();sideQuest(+el.dataset.quest)});
}

let sideState=null;
function sideQuest(l){
  if(l<0||l>=LANDS.length||paid(l)||!unlocked(l,0))return map();
  stopBattle();sideState={l,step:0,question:null};
  showQuestQuestion();
}
function nextSideQuestion(){
  if(!sideState)return;
  const l=sideState.l;
  for(let tries=0;tries<12;tries++){
    const q=l>=6?makeAdventureQ(l,1):oldStoryQ(l,1,legacyMakeQ(l,1));
    if(q.mode!=='choice')continue;
    if(sideState.question&&q.key===sideState.question.key)continue;
    sideState.question=q;return;
  }
  sideState.question=legacyMakeQ(l,1);
}
function showQuestQuestion(){
  if(!sideState)return;
  const {l,step}=sideState;
  if(step>=3)return finishSideQuest();
  if(sideState.renderedStep!==step){nextSideQuestion();sideState.renderedStep=step}
  screen='rpgSide';redraw=showQuestQuestion;head(r2('side'),()=>{sideState=null;questBoard()});
  const q=sideState.question;
  view.innerHTML=`<section class="rpg-quest-scene"><div class="rpg-npc">${NPCS[l]}</div><h2 class="rpg-section-title">${escapeText(tr(LANDS[l].name))}</h2>
    <div>${escapeText(QUESTS[EN()?'en':'ms'][l])}</div><div class="rpg-quest-progress">${r2('questProgress')(step+1)}</div>
    <div class="rpg-object-row">${'🧱'.repeat(step)}${'▫️'.repeat(3-step)}</div></section>
    <div class="qcard"><button class="qside qhint" id="questHint" aria-label="${t('hintAria')}">💡</button><button class="qside qsay" id="questSay" aria-label="${t('sayAria')}">🔈</button>
      <div class="qtext">${qHTML(q,false)}</div><div id="questHelp" class="hintbox" hidden></div></div>
    <div id="questStatus" class="rpg-quest-progress" style="text-align:center"></div>
    <div class="answers rpg-battle-choices" id="questOptions" style="grid-template-columns:${q.choices.length===3?'repeat(3,1fr)':'repeat(2,1fr)'}">${q.choices.map(v=>`<button class="ans" data-v="${v}">${escapeText(q.kind==='rpg'?f2(v,q.format):String(v))}</button>`).join('')}</div>
    <button class="btn alt" id="questExit">${r2('returnMap')}</button>`;
  $('#questExit').onclick=()=>{sideState=null;map()};
  $('#questSay').onclick=()=>say(qSpeech(q),q.kind==='rpg'?null:qKeys(q));
  $('#questHint').onclick=()=>{const h=$('#questHelp');h.innerHTML=hintHTML(q);h.hidden=!h.hidden;SFX.tap()};
  view.querySelectorAll('#questOptions .ans').forEach(btn=>btn.onclick=()=>{
    const correct=+btn.dataset.v===q.ans;
    masteryRecord(l,q,correct);
    if(correct){
      view.querySelectorAll('#questOptions .ans').forEach(b=>b.disabled=true);
      btn.classList.add('ok');SFX.win();$('#questStatus').textContent='✅ '+t('praise')[0];
      sideState.step++;setTimeout(()=>{if(sideState&&sideState.l===l)showQuestQuestion()},600);
    }else{btn.classList.add('no');btn.disabled=true;SFX.wrong();
      $('#questStatus').textContent=r2('questTry');$('#questHelp').innerHTML=hintHTML(q);$('#questHelp').hidden=false;}
  });
}
function finishSideQuest(){
  if(!sideState)return;
  const l=sideState.l,first=!S.quests['L'+l];
  S.quests['L'+l]=true;const gained=first?55:10;S.xp+=gained;
  const newItems=syncGear();save();
  screen='rpgQuestDone';redraw=()=>{};head(r2('quests'),questBoard);
  view.innerHTML=`<section class="result stack"><div class="rpg-npc">${NPCS[l]}🎉</div><h2>${r2('questSuccess')}</h2><p>${escapeText(QUESTS[EN()?'en':'ms'][l])}</p>
    <div class="rpg-reward">✨ +${gained} XP · Lv ${rpgLevel()} ${newItems?'· 🎒 '+r2('newItem'):''}</div>
    <div class="row"><button class="btn" id="qAgain">${r2('repeatQuest')}</button><button class="btn alt" id="qMap">${r2('returnMap')}</button></div></section>`;
  $('#qAgain').onclick=()=>sideQuest(l);
  $('#qMap').onclick=()=>{sideState=null;map()};
}

normalizeRPGSave();
home();
