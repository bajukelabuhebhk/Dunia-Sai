:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;padding:0}
[hidden]{display:none!important}
/* Layout: one-screen app — header (home, stars), a home grid of game tiles, then each game fills the play area. Same family look as Kenal Jawi, in school-blue instead of mosque green. */
:root{
  --bg:#21407c; --bg2:#2a4f94; --card:#fdf6e3; --ink:#1b2d55; --soft:#4f6189;
  --mango:#ffb703; --mangoD:#c98a00; --coral:#ef6f6c; --coralD:#b24745;
  --leaf:#3fbf7f; --leafD:#24865a; --sky:#5ec8e5; --skyD:#2f93ad; --muted:#b3c8f2; --ghost:#e9dfc4;
  --pink:#ff7eb0; --pinkD:#c94f80; --grape:#a78bfa; --grapeD:#7357d1; --orange:#ff9f43; --orangeD:#c47220;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --abc:"Andika","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
/* The page scrolls inside body, not the window: itch.io and other hosts embed the game in a frame that may not scroll */
html{overflow:hidden}
body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}
body{background:var(--bg);color:var(--card);font-family:var(--display);font-size:14px;
  background-image:radial-gradient(circle at 20% 10%,var(--bg2) 0 18%,transparent 19%),radial-gradient(circle at 85% 90%,var(--bg2) 0 22%,transparent 23%);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-inline:16px;padding-block:14px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.hl{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1;white-space:nowrap}
h1 span{color:var(--mango)}
.pill{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 12px;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.iconbtn{border:0;border-radius:14px;background:var(--mango);color:var(--ink);font-size:1.5rem;width:48px;height:48px;cursor:pointer;box-shadow:0 4px 0 var(--mangoD)}
.sound{background:transparent;border:0;color:var(--card);font-size:1.4rem;cursor:pointer;padding:4px;min-width:44px;min-height:44px}
.sound.off{opacity:.35;filter:grayscale(1)}
#bgmBtn{font-size:1.6rem;font-weight:700}
@media (max-width:360px){header{gap:4px}header .hl{gap:4px!important}header .sound{min-width:32px}header h1{font-size:1.25rem}.ingame header h1{font-size:1.05rem}}
button{font-family:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--card);outline-offset:3px}
.btn{font-weight:700;border:0;border-radius:16px;padding:10px 18px;cursor:pointer;font-size:1.1rem;background:var(--mango);color:var(--ink);box-shadow:0 5px 0 var(--mangoD)}
.btn:active,.iconbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mangoD)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.saybtn{border:0;border-radius:50%;width:52px;height:52px;flex:none;background:var(--sky);box-shadow:0 4px 0 var(--skyD);font-size:1.5rem;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
.saybtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--skyD)}
@keyframes bob{50%{transform:translateY(-4px)}}
.L{font-family:var(--abc);font-weight:700}

/* Home */
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Tablets: the whole app is zoomed to fill the screen (see fit()); a wide landscape home screen shows the games in 4 columns */
.app.wide:not(.ingame){max-width:900px}
.app.wide:not(.ingame) .home{grid-template-columns:repeat(4,1fr)}
.game{border:0;border-radius:24px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font-weight:800;font-size:1.15rem;transition:transform .12s}
.game:active{transform:translateY(4px)}
.game .ic{font-size:2.6rem;line-height:1.1}
.game .jl{font-family:var(--abc);font-size:1.15rem;line-height:1.2;opacity:.75}
.g1{background:var(--mango);box-shadow:0 7px 0 var(--mangoD)}
.g2{background:var(--coral);box-shadow:0 7px 0 var(--coralD)}
.g3{background:var(--leaf);box-shadow:0 7px 0 var(--leafD)}
.g4{background:var(--sky);box-shadow:0 7px 0 var(--skyD)}
.g5{background:var(--pink);box-shadow:0 7px 0 var(--pinkD)}
.g6{background:var(--orange);box-shadow:0 7px 0 var(--orangeD)}
.g7{background:var(--grape);box-shadow:0 7px 0 var(--grapeD)}
.g8{background:var(--card);box-shadow:0 7px 0 #c9b98d}
.stick{background:rgba(0,0,0,.2);border-radius:22px;padding:12px 14px}
.stick h2{margin:0 0 6px;font-size:1.05rem;color:var(--muted);font-weight:700}
.stk{display:flex;flex-wrap:wrap;gap:6px;font-size:2rem}
.stk .lk{filter:grayscale(1);opacity:.25}
.stick p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.stick .btn{margin-top:10px;font-size:1rem}

/* Play card */
.prompt{background:var(--card);color:var(--ink);border-radius:28px;padding:18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18);position:relative}
.prompt>.saybtn.corner{position:absolute;top:10px;right:10px}
.pic{font-size:5.5rem;line-height:1.1;cursor:pointer}
.word{font-size:2.2rem;font-weight:800;letter-spacing:.02em}
.word b{color:var(--coral)}
.word .gap{display:inline-block;min-width:.9em;border-bottom:4px solid var(--coral);color:var(--coral)}
.hint{font-size:1rem;color:var(--soft);margin-top:2px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{font-family:var(--abc);font-weight:700;font-size:3.6rem;line-height:1;aspect-ratio:1;max-width:100%;border:0;border-radius:24px;background:var(--mango);color:var(--ink);cursor:pointer;box-shadow:0 7px 0 var(--mangoD);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--mangoD)}
.ok{background:var(--leaf)!important;box-shadow:0 7px 0 var(--leafD)!important;animation:pop .5s}
.no{background:var(--coral)!important;box-shadow:0 7px 0 var(--coralD)!important;opacity:.55;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.progress{height:12px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mango);border-radius:99px;transition:width .3s}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left}
.bar .hint{color:var(--ink);font-weight:700;font-size:1.1rem;flex:1;margin:0}
.tgt{font-family:var(--abc);font-weight:700;font-size:2.8rem;line-height:1.1;color:var(--coral);min-width:56px;text-align:center}

/* Learn */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.card{position:relative;border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.card .j{font-family:var(--abc);font-weight:700;font-size:2.3rem;line-height:1.25}
.card .n{font-weight:700;font-size:.9rem;color:var(--soft)}
.card.got::before{content:"⭐";position:absolute;top:4px;left:6px;font-size:.85rem}
.card.lock{opacity:.45}
.card.lock::after{content:"🔒";position:absolute;top:4px;right:6px;font-size:.9rem}
.big .j{font-family:var(--abc);font-weight:700;font-size:7rem;line-height:1.15;color:var(--ink);cursor:pointer}
.big .j small{font-size:.75em;color:var(--coral);margin-left:.15em}
.say{font-size:1rem;color:var(--soft);font-weight:700}
.say b{color:var(--ink);font-size:1.3rem}
.tp{font-size:.85rem;font-weight:700;background:rgba(0,0,0,.15);border-radius:99px;padding:0 10px}

/* Map */
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;border-radius:99px;padding:4px 14px;font:700 1.25rem var(--abc);background:transparent;color:var(--card);cursor:pointer;min-height:40px}
.seg button.on{background:var(--mango);color:var(--ink)}
.map{position:relative;width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map polyline{fill:none;stroke:rgba(0,0,0,.28);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 14;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);padding:0}
.node .j{font-family:var(--abc);font-weight:700;font-size:1.9rem;line-height:1}
.node i{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:1rem}
.node.done{background:var(--leaf);box-shadow:0 5px 0 var(--leafD)}
.node.now{background:var(--mango);box-shadow:0 5px 0 var(--mangoD);width:72px;height:72px;animation:pulse 1.2s ease-in-out infinite}
.node.lock,.node.pay{opacity:.45}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.1)}}
.cel{font-size:2.4rem;margin:0;color:var(--coral)}
.peek{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.peek span{font-family:var(--abc);font-weight:700;font-size:1.7rem;width:50px;height:50px;border-radius:14px;background:var(--ghost);display:flex;align-items:center;justify-content:center;color:var(--soft)}
.peek .more{font-family:var(--display);font-size:1rem;font-weight:800}
.cert{background:var(--card);color:var(--ink);border-radius:28px;padding:20px 16px;text-align:center;align-items:center;border:6px double var(--mango);gap:6px}
.cert .ct{font-size:2rem;font-weight:800;line-height:1.1}
.cert .cj{font-family:var(--abc);font-weight:700;font-size:1.5rem;color:var(--mangoD);letter-spacing:.1em}

/* Trace */
.cv{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:22px;background:#fffbef;border:3px dashed var(--ghost);overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hl.blink{animation:hb .8s ease-in-out infinite alternate}
@keyframes hb{from{opacity:.2}to{opacity:1}}
.meter{width:100%;height:14px;border-radius:99px;background:var(--ghost);overflow:hidden;max-width:340px;margin:10px auto 0}
.meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}

@keyframes wob{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.cf{position:absolute;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:cf .8s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
/* Kereta Api ABC */
.rail{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#bfe9f7 0 70%,#9ad9a8 70%);padding:34px 8px 30px;touch-action:manipulation}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:20px;height:6px;background:repeating-linear-gradient(90deg,#8a5a2b 0 10px,transparent 10px 20px),#b98a5a;background-size:20px 6px,100% 2px;background-repeat:repeat-x,no-repeat;background-position:0 0,0 4px}
.train{display:flex;align-items:flex-end;gap:4px;justify-content:center;transition:transform 1.2s ease-in}
.train.in{animation:roll .9s ease-out}
.train.go{transform:translateX(130%)}
@keyframes roll{from{transform:translateX(-130%)}}
.eng{font-size:3rem;line-height:1;transform:scaleX(-1);margin-right:-4px}
.wag{position:relative;width:54px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 2.6rem var(--abc);color:var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.wag::before,.wag::after{content:"";position:absolute;bottom:-11px;width:16px;height:16px;border-radius:50%;background:#3b3b3b;border:3px solid #9a9a9a;box-sizing:border-box}
.wag::before{left:7px}.wag::after{right:7px}
.wag.q{background:var(--card)!important;color:var(--coral);border:3px dashed var(--coral)}
.wag.fillin{animation:pop .5s}
.smoke{position:absolute;font-size:1.6rem;opacity:0;animation:puff 1.2s ease-out forwards}
@keyframes puff{20%{opacity:.9}to{transform:translate(-20px,-50px) scale(1.8);opacity:0}}

/* Tangkap Ikan */
.sea{position:relative;height:min(56vh,440px);min-height:320px;border-radius:24px;overflow:hidden;background:linear-gradient(#e8f8fd 0 12%,#5ec8e5 12%,#2f93ad);touch-action:manipulation}
.sea .weed{position:absolute;bottom:-6px;font-size:3rem}
.sea .rod{position:absolute;top:-6px;right:12px;font-size:2.6rem;transform:scaleX(-1)}
.fish{position:absolute;left:0;top:0;width:118px;height:76px;margin-left:-59px;border:0;padding:0;background:none;cursor:pointer;will-change:transform}
.fish .bd{position:absolute;left:0;top:0;width:92px;height:76px;border-radius:50%;background:var(--c);box-shadow:inset -8px -8px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:2.6rem;line-height:1}
.fish .tl{position:absolute;left:84px;top:14px;width:0;height:0;border-top:24px solid transparent;border-bottom:24px solid transparent;border-right:32px solid var(--c)}
.fish .ey{position:absolute;left:14px;top:20px;width:9px;height:9px;border-radius:50%;background:#123}
.fish.wig .bd{animation:wob .45s}
.fish.hook{transition:transform .9s ease-in!important}
.line{position:absolute;top:0;width:2px;background:#333;transform-origin:top;pointer-events:none}

/* Sambung Titik */
.dots{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;border-radius:24px;background:#fffbef;touch-action:manipulation}
.dots svg{position:absolute;inset:0;width:100%;height:100%}
.dots polyline{fill:none;stroke:var(--coral);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dots polygon{stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round;opacity:0;transition:opacity .6s}
.dots.fin polygon{opacity:1}
.dt{position:absolute;transform:translate(-50%,-50%);width:var(--s,40px);height:var(--s,40px);border-radius:50%;border:0;padding:0;background:var(--mango);box-shadow:0 3px 0 var(--mangoD);font:700 calc(var(--s,40px)*.55) var(--abc);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dt.on{background:var(--leaf);box-shadow:0 3px 0 var(--leafD)}
.dt.hintb{animation:pulse 1s ease-in-out infinite}
.dt.no{animation:shake .4s}
.dots.fin .dt{opacity:0;transition:opacity .5s}
.reveal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:6rem;transition:transform .5s cubic-bezier(.3,1.6,.6,1)}
.dots.fin .reveal{transform:translate(-50%,-50%) scale(1)}

/* Pos Surat */
.post{position:relative;height:min(56vh,440px);min-height:330px;border-radius:24px;background:linear-gradient(#fdf6e3 0 66%,#c9b98d 66%);overflow:hidden;touch-action:none}
.env{position:absolute;left:50%;top:22px;width:104px;height:72px;margin-left:-52px;border:0;padding:0;border-radius:8px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:grab;touch-action:none;z-index:3;display:flex;align-items:center;justify-content:center;font:700 2.8rem var(--abc);color:var(--ink);overflow:hidden}
.env::before{content:"";position:absolute;left:0;top:0;border-left:52px solid transparent;border-right:52px solid transparent;border-top:34px solid #e9dfc4}
.env span{position:relative;margin-top:14px}
.env.drag{cursor:grabbing;box-shadow:0 14px 18px rgba(0,0,0,.25)}
.env.back{transition:transform .25s}
.env.in{transition:transform .4s,opacity .3s .2s;opacity:0}
.boxes{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:space-around;align-items:flex-end}
.pbox{position:relative;width:90px;height:150px;border:0;padding:0;border-radius:44px 44px 8px 8px;background:var(--coral);box-shadow:inset -10px 0 0 rgba(0,0,0,.12),0 6px 0 var(--coralD);cursor:pointer;display:flex;flex-direction:column;align-items:center;font:700 2.8rem var(--abc);color:#fff}
.pbox::before{content:"";width:56px;height:9px;border-radius:5px;background:#5b1e1d;margin:30px 0 12px}
.pbox .lb{background:var(--card);color:var(--ink);border-radius:12px;width:62px;line-height:62px;text-align:center}
.pbox.hot{transform:scale(1.07)}
.pbox.ok{animation:pop .5s}
.pbox.nope{animation:shake .4s}

/* Suku Kata */
.sum{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--abc);font-weight:700;font-size:4.2rem;line-height:1.1;margin:6px 0}
.sum .op{font-family:var(--display);font-size:2.2rem;color:var(--soft)}
.sum .c{color:var(--ink);cursor:pointer}
.sum .v{color:var(--coral);min-width:.8em;border-bottom:5px dashed var(--ghost)}
.sum .r{color:var(--leafD)}
.choices .tile.sy{font-size:3rem}

/* Eja Kata */
.slots{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.sg{display:flex;gap:6px}
.slot{width:54px;height:64px;border-radius:14px;background:var(--ghost);display:flex;align-items:center;justify-content:center;font:700 2.4rem var(--abc);color:var(--ink)}
.slot.next{box-shadow:inset 0 -5px 0 var(--mango)}
.slot.fill{background:var(--leaf);animation:pop .4s}
.ltrs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lt{width:66px;height:66px;border:0;border-radius:18px;background:var(--mango);box-shadow:0 6px 0 var(--mangoD);font:700 2.4rem var(--abc);color:var(--ink);cursor:pointer}
.lt.used{visibility:hidden}
.lt.hintb{animation:pulse2 .9s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}

/* Papan pelekat */
.board{position:relative;width:100%;aspect-ratio:4/5;max-height:62vh;border-radius:24px;overflow:hidden;background:linear-gradient(#a8e1f5 0 58%,#7ccf7f 58%);touch-action:none}
.board::before{content:"☀️";position:absolute;top:10px;right:14px;font-size:3rem}
.board .it{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab;touch-action:none}
.board .it.s0{font-size:2.4rem}.board .it.s1{font-size:3.6rem}.board .it.s2{font-size:5rem}
.board .bin{position:absolute;left:10px;bottom:10px;width:56px;height:56px;border-radius:16px;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.board .bin.hot{background:var(--coral)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tray button{border:0;border-radius:16px;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:2rem;width:56px;height:56px;cursor:pointer}

/* Parent gate */
.gate{position:relative;overflow:hidden;width:100%;max-width:280px;margin:0 auto;border:0;border-radius:18px;padding:16px;font:800 1.15rem var(--display);background:var(--ghost);color:var(--ink);cursor:pointer;touch-action:none}
.gate i{position:absolute;inset:0;width:0;background:var(--leaf);opacity:.6}
.gate span{position:relative}

.done h2{font-size:2.6rem;margin:0;color:var(--coral)}
.stars{font-size:2.4rem;letter-spacing:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:1.1rem;z-index:5;white-space:nowrap}
.demo{border:0;border-radius:18px;background:rgba(0,0,0,.25);color:var(--card);font-weight:700;font-size:1rem;padding:12px 14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.demo b{color:var(--mango)}
.code{font:700 1.4rem/1.2 var(--display);text-align:center;letter-spacing:.08em;text-transform:uppercase;border:3px solid var(--ghost);border-radius:16px;padding:10px;width:100%;max-width:260px;box-sizing:border-box;background:#fff;color:var(--ink);margin:0 auto}
.code.nm{text-transform:none;letter-spacing:0;font-size:1.4rem;max-width:300px}
.msg{font-weight:700;min-height:1.4em}
.lic{font:600 .95rem/1.35 ui-monospace,Menlo,Consolas,monospace;border:3px solid var(--ghost);border-radius:16px;padding:10px;width:100%;max-width:420px;min-height:7.5em;box-sizing:border-box;background:#fff;color:var(--ink);margin:0 auto;resize:vertical;word-break:break-all}
.licid{font:700 1.3rem/1.2 var(--display);letter-spacing:.06em;color:var(--ink);user-select:all;-webkit-user-select:all}
.par{border:0;background:none;color:var(--card);opacity:.85;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:underline;padding:6px}
.buy{border-top:2px dashed var(--ghost);padding-top:12px;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.btn.wa{background:var(--leaf);box-shadow:0 5px 0 var(--leafD);color:var(--ink)}
.foot{font-size:.85rem;color:var(--muted);text-align:center;margin-top:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  function verify(text,product,publicKeys,blocked,nacl){

    return {ok:true,id:p.id,keyNo:p.keyNo,issued:p.issued,game:p.game,text:format(p.rec,p.sig)};
  }

})();

    if(final){hc.clearRect(0,0,size,size);hl.classList.remove('blink');
      if(!done&&neat>=NEAT&&ink&&(!zonesOk||bodyCov<NEED)){const cs=gap/dpr+.6;hc.fillStyle='#b9a36a';
        zones.forEach((z,j)=>{if(!zonesOk&&zoneCov[j]>=ZONE)return;for(const k of z)if(!inked(k))hc.fillRect((k%gw)*gap/dpr,((k/gw)|0)*gap/dpr,cs,cs)});
        hl.classList.add('blink')}}
    const dotsOk=taps.length>=nd;
    if(final&&!done){
      if(neat<NEAT)tell('Ikut bentuk huruf, jangan conteng. Tekan Padam dan cuba lagi.','ikut-bentuk');
      else if(!zonesOk||bodyCov<NEED){if(meter>.5)tell('Warnakan seluruh bentuk huruf, sampai ke hujung.','sampai-hujung')}
      else if(!dotsOk)tell('Jangan lupa titik! Sentuh titik di tempatnya.','jangan-lupa-titik');
      else th.textContent=HINT;
    }
    if(!done&&bodyCov>=NEED&&zonesOk&&dotsOk&&neat>=NEAT){th.textContent='Syabas!';hc.clearRect(0,0,size,size);hl.classList.remove('blink');drawing=false;done=true;chime(true);addStar();speak(praise(),Lc(x));
      draw.parentElement.style.borderColor='var(--leaf)';
      const before=done0.size;done0.add(i);saveTraced(m);const after=done0.size;
      quietTimeout(()=>{if(!document.body.contains(draw))return;
        if(before<L.length&&after>=L.length)certificate(m);
        else if(before<FREE&&after>=FREE&&m==='U')celebrate10();
        else step(i,1,trace)},1200)}
  };
  ready=true;pend.forEach(markDots);pend=[];check(false);
}

/* ---------- 7. SUKU KATA (consonant + vowel: hear a syllable, pick it) ---------- */
function syllable(){
  setScreen(true);
  const pool=availCons(),R=8,order=roundOf(pool,R);let q=0,score=0,t=null;
  cleanup=()=>clearTimeout(t);
  function next(){
    if(q>=R)return finish(score,R,syllable);
    const c=order[q],vs=shuffle(VOW).slice(0,3),v=pick(vs),target=c.l+v;let miss=false,locked=false;
    const ask=()=>speak(Pc('mana-bunyi'),Sc(target));
    view.innerHTML=`<div class="stack">
      <div class="progress"><i style="width:${q/R*100}%"></i></div>
      <div class="prompt"><button class="saybtn corner" id="rp" aria-label="Dengar lagi">🔊</button>

      <div class="choices">${vs.map(o=>`<button class="tile sy" data-v="${o}" aria-label="${c.l+o}">${c.l+o}</button>`).join('')}</div></div>`;

        document.getElementById('vv').textContent=v;document.getElementById('rr').textContent=target;
        speak(praise(),Sc(target));q++;t=quietTimeout(next,1500)}
      else if(!b.classList.contains('no')){miss=true;b.classList.add('no');chime(false);speak(Sc(c.l+b.dataset.v),Pc('cuba-lagi'),Pc('mana-bunyi'),Sc(target))}
    });
  }
  next();
}

/* ---------- 8. EJA KATA (spell a short word, slots grouped by suku kata) ---------- */
function spell(){
  setScreen(true);
  const pool=availWords(),R=5,order=shuffle(pool).slice(0,R);let q=0,score=0,t=null;
  cleanup=()=>clearTimeout(t);
  function next(){
    if(q>=R)return finish(score,R,spell);
    const w=order[q],letters=w.w.split('');let pos=0,miss=0,wmiss=false,locked=false;
    let k0=0;const groups=w.s.map(s=>{const g=[...s].map((_,j)=>k0+j);k0+=s.length;return g});
    const say=()=>speak(Pc('eja'),Ec(w));
    view.innerHTML=`<div class="stack">
      <div class="progress"><i style="width:${q/R*100}%"></i></div>
      <div class="prompt stack" style="gap:10px"><button class="saybtn corner" id="rp" aria-label="Dengar lagi">🔊</button>
        <div class="pic" id="pc">${w.e}</div>
        <div class="slots">${groups.map(g=>`<div class="sg">${g.map(k=>`<span class="slot" id="s${k}"></span>`).join('')}</div>`).join('')}</div></div>
      <div class="ltrs">${shuffle(letters.map((ch,k)=>({ch,k}))).map(o=>`<button class="lt" data-c="${o.ch}">${o.ch.toUpperCase()}</button>`).join('')}</div></div>`;
    const mark=()=>view.querySelectorAll('.slot').forEach((s,k)=>s.classList.toggle('next',k===pos));
    mark();
    document.getElementById('rp').onclick=say;document.getElementById('pc').onclick=()=>speak(Ec(w));
    say();
    view.querySelectorAll('.lt').forEach(b=>b.onclick=()=>{
      if(locked||b.classList.contains('used'))return;
      const x=L.find(y=>y.l===b.dataset.c);
      if(b.dataset.c===letters[pos]){
        b.classList.add('used');const s=document.getElementById('s'+pos);s.textContent=letters[pos].toUpperCase();s.classList.add('fill');
        view.querySelectorAll('.lt').forEach(e=>e.classList.remove('hintb'));
        pos++;mark();miss=0;
        const g=groups.findIndex(g=>g[g.length-1]===pos-1);
        if(pos>=letters.length){locked=true;chime(true);if(!wmiss){score++;addStar()}
          speak(...w.s.map(Sc),Ec(w),praise());q++;t=quietTimeout(next,2000)}
        else if(g>=0){popSnd();speak(Sc(w.s[g]))}
        else{popSnd();speak(Lc(x))}
      }else{
        miss++;wmiss=true;chime(false);b.classList.remove('no');void b.offsetWidth;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),450);
        speak(Pc('cuba-lagi'));
        if(miss>=2){const h=[...view.querySelectorAll('.lt')].find(e=>!e.classList.contains('used')&&e.dataset.c===letters[pos]);if(h)h.classList.add('hintb')}
      }
    });
  }
  next();
}

  function drag(e,it){let down=false,sx,sy,moved=0;
    e.onpointerdown=ev=>{ev.preventDefault();down=true;sx=ev.clientX;sy=ev.clientY;moved=0;try{e.setPointerCapture(ev.pointerId)}catch(_){}
      items.splice(items.indexOf(it),1);items.push(it);e.style.zIndex=items.length+1};
    const overBin=()=>{const a=e.getBoundingClientRect(),b=bin.getBoundingClientRect();const cx=a.left+a.width/2,cy=a.top+a.height/2;return cx>b.left-10&&cx<b.right+10&&cy>b.top-10&&cy<b.bottom+10};
    e.onpointermove=ev=>{if(!down)return;const r=bd.getBoundingClientRect();moved+=Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy);sx=ev.clientX;sy=ev.clientY;
      it.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));it.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));
      e.style.left=it.x+'%';e.style.top=it.y+'%';bin.classList.toggle('hot',overBin())};
    e.onpointerup=e.onpointercancel=()=>{if(!down)return;down=false;bin.classList.remove('hot');
      if(moved<8){it.z=(it.z+1)%3;e.className='it s'+it.z;popSnd()}
      else if(overBin()){items.splice(items.indexOf(it),1);e.remove();chime(false)}
      persist()};
  }
  view.querySelectorAll('.tray button').forEach(b=>b.onclick=()=>{if(items.length>=40)return toast('Papan sudah penuh 🙂');
    items.push({s:b.dataset.s,x:20+Math.random()*60,y:15+Math.random()*60,z:1});persist();draw();popSnd()});
  draw();
}

/* ---------- LESEN KELUARGA (versi penuh) ----------
   Same system as Kenal Jawi: each family gets its own licence (KA1-…), signed with a private key
   that is never in this file. The game only checks the signature, so licences cannot be forged.
   Product 2 = Kenal ABC, so a Kenal Jawi or Wira Matematik licence does not open this game. */
const PRODUCT=2;
const PUBLIC_KEYS={2:"QVgEegZrfviPeApvWbbbkzk3xI6ZKX0zKd2wEfy9pS0="}; // key number -> Ed25519 public key (base64). Safe to publish: it can check licences, not make them
const BLOCKED=[]; // licence IDs ("KA-XXXXX-XXXXX") that were leaked publicly
let licence=null;
const checkLicence=t=>{try{return KJL.verify(t,PRODUCT,PUBLIC_KEYS,BLOCKED,nacl)}catch(e){return {ok:false,reason:'error'}}};
try{localStorage.removeItem('abc_full')}catch(e){} // the old test code no longer opens anything
{let t=null;try{t=localStorage.getItem('abc_licence')}catch(e){}
 if(t){const r=checkLicence(t);if(r.ok){licence=r;full=true}}}
const LIC_MSG={empty:'Sila tampal lesen anda dahulu.',
  format:'Lesen tidak lengkap. Pastikan anda menyalin semuanya, dari KA1- hingga huruf terakhir.',
  length:'Lesen tidak lengkap. Pastikan anda menyalin semuanya, dari KA1- hingga huruf terakhir.',
  unknown:'Lesen ini untuk versi lain permainan. Sila muat turun versi terkini Kenal ABC.',
  'unknown-key':'Lesen tidak sah. Semak semula atau hubungi kami.',
  signature:'Lesen tidak sah. Semak semula atau hubungi kami.',
  blocked:'Lesen ini telah disekat. Sila hubungi kami.',
  error:'Lesen tidak sah. Semak semula atau hubungi kami.'};
const licMsg=r=>r.reason==='other-game'?`Ini lesen ${r.game}, bukan Kenal ABC. Setiap permainan ada lesen sendiri.`:(LIC_MSG[r.reason]||LIC_MSG.signature);
function unlock(){gate(unlockScreen)}

  const inp=document.getElementById('lic'),msg=document.getElementById('msg');

  document.getElementById('hm').onclick=home;
  const rm=document.getElementById('rm'),msg=document.getElementById('msg');let armed=false;
  rm.onclick=()=>{
    if(!armed){armed=true;rm.textContent='Ya, buang lesen';rm.style.background='var(--coral)';rm.style.boxShadow='0 5px 0 var(--coralD)';
      msg.style.color='var(--coralD)';msg.textContent='Tekan sekali lagi untuk mengesahkan.';return}
    try{localStorage.removeItem('abc_licence')}catch(e){}
    licence=null;full=false;home();
  };
}

homeBtn.onclick=()=>{stopVoice();home()};
const sndBtn=document.getElementById('snd');
const showSnd=()=>{sndBtn.textContent=sound?'🔊':'🔇';sndBtn.setAttribute('aria-pressed',String(sound))};
sndBtn.onclick=()=>{sound=!sound;save('abc_sound',sound?1:0);if(!sound)stopVoice();showSnd()};

home();

// ===================== muzik latar (BGM) =====================
// Original loops composed for this game and played live with WebAudio: no music files, nothing to licence or credit.
// Quiet by design, drops lower while a voice clip or speech is playing, and pauses when the tab is hidden.
const BGM=(()=>{
  const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
  const hz=n=>{const m=/^([A-G][b#]?)(\d)$/.exec(n);return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12)};
  const CH={C:['C','E','G'],Am:['A','C','E'],F:['F','A','C'],G:['G','B','D'],Dm:['D','F','A'],Em:['E','G','B'],D:['D','F#','A'],
    Bm:['B','D','F#'],A:['A','C#','E'],E:['E','G#','B'],Bb:['Bb','D','F']};
  const T={
    home:{bpm:96,lead:'triangle',vol:0.07,echo:0.2,chords:'F Bb C F Dm Bb C C',mel:'C5 - A4 - F4 - A4 C5 | D5 - - - Bb4 - - . | E5 - D5 C5 G4 - C5 E5 | F5 - - - C5 - - . | D5 - F5 - A5 - F5 D5 | Bb4 - D5 - F5 - - . | G5 - F5 E5 D5 - E5 - | C5 - - - - - . .'},
    play:{bpm:118,lead:'square',vol:0.032,echo:0.12,pump:true,chords:'D G A D Bm G A A',mel:'F#5 - A5 - D6 - A5 F#5 | G5 - B5 - G5 - D5 . | E5 - A5 - C#6 - A5 E5 | F#5 - - - D5 - - . | D5 F#5 B5 F#5 D5 - B4 - | G4 - B4 - D5 - G5 - | A5 - G5 - F#5 - E5 - | C#5 - E5 - A4 - - .'}};
  for(const k in T){const t=T[k];t.c=t.chords.split(' ');t.m=t.mel.replace(/\|/g,' ').trim().split(/\s+/)}
  const KEY='abc_bgm';
  let on=true;try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  let ctx=null,out=null,dg=null,wet=null,cur=null,want=null,step=0,next=0,timer=null,started=false,swap=0;
  function init(){
    if(ctx)return true;
    try{ctx=actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return false}
    dg=ctx.createGain();dg.gain.value=1;dg.connect(ctx.destination);
    out=ctx.createGain();out.gain.value=0;out.connect(dg);
    const d=ctx.createDelay(1);d.delayTime.value=.3;const fb=ctx.createGain();fb.gain.value=.25;wet=ctx.createGain();wet.gain.value=.15;
    wet.connect(d);d.connect(fb);fb.connect(d);d.connect(out);return true}
  function note(type,f,t0,dur,vol,cut,echo){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    let n=o;if(cut){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;o.connect(lp);n=lp}
    n.connect(g);g.connect(out);if(echo)g.connect(wet);o.start(t0);o.stop(t0+dur+.05)}
  function tick(){
    if(!cur)return;const t=T[cur],e=60/t.bpm/2; // one eighth note
    if(next<ctx.currentTime)next=ctx.currentTime+.05;
    while(next<ctx.currentTime+.25){
      const i=step%t.m.length,pos=i%8,ch=CH[t.c[Math.floor(i/8)%t.c.length]],m=t.m[i];
      if(m!=='-'&&m!=='.'){let len=1;while(t.m[(i+len)%t.m.length]==='-'&&len<8)len++;
        note(t.lead,hz(m),next,e*len*(t.lead==='square'?.92:1.3),t.vol,t.lead==='square'?1600:0,true)}
      // soft chord arpeggio
      const arp=[0,1,2,1,0,1,2,1][pos];
      note(t.arp||'triangle',hz(ch[arp]+(pos>=2&&pos<=4&&arp===2?5:4)),next,e*1.5,.022,0,true);
      // bass
      if(t.pump||pos%4===0)note('triangle',hz(ch[0]+3),next,e*(t.pump?.9:3.5),.06,0,false);
      next+=e;step++}}
  function fade(v,s){const n=ctx.currentTime;out.gain.cancelScheduledValues(n);out.gain.setValueAtTime(out.gain.value,n);out.gain.linearRampToValueAtTime(v,n+s)}
  function play(name){
    if(name===want)return;want=name;if(!init())return;const my=++swap;
    if(cur)fade(0,.35);
    setTimeout(()=>{if(my!==swap)return;cur=name;step=0;next=ctx.currentTime+.05;if(!name)return;
      wet.gain.value=T[name].echo;fade(1,1.2)},cur?400:0);
    if(!timer)timer=setInterval(()=>{if(ctx.state==='suspended'&&want)ctx.resume();tick()},60)}
  function talking(){try{return !!(curA&&!curA.paused)||!!(window.speechSynthesis&&speechSynthesis.speaking)}catch(e){return false}}
  function update(){
    if(!started)return;
    play(on&&sound&&!document.hidden?(appEl.classList.contains('ingame')?'play':'home'):null);
    if(dg){const v=talking()?.3:1;if(Math.abs(dg.gain.value-v)>.01)dg.gain.setTargetAtTime(v,ctx.currentTime,.12)}}
  const start=()=>{started=true;update()};
  addEventListener('pointerdown',start,{once:true});addEventListener('keydown',start,{once:true});
  document.addEventListener('visibilitychange',update);
  setInterval(update,300);
  const btn=document.getElementById('bgmBtn');
  const show=()=>{btn.classList.toggle('off',!on);btn.setAttribute('aria-pressed',String(on))};
  btn.onclick=()=>{on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}show();started=true;update()};
  show();
  return {update};
})();
</script>
