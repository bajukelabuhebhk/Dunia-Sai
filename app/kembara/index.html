<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kembara Malaysia · Dunia Sai</title>
  <meta name="theme-color" content="#e8a317">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/shared/icons/favicon.png">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/css/theme.css">
  <style>
    .app-bar { color: var(--dakwat); }
    .app-bar .balik { color: var(--dakwat); background: rgb(255 255 255 / 0.35); }
    .tab-bar button[aria-selected="true"] { color: var(--dakwat); }

    .negeri-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .negeri {
      display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
      padding: 14px; background: var(--kertas); border-radius: var(--r-card);
      box-shadow: inset 0 0 0 3px var(--kuning-muda);
    }
    .negeri .ikon { grid-row: span 3; font-size: 2.4rem; }
    .negeri h3 { margin: 0; font-size: var(--t-md); }
    .negeri .ibu { font-weight: 700; color: var(--biru); }
    .negeri p { margin: 0; font-size: var(--t-sm); color: var(--dakwat-lembut); }
    .wilayah { margin-top: 20px; font-size: var(--t-sm); color: var(--dakwat-lembut); }

    .bahagian-tajuk { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 12px; }
    .bahagian-tajuk h2 { font-size: var(--t-lg); margin: 0; }
    .kuiz-pilih { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Recycling */
    .bahan {
      display: grid; place-items: center; gap: 4px; text-align: center;
      width: min(100%, 260px); margin: 4px auto 24px; padding: 18px;
      background: var(--kertas); border-radius: var(--r-card);
      box-shadow: inset 0 0 0 3px var(--garis), 0 6px 0 0 var(--garis);
    }
    .bahan .emoji { font-size: 4.5rem; line-height: 1.1; }
    .bahan strong { font-size: var(--t-md); }
    .tong-baris { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 560px; margin-inline: auto; }
    .tong {
      --c: #2f6fc0;
      display: grid; justify-items: center; gap: 6px; padding: 14px 6px 12px;
      font: 700 var(--t-base)/1.2 var(--font); color: #fff;
      background: var(--c); border: 0; border-radius: 10px 10px 22px 22px; cursor: pointer;
      box-shadow: 0 6px 0 0 color-mix(in srgb, var(--c) 65%, black);
      touch-action: manipulation;
    }
    .tong .penutup { width: 108%; height: 12px; margin-top: -24px; border-radius: 8px; background: color-mix(in srgb, var(--c) 75%, black); }
    .tong span:last-child { font-size: var(--t-sm); font-weight: 400; }
    .tong.kertas { --c: #2f6fc0; }
    .tong.kaca { --c: #8a5a2b; }
    .tong.plastik { --c: #ea7a12; }
    .tong:active { transform: translateY(4px); box-shadow: 0 2px 0 0 color-mix(in srgb, var(--c) 65%, black); }
    .tong.betul { outline: 5px solid var(--hijau); outline-offset: 3px; }
    .tong.salah { animation: goyang 300ms; outline: 5px solid var(--merah); outline-offset: 3px; }
  </style>
</head>
<body>
  <header class="app-bar">
    <a class="balik" href="/app/" aria-label="Kembali ke semua aplikasi">‹</a>
    <h1>Kembara Malaysia</h1>
    <span class="bintang-kiraan" aria-label="Jumlah bintang">⭐ <span data-bintang>0</span></span>
  </header>

  <nav class="tab-bar" role="tablist" aria-label="Aktiviti">
    <button role="tab" aria-controls="negeri">Negeri Malaysia</button>
    <button role="tab" aria-controls="kitar">Kitar Semula</button>
  </nav>

  <section id="negeri" class="panel" role="tabpanel" aria-label="Negeri Malaysia"></section>
  <section id="kitar" class="panel" role="tabpanel" aria-label="Kitar semula" hidden></section>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/storage.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script>
  (() => {
    const MOD = 'kembara';
    const { sound, speak, toast, pujian, shuffle, choices, esc, gate, showResult } = EduUI;

    const NEGERI = [
      { n: 'Perlis', ibu: 'Kangar', ikon: '🥭', fakta: 'Negeri paling kecil di Malaysia.' },
      { n: 'Kedah', ibu: 'Alor Setar', ikon: '🌾', fakta: 'Dikenali sebagai Jelapang Padi.' },
      { n: 'Pulau Pinang', ibu: 'George Town', ikon: '🏛️', fakta: 'George Town ialah Tapak Warisan Dunia UNESCO.' },
      { n: 'Perak', ibu: 'Ipoh', ikon: '⛏️', fakta: 'Pernah terkenal dengan perlombongan bijih timah.' },
      { n: 'Selangor', ibu: 'Shah Alam', ikon: '🏙️', fakta: 'Negeri yang paling ramai penduduk.' },
      { n: 'Negeri Sembilan', ibu: 'Seremban', ikon: '🏠', fakta: 'Terkenal dengan rumah beratap Minangkabau.' },
      { n: 'Melaka', ibu: 'Bandar Melaka', ikon: '🏰', fakta: 'Bandar bersejarah dan Tapak Warisan Dunia UNESCO.' },
      { n: 'Johor', ibu: 'Johor Bahru', ikon: '📍', fakta: 'Tanjung Piai di Johor ialah hujung paling selatan tanah besar Asia.' },
      { n: 'Pahang', ibu: 'Kuantan', ikon: '🌳', fakta: 'Negeri paling besar di Semenanjung Malaysia.' },
      { n: 'Terengganu', ibu: 'Kuala Terengganu', ikon: '🏝️', fakta: 'Pulau Redang dan Pulau Perhentian terletak di sini.' },
      { n: 'Kelantan', ibu: 'Kota Bharu', ikon: '🪁', fakta: 'Terkenal dengan wau bulan.' },
      { n: 'Sabah', ibu: 'Kota Kinabalu', ikon: '⛰️', fakta: 'Gunung Kinabalu ialah gunung tertinggi di Malaysia.' },
      { n: 'Sarawak', ibu: 'Kuching', ikon: '🏞️', fakta: 'Negeri paling besar di Malaysia.' },
    ];

    const BAHAN = [
      { b: 'Surat khabar lama', e: '📰', t: 'kertas' },
      { b: 'Kotak kadbod', e: '📦', t: 'kertas' },
      { b: 'Buku latihan lama', e: '📚', t: 'kertas' },
      { b: 'Sampul surat', e: '✉️', t: 'kertas' },
      { b: 'Balang kuih', e: '🫙', t: 'kaca' },
      { b: 'Botol susu kaca', e: '🥛', t: 'kaca' },
      { b: 'Botol kicap kaca', e: '🫙', t: 'kaca' },
      { b: 'Botol air plastik', e: '🧴', t: 'plastik' },
      { b: 'Tin sardin', e: '🥫', t: 'plastik' },
      { b: 'Tin minuman', e: '🥫', t: 'plastik' },
      { b: 'Botol syampu', e: '🧴', t: 'plastik' },
      { b: 'Bekas aiskrim plastik', e: '🍦', t: 'plastik' },
    ];
    const TONG = {
      kertas: { nama: 'Biru', isi: 'Kertas' },
      kaca: { nama: 'Coklat', isi: 'Kaca' },
      plastik: { nama: 'Oren', isi: 'Plastik & tin' },
    };

    // ---------- Negeri ----------
    const negeriEl = document.getElementById('negeri');
    function renderNegeri() {
      const p = EduStore.getProgress(MOD);
      const open = EduStore.hasAccess(MOD);
      const s1 = p.stars.n1 || 0, s2 = p.stars.n2 || 0;
      negeriEl.innerHTML = `
        <div class="bahagian-tajuk">
          <h2>Uji diri</h2>
          <div class="kuiz-pilih">
            <button class="btn btn-kuning" data-kuiz="n1">Cari ibu negeri ${'⭐'.repeat(s1)}</button>
            <button class="btn btn-kuning" data-kuiz="n2" style="position:relative" ${open ? '' : 'data-kunci'}>${open ? '' : '🔒 '}Cari negeri ${'⭐'.repeat(s2)}</button>
          </div>
        </div>
        <div class="bahagian-tajuk"><h2>13 negeri dan ibu negerinya</h2></div>
        <div class="negeri-grid">
          ${NEGERI.map((x) => `<article class="negeri">
            <span class="ikon" aria-hidden="true">${x.ikon}</span>
            <h3>${esc(x.n)}</h3>
            <span class="ibu">${esc(x.ibu)}</span>
            <p>${esc(x.fakta)}</p>
          </article>`).join('')}
        </div>
        <p class="wilayah">Malaysia juga mempunyai tiga Wilayah Persekutuan: Kuala Lumpur, Putrajaya dan Labuan.</p>`;
    }
    negeriEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-kuiz]');
      if (!b) return;
      const id = b.dataset.kuiz;
      if (gate(MOD, id === 'n1', refreshAll)) kuizNegeri(id);
    });

    function kuizNegeri(id) {
      const songsang = id === 'n2'; // capital -> state
      const qs = shuffle(NEGERI).slice(0, songsang ? 10 : 6);
      let q = 0, betul = 0;
      function tunjuk() {
        if (q >= qs.length) {
          return showResult(negeriEl, { moduleId: MOD, activityId: id, correct: betul, total: qs.length,
            onAgain: () => kuizNegeri(id), onNext: renderNegeri });
        }
        const x = qs[q];
        const pilihan = choices(NEGERI, x, 4, (a, b) => a.n === b.n);
        negeriEl.innerHTML = `
          <div class="meter" style="--isi:${(q / qs.length) * 100}%;max-width:420px;margin:4px auto 16px" aria-hidden="true"><span></span></div>
          <p style="text-align:center;font-size:4rem;margin:0 auto" aria-hidden="true">${x.ikon}</p>
          <p class="soalan">${songsang ? `${esc(x.ibu)} ialah ibu negeri bagi negeri apa?` : `Apakah ibu negeri ${esc(x.n)}?`}</p>
          <div class="grid-pilihan">${pilihan.map((o, i) => `<button class="pilihan" style="font-size:var(--t-md)" data-i="${i}">${esc(songsang ? o.n : o.ibu)}</button>`).join('')}</div>
          <p style="text-align:center;margin-top:20px"><button class="btn btn-garis btn-kecil" data-keluar>Berhenti</button></p>`;
        negeriEl.querySelector('[data-keluar]').onclick = renderNegeri;
        negeriEl.querySelectorAll('[data-i]').forEach((b) => b.onclick = () => {
          negeriEl.querySelectorAll('[data-i]').forEach((z) => (z.disabled = true));
          const ok = pilihan[+b.dataset.i].n === x.n;
          b.classList.add(ok ? 'betul' : 'salah');
          if (ok) { betul++; sound('correct'); toast(pujian()); }
          else {
            sound('wrong');
            negeriEl.querySelector(`[data-i="${pilihan.indexOf(x)}"]`).classList.add('betul');
            toast(`${x.ibu}, ${x.n}`);
          }
          speak(`${x.ibu}, ${x.n}`);
          q++;
          setTimeout(tunjuk, ok ? 1100 : 1800);
        });
      }
      sound('click');
      tunjuk();
    }

    // ---------- Kitar semula ----------
    const kitarEl = document.getElementById('kitar');
    function renderKitar() {
      const p = EduStore.getProgress(MOD);
      const open = EduStore.hasAccess(MOD);
      kitarEl.innerHTML = `
        <p class="soalan" style="font-size:var(--t-md)">Masukkan setiap bahan ke dalam tong kitar semula yang betul.</p>
        <div class="tong-baris" aria-hidden="true" style="margin-bottom:24px;pointer-events:none">
          ${Object.entries(TONG).map(([k, t]) => `<div class="tong ${k}"><span class="penutup"></span><span>${t.nama}</span><span>${t.isi}</span></div>`).join('')}
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-kuning" data-k="k1">Pusingan 1 ${'⭐'.repeat(p.stars.k1 || 0)}</button>
          <button class="btn btn-kuning" data-k="k2">${open ? '' : '🔒 '}Semua bahan ${'⭐'.repeat(p.stars.k2 || 0)}</button>
        </div>`;
    }
    kitarEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (!b) return;
      if (gate(MOD, b.dataset.k === 'k1', refreshAll)) mainKitar(b.dataset.k);
    });

    function mainKitar(id) {
      const qs = id === 'k1'
        ? shuffle(['kertas', 'kaca', 'plastik'].flatMap((t) => shuffle(BAHAN.filter((b) => b.t === t)).slice(0, 2)))
        : shuffle(BAHAN);
      let q = 0, betul = 0;
      function tunjuk() {
        if (q >= qs.length) {
          return showResult(kitarEl, { moduleId: MOD, activityId: id, correct: betul, total: qs.length,
            onAgain: () => mainKitar(id), onNext: renderKitar });
        }
        const x = qs[q];
        kitarEl.innerHTML = `
          <div class="meter" style="--isi:${(q / qs.length) * 100}%;max-width:420px;margin:4px auto 16px" aria-hidden="true"><span></span></div>
          <div class="bahan"><span class="emoji" aria-hidden="true">${x.e}</span><strong>${esc(x.b)}</strong></div>
          <div class="tong-baris">
            ${Object.entries(TONG).map(([k, t]) => `<button class="tong ${k}" data-t="${k}" aria-label="Tong ${t.nama} untuk ${t.isi}">
              <span class="penutup" aria-hidden="true"></span><span>${t.nama}</span><span>${t.isi}</span></button>`).join('')}
          </div>
          <p style="text-align:center;margin-top:24px"><button class="btn btn-garis btn-kecil" data-keluar>Berhenti</button></p>`;
        speak(x.b);
        kitarEl.querySelector('[data-keluar]').onclick = renderKitar;
        kitarEl.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => {
          kitarEl.querySelectorAll('[data-t]').forEach((z) => (z.disabled = true));
          const ok = b.dataset.t === x.t;
          b.classList.add(ok ? 'betul' : 'salah');
          if (ok) { betul++; sound('correct'); toast(pujian()); }
          else {
            sound('wrong');
            kitarEl.querySelector(`[data-t="${x.t}"]`).classList.add('betul');
            toast(`${x.b} masuk tong ${TONG[x.t].nama.toLowerCase()}`);
          }
          q++;
          setTimeout(tunjuk, ok ? 900 : 1800);
        });
      }
      sound('click');
      tunjuk();
    }

    function refreshAll() { renderNegeri(); renderKitar(); }

    EduUI.initModule(MOD);
    refreshAll();
  })();
  </script>
</body>
</html>
