<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kenal ABC & Suku Kata · Dunia Sai</title>
  <meta name="theme-color" content="#d23c4b">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/shared/icons/favicon.png">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/css/theme.css">
  <style>
    .petunjuk-warna { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 0 0 16px; font-size: var(--t-sm); }
    .petunjuk-warna span { display: inline-flex; align-items: center; gap: 6px; }
    .petunjuk-warna i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

    .papan-abc { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
    .papan-abc button {
      aspect-ratio: 1; font: 700 2rem/1 var(--font);
      background: var(--kertas); border: 0; border-radius: var(--r-tile); cursor: pointer;
      box-shadow: inset 0 0 0 3px var(--garis), 0 5px 0 0 var(--garis);
    }
    .papan-abc button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--merah), 0 5px 0 0 var(--merah); }

    .kad-huruf {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      background: var(--kertas); border-radius: var(--r-card); padding: 20px; margin-bottom: 20px;
    }
    .kad-huruf .besar { font: 700 5rem/1 var(--font); min-width: 1.6em; }
    .kad-huruf .gambar { font-size: 4rem; line-height: 1; }
    .kad-huruf .kata { font: 700 var(--t-xl)/1.1 var(--font); margin: 0 0 8px; }

    .pilih-konsonan { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .pilih-konsonan button {
      width: 48px; height: 48px; font: 700 var(--t-md) var(--font); color: var(--konsonan);
      background: var(--kertas); border: 0; border-radius: 12px; cursor: pointer;
      box-shadow: inset 0 0 0 2px var(--garis);
    }
    .pilih-konsonan button[aria-pressed="true"] { color: #fff; background: var(--konsonan); box-shadow: none; }
    .baris-kv { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
    .baris-kv button.tile { font-size: 2.4rem; border: 0; cursor: pointer; padding: 0.2em; }
    .baris-kv button.tile:active { transform: translateY(4px); }
    h3 { margin-top: 28px; }

    .sasaran { text-align: center; margin-bottom: 12px; }
    .sasaran .gambar { font-size: 5rem; line-height: 1.1; }
    .slot-baris { display: flex; gap: 10px; justify-content: center; margin: 12px 0 24px; flex-wrap: wrap; }
    .slot {
      min-width: 96px; min-height: 76px; display: grid; place-items: center;
      border: 3px dashed var(--garis); border-radius: var(--r-tile);
      font: 700 2.2rem/1 var(--font); background: transparent;
    }
    .slot.ada { border-style: solid; border-color: var(--garis); background: var(--kertas); }
    .kolam { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .kolam button.tile { font-size: 2.2rem; border: 0; cursor: pointer; min-width: 96px; min-height: 72px; }
    .kolam button.tile[disabled] { opacity: 0.25; cursor: default; }
    .tahap-senarai { display: grid; gap: 12px; max-width: 560px; margin-inline: auto; }
    .tahap {
      position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
      width: 100%; padding: 14px 16px; font: inherit; color: var(--dakwat);
      background: var(--kertas); border: 0; border-radius: var(--r-card); cursor: pointer;
      box-shadow: inset 0 0 0 3px var(--garis), 0 5px 0 0 var(--garis);
    }
    .tahap .contoh { font: 700 var(--t-md) var(--font); flex: none; min-width: 5.5em; }
    .tahap small { color: var(--dakwat-lembut); display: block; }
    .tahap .skor { margin-left: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="app-bar">
    <a class="balik" href="/app/" aria-label="Kembali ke semua aplikasi">‹</a>
    <h1>Kenal ABC & Suku Kata</h1>
    <span class="bintang-kiraan" aria-label="Jumlah bintang">⭐ <span data-bintang>0</span></span>
  </header>

  <nav class="tab-bar" role="tablist" aria-label="Aktiviti">
    <button role="tab" aria-controls="abc">Kenal ABC</button>
    <button role="tab" aria-controls="sukukata">Suku Kata</button>
    <button role="tab" aria-controls="bina">Bina Perkataan</button>
  </nav>

  <div class="petunjuk-warna" aria-hidden="true">
    <span><i style="background:var(--konsonan)"></i>Konsonan</span>
    <span><i style="background:var(--vokal)"></i>Vokal</span>
  </div>

  <section id="abc" class="panel" role="tabpanel" aria-label="Kenal huruf A hingga Z">
    <div class="kad-huruf" id="kad" aria-live="polite"></div>
    <div class="papan-abc" id="papan-abc"></div>
  </section>

  <section id="sukukata" class="panel" role="tabpanel" aria-label="Suku kata" hidden>
    <h3 style="margin-top:0">Suku kata KV</h3>
    <p>Pilih satu konsonan, kemudian tekan suku kata untuk mendengarnya.</p>
    <div class="pilih-konsonan" id="konsonan"></div>
    <div class="baris-kv" id="baris-kv"></div>
    <h3>Suku kata KVK</h3>
    <p>Konsonan, vokal, konsonan. Suku kata ini selalu muncul di hujung perkataan.</p>
    <div class="baris-kv" id="baris-kvk"></div>
  </section>

  <section id="bina" class="panel" role="tabpanel" aria-label="Bina perkataan" hidden></section>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/storage.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script>
  (() => {
    const MOD = 'abc';
    const { sound, speak, toast, pujian, shuffle, esc, gate, showResult, colourWord } = EduUI;

    const ABC = [
      ['A','ayam','🐔'], ['B','buku','📘'], ['C','cawan','☕'], ['D','daun','🍃'], ['E','epal','🍎'],
      ['F','feri','⛴️'], ['G','gajah','🐘'], ['H','harimau','🐯'], ['I','ikan','🐟'], ['J','jam','⏰'],
      ['K','kucing','🐱'], ['L','lampu','💡'], ['M','meja','🪑'], ['N','nanas','🍍'], ['O','oren','🍊'],
      ['P','pisang','🍌'], ['Q','Quran','📖'], ['R','rumah','🏠'], ['S','sudu','🥄'], ['T','topi','🧢'],
      ['U','ular','🐍'], ['V','van','🚐'], ['W','wau','🪁'], ['X','x-ray','🩻'], ['Y','yoyo','🪀'], ['Z','zirafah','🦒'],
    ];
    const VOKAL = ['a', 'e', 'i', 'o', 'u'];
    const KONSONAN = 'b c d f g h j k l m n p r s t w y z'.split(' ');
    const KVK = ['bak', 'but', 'dam', 'kan', 'lam', 'mah', 'nas', 'pas', 'rus', 'sut', 'tik', 'kul', 'lah', 'tak', 'pit', 'kap'];

    const TAHAP = [
      { id: 'kvkv', nama: 'KV + KV', contoh: 'bu-ku', free: true, kata: [
        ['bu','ku','📘'], ['bo','la','⚽'], ['ma','ta','👁️'], ['ka','ki','🦶'], ['gu','ru','🧑‍🏫'],
        ['ro','ti','🍞'], ['ku','da','🐴'], ['ba','ju','👕'], ['sa','pu','🧹'], ['ta','li','🪢'] ] },
      { id: 'kvkvk', nama: 'KV + KVK', contoh: 'ru-mah', kata: [
        ['ru','mah','🏠'], ['ka','sut','👟'], ['ba','kul','🧺'], ['ki','pas','🪭'], ['bu','lan','🌙'],
        ['ja','lan','🛣️'], ['ma','kan','🍽️'], ['ka','tak','🐸'] ] },
      { id: 'tiga', nama: 'Tiga dan empat suku kata', contoh: 'ke-re-ta', kata: [
        ['ke','re','ta','🚗'], ['ke','la','pa','🥥'], ['pe','ra','hu','⛵'], ['se','ko','lah','🏫'],
        ['ma','ta','ha','ri','☀️'], ['ku','pu','ku','pu','🦋'] ] },
    ];
    const SOALAN = 6;

    // ---------- Kenal ABC ----------
    const papan = document.getElementById('papan-abc');
    const kad = document.getElementById('kad');
    papan.innerHTML = ABC.map(([h], i) => `<button data-i="${i}" aria-label="Huruf ${h}">${colourWord(h)}</button>`).join('');
    function pilihABC(i, cakap = true) {
      const [h, kata, gambar] = ABC[i];
      papan.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.i == i));
      kad.innerHTML = `
        <div class="besar">${colourWord(h + h.toLowerCase())}</div>
        <div class="gambar" aria-hidden="true">${gambar}</div>
        <div>
          <p class="kata">${colourWord(kata)}</p>
          <button class="btn btn-merah btn-kecil" data-dengar>🔊 Dengar</button>
        </div>`;
      const sebut = () => speak(`${h}. ${h} untuk ${kata}`);
      kad.querySelector('[data-dengar]').onclick = sebut;
      if (cakap) { sound('click'); sebut(); }
      EduStore.markSeen(MOD, 'abc-' + h);
    }
    papan.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]');
      if (b) pilihABC(+b.dataset.i);
    });

    // ---------- Suku kata ----------
    const konsonanEl = document.getElementById('konsonan');
    const barisKV = document.getElementById('baris-kv');
    const barisKVK = document.getElementById('baris-kvk');
    konsonanEl.innerHTML = KONSONAN.map((k) => `<button data-k="${k}" aria-label="Konsonan ${k}">${k}</button>`).join('');
    function pilihKonsonan(k) {
      konsonanEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === k));
      barisKV.innerHTML = VOKAL.map((v) => `<button class="tile" data-sebut="${k + v}">${colourWord(k + v)}</button>`).join('');
    }
    function renderKVK() {
      const open = EduStore.hasAccess(MOD);
      barisKVK.innerHTML = KVK.map((s) => `<button class="tile ${open ? '' : 'kunci'}" style="position:relative" data-kvk="${s}">${colourWord(s)}</button>`).join('');
    }
    konsonanEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (b) { sound('click'); pilihKonsonan(b.dataset.k); }
    });
    barisKV.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sebut]');
      if (b) speak(b.dataset.sebut);
    });
    barisKVK.addEventListener('click', (e) => {
      const b = e.target.closest('[data-kvk]');
      if (b && gate(MOD, false, refreshAll)) speak(b.dataset.kvk);
    });

    // ---------- Bina perkataan ----------
    const bina = document.getElementById('bina');
    function senarai() {
      const p = EduStore.getProgress(MOD);
      const open = EduStore.hasAccess(MOD);
      bina.innerHTML = `
        <p class="soalan" style="font-size:var(--t-md)">Susun suku kata untuk membina perkataan.</p>
        <div class="tahap-senarai">${TAHAP.map((t, n) => {
          const s = p.stars[t.id] || 0;
          return `<button class="tahap ${!open && !t.free ? 'kunci' : ''}" data-t="${n}">
            <span class="contoh">${t.contoh.split('-').map(colourWord).join('<span style="color:var(--garis)">-</span>')}</span>
            <span><strong>${esc(t.nama)}</strong><small>${t.kata.length} perkataan</small></span>
            <span class="skor" aria-label="${s} bintang">${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>
          </button>`;
        }).join('')}</div>`;
    }
    bina.addEventListener('click', (e) => {
      const b = e.target.closest('[data-t]');
      if (!b) return;
      const t = TAHAP[+b.dataset.t];
      if (gate(MOD, t.free, refreshAll)) main(t);
    });

    // Extra syllable so the last tap is still a choice
    function pengacau(sukuKata) {
      const pool = TAHAP.flatMap((t) => t.kata.flatMap((k) => k.slice(0, -1))).filter((s) => !sukuKata.includes(s));
      return shuffle(pool)[0];
    }

    function main(t) {
      const kata = shuffle(t.kata).slice(0, Math.min(SOALAN, t.kata.length));
      let q = 0, betul = 0;

      function tunjuk() {
        if (q >= kata.length) {
          return showResult(bina, {
            moduleId: MOD, activityId: t.id, correct: betul, total: kata.length,
            onAgain: () => main(t), onNext: senarai,
          });
        }
        const w = kata[q];
        const suku = w.slice(0, -1);
        const gambar = w[w.length - 1];
        const perkataan = suku.join('');
        const kolam = shuffle([...suku, pengacau(suku)]);
        const isi = [];
        bina.innerHTML = `
          <div class="meter" style="--isi:${(q / kata.length) * 100}%;max-width:420px;margin:4px auto 16px" aria-hidden="true"><span></span></div>
          <div class="sasaran">
            <div class="gambar" aria-hidden="true">${gambar}</div>
            <button class="btn btn-garis btn-kecil" data-dengar>🔊 Dengar perkataan</button>
          </div>
          <div class="slot-baris" aria-label="Jawapan anda">${suku.map((_, i) => `<div class="slot" data-slot="${i}"></div>`).join('')}</div>
          <div class="kolam">${kolam.map((s, i) => `<button class="tile" data-p="${i}" aria-label="Suku kata ${s}">${colourWord(s)}</button>`).join('')}</div>
          <p style="text-align:center;margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-garis btn-kecil" data-undur>Padam satu</button>
            <button class="btn btn-garis btn-kecil" data-keluar>Pilih tahap lain</button>
          </p>`;
        const dengar = () => speak(suku.join(' . ') + '. ' + perkataan);
        bina.querySelector('[data-dengar]').onclick = dengar;
        bina.querySelector('[data-keluar]').onclick = senarai;
        setTimeout(dengar, 250);

        const lukis = () => {
          bina.querySelectorAll('[data-slot]').forEach((s, i) => {
            s.innerHTML = isi[i] != null ? colourWord(kolam[isi[i]]) : '';
            s.classList.toggle('ada', isi[i] != null);
          });
          bina.querySelectorAll('[data-p]').forEach((b) => (b.disabled = isi.includes(+b.dataset.p)));
        };
        bina.querySelector('[data-undur]').onclick = () => { isi.pop(); lukis(); };
        bina.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
          if (isi.length >= suku.length) return;
          isi.push(+b.dataset.p);
          speak(kolam[+b.dataset.p]);
          lukis();
          if (isi.length === suku.length) semak();
        });

        function semak() {
          const jawab = isi.map((i) => kolam[i]).join('');
          const ok = jawab === perkataan;
          bina.querySelectorAll('[data-p]').forEach((b) => (b.disabled = true));
          bina.querySelectorAll('[data-slot]').forEach((s) => s.style.borderColor = ok ? 'var(--hijau)' : 'var(--merah)');
          if (ok) { betul++; sound('correct'); toast(pujian()); speak(perkataan); }
          else { sound('wrong'); toast(`Perkataannya ${suku.join('-')}`); }
          q++;
          setTimeout(tunjuk, ok ? 1200 : 1900);
        }
      }
      sound('click');
      tunjuk();
    }

    function refreshAll() { renderKVK(); senarai(); }

    EduUI.initModule(MOD);
    pilihABC(0, false);
    pilihKonsonan('b');
    refreshAll();
  })();
  </script>
</body>
</html>
