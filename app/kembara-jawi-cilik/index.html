:root{--cream:#fdfbf7;--em:#0f5132;--em2:#198754;--em3:#d1fae5;--gold:#d97706;--gold2:#fef3c7;--rose:#e11d48;--rose2:#ffe4e6;--ink:#1f2937;--mute:#64748b;--line:#f1e4c8;
 --jawi:'Noto Naskh Arabic','Traditional Arabic',serif;--ui:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-size:18px;line-height:1.35;color:var(--ink);background:var(--cream);background-image:radial-gradient(#e9e2d2 1px,transparent 1px);background-size:20px 20px;min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
.jw{font-family:var(--jawi);direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.7}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:2px solid var(--line);box-shadow:0 2px 8px #0000000d}
.bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px 8px max(44px,env(safe-area-inset-left))}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#059669,#0f766e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:20px;font-weight:800;color:#064e3b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:0;font-size:15px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:2px solid #d1fae5;background:#ecfdf5;color:#065f46;border-radius:14px;min-height:46px;min-width:46px;padding:4px 10px;font-weight:800;font-size:16px}
.hb.g{border-color:#fde68a;background:#fffbeb;color:#92400e}
.hb.s{border-color:#e2e8f0;background:#f8fafc}
@media(max-width:560px){.hb .tx{display:none}}
main{max-width:980px;margin:0 auto;padding:14px 12px 60px max(44px,env(safe-area-inset-left))}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 14px #0000000f;padding:16px}
/* Peta tahap */
.peta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media(max-width:560px){.tahap{min-height:0;padding:12px}.tahap .ic{font-size:30px}.tahap b{font-size:18px}.salam{margin-bottom:8px}.salam .big{font-size:20px}.salam p{font-size:15px}}
.tahap{position:relative;text-align:left;border:3px solid #e2e8f0;background:#fff;border-radius:22px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.tahap:active{transform:scale(.97)}
.tahap .ic{font-size:40px;line-height:1}
.tahap b{font-size:20px}
.tahap small{font-size:15px;color:var(--mute);font-weight:600}
.tahap .st{margin-top:auto;font-weight:800;color:var(--gold)}
.tahap.kunci{opacity:.55;filter:grayscale(.7)}
.tahap.kunci::after{content:'🔒';position:absolute;top:10px;right:12px;font-size:26px}
.tahap .meter{height:10px;border-radius:9px;background:#f1f5f9;overflow:hidden}
.tahap .meter i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f59e0b);border-radius:9px}
.t1{border-color:#a7f3d0}.t2{border-color:#bae6fd}.t3{border-color:#fecdd3}.t4{border-color:#fde68a}.t5{border-color:#ddd6fe}
.salam{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.salam .big{font-size:22px;font-weight:800;color:#064e3b}
.salam p{margin:0;color:var(--mute);font-weight:600;font-size:16px}
/* Senarai pelajaran */
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hdr h2{margin:0;font-size:22px;flex:1;min-width:180px}
.back{border:0;background:#f6c35b;box-shadow:0 4px #d59c2c;border-radius:16px;font-weight:800;min-height:50px;padding:6px 16px;font-size:18px}
.back:active{transform:translateY(3px);box-shadow:0 1px #d59c2c}
.pel{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pel button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:18px;padding:12px;min-height:76px}
.pel .ic{font-size:30px;width:44px;text-align:center;flex:none}
.pel b{display:block;font-size:18px}
.pel small{color:var(--mute);font-weight:600;font-size:15px}
.pel .ok{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.pel button.siap{border-color:#6ee7b7;background:#f0fdf4}
/* Main */
.top2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top2 .prog{flex:1;height:14px;background:#f1f5f9;border-radius:10px;overflow:hidden}
.top2 .prog i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .3s}
.top2 .n{font-weight:800;color:var(--mute);font-size:16px}
.rule{background:#fffbeb;border:2px solid #fde68a;border-radius:18px;padding:12px 14px;font-size:17px;margin-bottom:12px}
.rule .jw{font-size:24px}
.soal{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
@media(max-width:700px){.soal{grid-template-columns:1fr}}
.prompt{background:linear-gradient(135deg,#ecfdf5,#fffbeb);border:2px solid #d1fae5;border-radius:20px;padding:16px;text-align:center}
.prompt .em{font-size:64px;line-height:1.1}
.prompt .rm{font-size:30px;font-weight:800;letter-spacing:.04em}
.prompt .hint{display:inline-block;margin-top:8px;background:#fff;border:2px solid #fde68a;border-radius:14px;padding:6px 12px;font-size:17px;font-weight:700}
.say{border:0;background:#0ea5e9;color:#fff;border-radius:50%;width:58px;height:58px;font-size:28px;box-shadow:0 4px #0369a1;margin:8px auto 0;display:inline-flex;align-items:center;justify-content:center}
.say:active{transform:translateY(3px);box-shadow:0 1px #0369a1}
.say.sm{width:44px;height:44px;font-size:20px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid #e2e8f0;background:#fff;border-radius:22px;min-height:110px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px #e2e8f0;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 1px #e2e8f0}
.opt .jw{font-size:56px;line-height:1.3}
.opt.word .jw{font-size:44px}
.opt.betul{border-color:#10b981;background:#d1fae5;box-shadow:0 4px #10b981}
.opt.salah{border-color:#fb7185;background:#fff1f2;animation:shake .3s}
.fb{margin-top:14px;border-radius:18px;padding:12px 14px;font-size:18px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{background:#ecfdf5;border:2px solid #a7f3d0;color:#065f46}
.fb.no{background:#fff1f2;border:2px solid #fecdd3;color:#9f1239}
.fb .tx{flex:1;min-width:200px}
.next{border:0;background:#059669;color:#fff;border-radius:18px;min-height:56px;padding:8px 22px;font-weight:800;font-size:20px;box-shadow:0 4px #065f46}
.next:active{transform:translateY(3px);box-shadow:0 1px #065f46}
.btn2{border:2px solid #e2e8f0;background:#f8fafc;border-radius:16px;min-height:52px;padding:6px 16px;font-weight:800}

function item(p){ // senarai item bagi satu pelajaran
 if(p.jenis==='kenal'||p.jenis==='surih')return p.huruf.split(' ');
 if(p.jenis==='bina'||p.jenis==='sambung')return p.kata;
 return p.bank.map(b=>b[0]);
}

const jumlahTahap=t=>t.pel.reduce((a,p)=>a+jumlahPel(p),0);

let AC=null;const BUF={},LOAD={};let srcNow=[],seqId=0,htmlNow=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)try{AC=new C()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function muat(k){if(BUF[k])return Promise.resolve(BUF[k]);if(LOAD[k])return LOAD[k];
 LOAD[k]=fetch('audio/'+k+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((ok,no)=>{const a=ac();if(!a)return no();a.decodeAudioData(b,ok,no)})).then(x=>(BUF[k]=x)).catch(()=>{delete LOAD[k];return null});return LOAD[k]}
function henti(){seqId++;srcNow.forEach(s=>{try{s.stop()}catch(e){}});srcNow=[];if(htmlNow){try{htmlNow.pause()}catch(e){}htmlNow=null}}
// Mainkan klip berturutan; klip yang tiada dilangkau.
async function cakap(list){henti();if(S.mute)return;const id=seqId;list=(Array.isArray(list)?list:[list]).filter(k=>k&&ADA.has(k));
 for(const k of list){if(id!==seqId)return;const a=ac();const b=a?await muat(k):null;if(id!==seqId)return;
  if(b&&a){await new Promise(done=>{const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.onended=done;srcNow.push(s);s.start();setTimeout(done,b.duration*1000+400)})}
  else{await new Promise(done=>{const h=new Audio('audio/'+k+'.mp3');htmlNow=h;h.onended=done;h.onerror=done;h.play().catch(done);setTimeout(done,4000)})}
  if(id!==seqId)return;await new Promise(r=>setTimeout(r,120))}}
function nada(f,d,type,vol,del){if(S.mute)return;const a=ac();if(!a)return;const t=a.currentTime+(del||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

const cf=$('confetti'),cx=cf.getContext('2d');let bits=[],cfA=0;
function konfeti(){cf.width=innerWidth;cf.height=innerHeight;const c=['#10b981','#f59e0b','#3b82f6','#ec4899','#8b5cf6'];
 for(let i=0;i<40;i++)bits.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*7+5,c:c[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.3,l:1});
 if(!cfA)cfA=requestAnimationFrame(anim)}
function anim(){cx.clearRect(0,0,cf.width,cf.height);bits=bits.filter(b=>b.l>.02);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.32;b.r+=b.vr;b.l-=.018;cx.save();cx.globalAlpha=b.l;cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=b.c;cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*.65);cx.restore()});cfA=bits.length?requestAnimationFrame(anim):0}

function mKenal(){const {p,i,list}=cur;const h=LJ[list[i]];
 const kel=p.huruf.split(' ').filter(c=>c!==h.j);let opts=kocok(kel).slice(0,3);
 if(opts.length<3){const lain=kocok(L.map(x=>x.j).filter(c=>c!==h.j&&!opts.includes(c)));while(opts.length<3)opts.push(lain.pop())}
 opts=kocok([h.j].concat(opts));
 app.innerHTML=atas()+`<div class="soal"><div class="prompt"><div style="font-weight:800;color:#047857">Cari huruf</div><div class="rm">${h.n}</div>

  <div><div class="opts">${opts.map(o=>`<button class="opt" type="button" data-o="${o}"><span class="jw">${o}</span></button>`).join('')}</div><div id="fb"></div></div></div>`;
 ikatAtas();const dengar=()=>cakap(['frasa-cari-huruf',h.k]);$('bsay').onclick=dengar;dengar();let siap=false;
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(siap)return;const o=b.dataset.o;
  if(o===h.j){siap=true;b.classList.add('betul');cakap([puji(),h.k]);$('fb').innerHTML=betul(h.j,`Betul! Ini huruf <b>${h.n}</b> <span class="jw" style="font-size:30px">${h.j}</span>. ${titikKata(h)}.${h.my?' Huruf ini ciptaan Jawi untuk bunyi Melayu.':''}`);ikatNext()}
  else{b.classList.add('salah');salah(h.j);const o2=LJ[o];cakap(['frasa-cuba-lagi','frasa-titik-'+h.d]);toast('Itu '+o2.n+'. Cari: '+titikKata(h).toLowerCase(),1);setTimeout(()=>b.classList.remove('salah'),400)}})}

/* ---------- Tahap 1: Papan surih (semak bentuk) ---------- */
const PANDU={'ا':'Tarik lurus dari atas ke bawah.','ب':'Mula di kanan, lengkung ke kiri. Letak 1 titik di bawah.','ت':'Mula di kanan, lengkung ke kiri. Letak 2 titik di atas.',
 'ج':'Kepala dari kiri ke kanan, kemudian perut besar ke bawah. 1 titik di dalam.','چ':'Kepala dari kiri ke kanan, kemudian perut ke bawah. 3 titik di dalam.',
 'د':'Turun sedikit, kemudian ke kiri.','ر':'Turun melengkung ke kiri bawah.','س':'Tiga gigi kecil dari kanan ke kiri, kemudian mangkuk.',
 'ڤ':'Bulatan kecil, kemudian badan ke kiri. 3 titik di atas.','ک':'Batang turun, kemudian melintang ke kiri. Tambah garis kecil di atas.',
 'ݢ':'Seperti Kaf, kemudian 1 titik di atas.','م':'Bulatan kecil, kemudian ekor turun ke bawah.'};
function mSurih(){const {p,i,list}=cur;const ch=list[i],h=LJ[ch];
 app.innerHTML=atas()+`<div class="surih"><div class="ar"><div class="rule"><div style="font-weight:800;color:#92400e">Tulis dari kanan ke kiri</div><div style="font-size:24px;font-weight:800">Huruf ${h.n} <span class="jw" style="font-size:34px;color:#047857">${ch}</span> <button class="say sm" type="button" id="bsay" aria-label="Dengar">🔊</button></div><div>🧭 ${PANDU[ch]||'Ikut bentuk bayang huruf.'}</div></div></div>
  <div class="ak"><div class="row" style="justify-content:flex-start;margin:0 0 10px"><button class="btn2" type="button" id="bpd">🧹 Padam</button><button class="next" type="button" id="bck">✅ Siap!</button></div><div id="fb"></div>
  <div class="pick">${list.map((c,k)=>`<button type="button" data-k="${k}" class="jw${k===i?' on':''}${S.done[ik(p,c)]?' siap':''}">${c}</button>`).join('')}</div></div>
  <div class="cv" id="cvw"><canvas id="cv"></canvas><span class="arah">← kanan ke kiri</span></div></div>`;
 ikatAtas();$('bsay').onclick=()=>cakap(h.k);cakap(['frasa-warnakan',h.k]);
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sKlik();cur.i=+b.dataset.k;lukis()});
 papanSurih(ch,h)}
function papanSurih(ch,h){const cv=$('cv'),g=cv.getContext('2d');let W0=0,H0=0,dpr=1,mask=null,dil=null,ink=null,inkG=null,drawing=false,last=null,titik=0,siap=false;
 const BR=()=>Math.max(14,Math.round(fs()*0.11));
 function fs(){return Math.min(H0*0.7,W0*0.58)}
 function glyph(c2,col,stroke){c2.fillStyle=col;c2.font='700 '+fs()+'px "Noto Naskh Arabic",serif';c2.textAlign='center';c2.textBaseline='middle';if(stroke){c2.strokeStyle=col;c2.lineWidth=stroke;c2.lineJoin='round';c2.strokeText(ch,W0/2,H0*0.52)}c2.fillText(ch,W0/2,H0*0.52)}
 function setup(){const r=cv.getBoundingClientRect();W0=Math.max(200,r.width);H0=Math.max(200,r.height);dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W0*dpr;cv.height=H0*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const mk=()=>{const c=document.createElement('canvas');c.width=W0;c.height=H0;return c};
  mask=mk();glyph(mask.getContext('2d'),'#000');dil=mk();glyph(dil.getContext('2d'),'#000',BR()*1.6);ink=mk();inkG=ink.getContext('2d');titik=0;siap=false;bg()}
 function bg(){g.clearRect(0,0,W0,H0);g.strokeStyle='#e2e8f0';g.lineWidth=2;g.setLineDash([8,8]);g.beginPath();g.moveTo(16,H0*0.7);g.lineTo(W0-16,H0*0.7);g.stroke();g.setLineDash([]);glyph(g,'rgba(16,185,129,.18)');g.drawImage(ink,0,0,W0,H0)}
 const pos=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W0/r.width,y:(e.clientY-r.top)*H0/r.height}};
 function garis(a,b){[g,inkG].forEach((c2,k)=>{c2.strokeStyle=k?'#000':'#0f766e';c2.lineWidth=k?BR():Math.max(10,BR()*0.75);c2.lineCap='round';c2.lineJoin='round';c2.beginPath();c2.moveTo(a.x,a.y);c2.lineTo(b.x,b.y);c2.stroke()})}
 cv.onpointerdown=e=>{e.preventDefault();ac();if(siap)return;drawing=true;last=pos(e);garis(last,{x:last.x+.1,y:last.y});try{cv.setPointerCapture(e.pointerId)}catch(_){}};
 cv.onpointermove=e=>{if(!drawing)return;const p2=pos(e);garis(last,p2);last=p2;titik++};
 cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
 $('bpd').onclick=()=>{sKlik();if(siap)return;inkG.clearRect(0,0,W0,H0);titik=0;bg()};
 // Semak: berapa banyak bentuk huruf diwarnai, dan berapa banyak conteng di luar huruf
 function nilai(){const st=4,m=mask.getContext('2d').getImageData(0,0,W0|0,H0|0).data,d=dil.getContext('2d').getImageData(0,0,W0|0,H0|0).data,k=inkG.getImageData(0,0,W0|0,H0|0).data,w=W0|0;
  let mN=0,mH=0,kN=0,kL=0;for(let y=0;y<(H0|0);y+=st)for(let x=0;x<w;x+=st){const o=(y*w+x)*4+3;if(m[o]>128){mN++;if(k[o]>0)mH++}if(k[o]>0){kN++;if(d[o]<20)kL++}}
  return {lit:mN?mH/mN:0,luar:kN?kL/kN:1,kN}}
 $('bck').onclick=()=>{if(siap)return;const v=nilai();
  if(v.kN<8||titik<6){sSalah();cakap('frasa-warnakan');toast('Surih huruf ikut bayang hijau dahulu ya!',1);return}
  if(v.lit<0.5){salah(ch);cakap('frasa-sampai-hujung');toast('Hampir! Warnakan sampai ke hujung'+(h.d?', dan jangan lupa titik':'')+'.',1);return}
  if(v.luar>0.4){salah(ch);cakap('frasa-ikut-bentuk');toast('Ikut bentuk huruf ya. Tekan Padam dan cuba lagi.',1);return}
  siap=true;$('fb').innerHTML=betul(ch,`Kemas! Huruf <b>${h.n}</b> siap disurih.`);cakap([puji(),h.k]);
  const bn=$('bn');bn.onclick=()=>{sKlik();if(cur.i<cur.list.length-1){cur.i++;lukis()}else tamat()}};
 requestAnimationFrame(setup);let rT=0;window.onresize=()=>{clearTimeout(rT);rT=setTimeout(()=>{if($('cv')===cv)setup()},200)}}

/* ---------- Tahap 2: Bina perkataan ---------- */
function sukuKata(w){const v='aeiou',out=[];let s='';for(let k=0;k<w.length;k++){s+=w[k];if(v.includes(w[k])&&!v.includes(w[k+1]||'')){out.push(s);s=''}}if(s)out[out.length-1]+=s;return out}
function mBina(){const {p,i,list}=cur;const w=list[i],[jw,em]=KATA[w];const hs=Array.from(jw);
 const pg=[];hs.forEach(c=>{const m=MIRIP[c];if(m&&!hs.includes(m)&&!pg.includes(m))pg.push(m)});
 const pool=kocok(hs.map((c,k)=>({id:k,c})).concat(kocok(pg).slice(0,2).map((c,k)=>({id:100+k,c}))));
 const sk=sukuKata(w);let pilih=[],siap=false;
 function draw(){const pv=pilih.map(x=>x.c).join('');
  app.innerHTML=atas()+`<div class="soal"><div class="prompt"><div class="em">${em}</div><div class="rm">${w.toUpperCase()}</div>
   <div class="suku">${sk.map(s=>`<button type="button" data-s="${s}">${ADA.has('suku-'+s)?'🔊 ':''}${s}</button>`).join('<span>+</span>')}</div>${W(w)?`<br><button class="say" type="button" id="bsay" aria-label="Dengar">🔊</button>`:''}</div>
   <div><div class="slot">${pv?`<span class="jw">${pv}</span><div class="huruf">${pilih.map(x=>`<span class="jw">${x.c}</span>`).join('')}</div>`:'<span class="kosong">Sentuh huruf ikut bunyi. Mula dari kanan →</span>'}</div>
   <div class="tiles">${pool.map(x=>`<button type="button" class="tile${pilih.includes(x)?' used':''}" data-id="${x.id}"><span class="jw">${x.c}</span></button>`).join('')}</div>
   <div class="row"><button class="btn2" type="button" id="bun">↩️ Undur</button><button class="btn2" type="button" id="bkos">🧹 Kosongkan</button></div><div id="fb"></div></div></div>`;
  ikatAtas();if($('bsay'))$('bsay').onclick=()=>cakap(W(w));
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>cakap('suku-'+b.dataset.s));
  $('bun').onclick=()=>{if(siap)return;sKlik();pilih.pop();draw()};$('bkos').onclick=()=>{if(siap)return;sKlik();pilih=[];draw()};
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{if(siap)return;sKlik();pilih.push(pool.find(x=>x.id===+b.dataset.id));
   if(pilih.length===hs.length){const ok=pilih.map(x=>x.c).join('')===jw;
    if(ok){siap=true;draw();cakap([puji(),W(w)]);$('fb').innerHTML=betul(w,`Betul! <b>${w}</b> = <span class="jw" style="font-size:30px">${jw}</span>`);ikatNext()}
    else{salah(w);cakap('frasa-cuba-lagi');toast('Hampir! Dengar suku kata dan cuba lagi.',1);pilih=[];setTimeout(draw,500);draw()}}
   else draw()})}
 draw();cakap(W(w)||sk.map(s=>'suku-'+s))}

/* ---------- Tahap 3: Makmal sambung ---------- */
function mSambung(){const {p,i,list}=cur;const w=list[i],[jw,em]=KATA[w];const hs=Array.from(jw);const n=hs.length-1;let j=new Array(n).fill(false),siap=false,salahG=-1;
 const harus=k=>!tidakSambung(hs[k]);
 function pv(){let s='';hs.forEach((c,k)=>{s+=c;if(k<n&&!j[k])s+='‌'});return s}
 function draw(){
  app.innerHTML=atas()+`<div class="rule">Sentuh bulatan antara huruf: <b>🔗 sambung</b> atau <b>✂️ putus</b>. Huruf <span style="color:#be123c;font-weight:800">merah</span> ialah huruf sombong: selepasnya mesti putus.</div>
  <div class="card" style="text-align:center"><div style="font-size:44px">${em}</div><div class="rm" style="font-size:26px;font-weight:800">${w.toUpperCase()} ${W(w)?'<button class="say sm" type="button" id="bsay">🔊</button>':''}</div>
   <div class="lab">${hs.map((c,k)=>`<div class="h${tidakSambung(c)?' sb':''}"><span class="jw">${c}</span></div>${k<n?`<button type="button" class="g${j[k]?' on':''}${salahG===k?' bad':''}" data-g="${k}" aria-label="Sambung atau putus">${j[k]?'🔗':'✂️'}</button>`:''}`).join('')}</div>
   <div class="pv"><span class="jw">${pv()}</span></div>
   <div class="row"><button class="next" type="button" id="bsm">✅ Semak</button></div><div id="fb"></div></div>`;
  ikatAtas();if($('bsay'))$('bsay').onclick=()=>cakap(W(w));
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(siap)return;sKlik();salahG=-1;j[+b.dataset.g]=!j[+b.dataset.g];draw()});
  $('bsm').onclick=()=>{if(siap)return;let bad=-1;for(let k=0;k<n;k++)if(j[k]!==harus(k)){bad=k;break}
   if(bad<0){siap=true;const sb=[...new Set(hs.slice(0,n).filter(tidakSambung))];
    $('fb').innerHTML=betul(w,sb.length?`Betul! Huruf sombong di sini: <span class="jw" style="font-size:28px">${sb.join(' ')}</span>. Selepasnya putus.`:'Betul! Tiada huruf sombong di tengah, jadi semua huruf bersambung.');cakap([puji(),W(w)]);ikatNext();
    $('bsm').classList.add('hide')}
   else{salah(w);salahG=bad;const c=hs[bad];cakap('frasa-cuba-lagi');toast(tidakSambung(c)?`${LJ[c].n} (${c}) huruf sombong, selepasnya mesti putus ✂️`:`${LJ[c].n} (${c}) boleh sambung ke kiri 🔗`,1);draw()}}}
 draw();cakap(W(w))}

 <div><div class="opts">${opts.map(x=>`<button class="opt word" type="button" data-o="${esc(x)}"><span class="jw">${x}</span></button>`).join('')}</div><div id="fb"></div></div></div>`;

 <div class="box" style="border-color:#fde68a;background:#fffbeb"><b>4. Hukum Ejaan (8–10 tahun)</b><p>Satu hukum pada satu masa: suku kata tertutup, Darlung (<span class="jw">د ر ل ڠ</span>), Luar Darlung, KA-GA, e taling/pepet, dan kata istimewa (<span class="jw">ليم، کيت، اڤ، ڤد</span>).</p></div>
 <div class="box" style="border-color:#ddd6fe;background:#f5f3ff"><b>5. Mahir & Ayat (10–12 tahun)</b><p>Kata pinjaman (<span class="jw">صلاة، مسجد</span>), awalan dan kata sendi, serta susun ayat dari kanan ke kiri. Seterusnya: <b>Nakhoda Jawi</b>.</p></div>
 <p style="font-size:15px;color:#64748b">Ejaan dalam game ini disemak dengan PRPM DBP. Huruf <span class="jw">ک</span> (kaf) dan <span class="jw">ݢ</span> (ga) sama seperti Kenal Jawi dan Nakhoda Jawi.</p>
 <label class="sw"><input type="checkbox" id="cbBuka" ${S.bukaSemua?'checked':''}> Buka semua tahap (untuk anak yang lebih besar)</label>
 <div class="row" style="justify-content:flex-start">${R?'<button class="next" type="button" id="bRuang">👪 Ruang Ibu Bapa</button>':''}<button class="btn2" type="button" id="bReset" style="color:#be123c">↺ Set semula bintang</button></div>`;
 $('cbBuka').onchange=e=>{S.bukaSemua=e.target.checked;simpan();if(!cur)rumah()};
 if($('bRuang'))$('bRuang').onclick=()=>{tutup('mNota');henti();R.buka(()=>{cur?lukis():rumah()})};
 let tekan=0;$('bReset').onclick=()=>{if(++tekan<2){toast('Tekan sekali lagi untuk padam semua bintang',1);return}S.done={};simpan();tutup('mNota');rumah();toast('Bintang telah diset semula')}}
$('bNota').onclick=()=>{sKlik();nota();buka('mNota')};
const bm=$('bMute');const kemasMute=()=>{bm.textContent=S.mute?'🔇':'🔊'};kemasMute();
bm.onclick=()=>{S.mute=!S.mute;simpan();kemasMute();if(S.mute)henti();else sKlik()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)henti()});
rumah();
// Ujian automatik: senarai semua perkataan Jawi dalam game
window.KJC_DATA={L,TAHAP,KATA,ADA};
})();
