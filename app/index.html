<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dunia Sai · Pilih aplikasi</title>
  <meta name="theme-color" content="#1f5fa6">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/shared/icons/favicon.png">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/css/theme.css">
  <style>
    .atas {
      background: var(--biru); color: #fff;
      padding: max(16px, env(safe-area-inset-top)) 0 56px;
    }
    .atas .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .atas .jenama { font-weight: 700; font-size: var(--t-md); flex: 1; color: #fff; text-decoration: none; }
    .sapaan { margin-top: 18px; }
    .sapaan h1 { font-size: var(--t-xl); margin: 0; color: #fff; }
    .sapaan button {
      font: inherit; color: #fff; background: none; border: 0; padding: 0;
      text-decoration: underline; text-underline-offset: 4px; cursor: pointer;
    }

    .modul-grid {
      display: grid; gap: 18px; margin-top: -36px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    }
    .modul {
      --c: var(--biru);
      position: relative; display: grid; grid-template-rows: auto 1fr;
      color: var(--dakwat); background: var(--kertas); text-decoration: none;
      border-radius: var(--r-card); overflow: hidden;
      box-shadow: 0 6px 0 0 color-mix(in srgb, var(--c) 55%, var(--garis));
      transition: transform 80ms ease, box-shadow 80ms ease;
    }
    .modul:active { transform: translateY(4px); box-shadow: 0 2px 0 0 color-mix(in srgb, var(--c) 55%, var(--garis)); }
    .modul .kepala {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 16px 16px 0; background: var(--c); min-height: 104px;
    }
    .modul .glif {
      display: grid; place-items: center; min-width: 84px; height: 84px; margin-bottom: -26px; padding: 0 10px;
      font: 700 2.6rem/1 var(--font); color: var(--dakwat);
      background: var(--kertas); border-radius: var(--r-tile);
      box-shadow: inset 0 0 0 3px var(--garis), 0 5px 0 0 var(--garis);
    }
    .modul .glif.jawi { font-family: var(--font-jawi); font-size: 3rem; color: var(--hijau); }
    .modul .status {
      align-self: flex-start; padding: 4px 12px; border-radius: var(--r-pill);
      font-size: var(--t-sm); font-weight: 700; color: var(--dakwat); background: rgb(255 255 255 / 0.85);
    }
    .modul .badan { padding: 36px 16px 18px; display: grid; gap: 6px; align-content: start; }
    .modul h2 { font-size: var(--t-md); margin: 0; }
    .modul p { margin: 0; color: var(--dakwat-lembut); font-size: var(--t-base); }
    .modul .peringkat { font-size: var(--t-sm); }
    .modul .kemajuan { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: var(--t-sm); font-weight: 700; }
    .modul .meter { flex: 1; --accent: var(--c); }

    .bahagian { margin-top: 40px; }
    .bahagian h2 { font-size: var(--t-lg); }
    .kotak { background: var(--kertas); border-radius: var(--r-card); padding: 20px; }
    .lesen-senarai { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
    .lesen-senarai li {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; border-radius: var(--r-tile); background: var(--hijau-muda);
    }
    .lesen-senarai code { font-size: var(--t-sm); }
    .tetapan { display: grid; gap: 14px; }
    .suis { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; }
    .suis input { width: 52px; height: 30px; accent-color: var(--hijau); }
    .baris-butang { display: flex; gap: 10px; flex-wrap: wrap; }
    footer { padding: 40px 0 calc(40px + env(safe-area-inset-bottom)); color: var(--dakwat-lembut); font-size: var(--t-sm); }
  </style>
</head>
<body>
  <header class="atas">
    <div class="wrap">
      <a class="jenama" href="/">Dunia Sai</a>
      <span class="bintang-kiraan" aria-label="Jumlah bintang">⭐ <span data-bintang>0</span></span>
      <button class="btn btn-kuning btn-kecil" data-pasang hidden>Pasang aplikasi</button>
    </div>
    <div class="wrap sapaan">
      <h1 id="sapaan">Hai! Jom belajar.</h1>
    </div>
  </header>

  <main class="wrap">
    <div class="modul-grid" id="modul-grid"></div>

    <section class="bahagian" aria-labelledby="t-lesen">
      <h2 id="t-lesen">Lesen</h2>
      <div class="kotak">
        <ul class="lesen-senarai" id="lesen-senarai"></ul>
        <div class="baris-butang">
          <button class="btn btn-hijau" id="tambah-lesen">Masukkan kod lesen</button>
          <a class="btn btn-garis" href="/#pakej">Lihat pakej</a>
        </div>
      </div>
    </section>

    <section class="bahagian" aria-labelledby="t-tetapan">
      <h2 id="t-tetapan">Tetapan</h2>
      <div class="kotak tetapan">
        <label class="suis">Nama anak <input class="medan" id="nama" maxlength="20" autocomplete="off" style="width:min(60%,260px);height:48px;font-size:var(--t-base)"></label>
        <label class="suis">Bunyi <input type="checkbox" id="bunyi"></label>
        <label class="suis">Suara sebutan <input type="checkbox" id="suara"></label>
        <div class="baris-butang">
          <button class="btn btn-garis btn-kecil" id="eksport">Simpan sandaran</button>
          <label class="btn btn-garis btn-kecil" for="import-fail">Pulihkan sandaran</label>
          <input type="file" id="import-fail" accept="application/json,.json" hidden>
          <button class="btn btn-garis btn-kecil" id="reset" style="color:var(--merah)">Padam kemajuan</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="wrap">
    Semua aplikasi boleh dimain tanpa internet selepas dibuka kali pertama. Kemajuan disimpan dalam peranti ini sahaja.
  </footer>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/storage.js"></script>
  <script src="/shared/js/ui.js"></script>
  <script>
  (() => {
    const { esc, sound, toast, licenceDialog, installApp, registerSW, refreshStarCount } = EduUI;
    const C = window.EDU_CONFIG;
    const grid = document.getElementById('modul-grid');

    function renderModul() {
      grid.innerHTML = C.MODULES.map((m) => {
        const open = EduStore.hasAccess(m.id);
        const pct = Math.round(EduStore.completion(m.id, m.activities) * 100);
        const stars = EduStore.totalStars(m.id);
        return `<a class="modul" href="${m.path}" style="--c:var(${m.color})">
          <div class="kepala">
            <span class="glif ${m.glyphClass === 'jawi' ? 'jawi' : ''}" ${m.glyphClass === 'jawi' ? 'lang="ms-Arab"' : ''} aria-hidden="true">${
              m.glyphClass === 'kv' ? EduUI.colourWord(m.glyph) : esc(m.glyph)}</span>
            <span class="status">${open ? 'Penuh' : 'Percubaan'}</span>
          </div>
          <div class="badan">
            <h2>${esc(m.name)}</h2>
            <p>${esc(m.tagline)}</p>
            <p class="peringkat">${esc(m.level)}</p>
            <div class="kemajuan">
              <div class="meter" style="--isi:${pct}%" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Kemajuan ${esc(m.name)}"><span></span></div>
              <span>⭐ ${stars}</span>
            </div>
          </div>
        </a>`;
      }).join('');
    }

    function renderLesen() {
      const list = EduStore.licences();
      const el = document.getElementById('lesen-senarai');
      el.innerHTML = list.length
        ? list.map((l) => {
            const p = EduStore.packageInfo(l.pkg);
            return `<li><span><strong>${esc(p ? p.name : l.pkg)}</strong><br><code>${esc(l.key)}</code></span>
              <button class="btn btn-garis btn-kecil" data-buang="${esc(l.key)}">Buang</button></li>`;
          }).join('')
        : '<li style="background:var(--kapur)">Belum ada lesen. Anda sedang menggunakan versi percubaan.</li>';
    }
    document.getElementById('lesen-senarai').addEventListener('click', (e) => {
      const b = e.target.closest('[data-buang]');
      if (b && confirm('Buang lesen ini daripada peranti ini?')) {
        EduStore.removeLicence(b.dataset.buang);
        refresh();
      }
    });

    function renderSapaan() {
      const nama = EduStore.profile().name.trim();
      document.getElementById('sapaan').textContent = nama ? `Hai ${nama}! Jom belajar.` : 'Hai! Jom belajar.';
    }

    function refresh() { renderModul(); renderLesen(); renderSapaan(); refreshStarCount(); }

    // Settings
    const nama = document.getElementById('nama');
    const bunyi = document.getElementById('bunyi');
    const suara = document.getElementById('suara');
    nama.value = EduStore.profile().name;
    bunyi.checked = EduStore.settings().sound;
    suara.checked = EduStore.settings().speech;
    nama.addEventListener('input', () => { EduStore.setProfile({ name: nama.value }); renderSapaan(); });
    bunyi.addEventListener('change', () => { EduStore.setSettings({ sound: bunyi.checked }); sound('click'); });
    suara.addEventListener('change', () => EduStore.setSettings({ speech: suara.checked }));

    document.getElementById('tambah-lesen').onclick = () => licenceDialog(null, refresh);

    document.getElementById('eksport').onclick = () => {
      const blob = new Blob([EduStore.exportAll()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `duniasai-sandaran-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Sandaran disimpan');
    };
    document.getElementById('import-fail').onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        EduStore.importAll(await f.text());
        toast('Sandaran dipulihkan');
        location.reload();
      } catch (err) {
        toast('Fail ini bukan sandaran Dunia Sai');
      }
    };
    document.getElementById('reset').onclick = () => {
      if (confirm('Padam semua bintang dan kemajuan? Lesen tidak akan dipadam.')) {
        EduStore.resetProgress();
        refresh();
        toast('Kemajuan dipadam');
      }
    };

    document.querySelectorAll('[data-pasang]').forEach((b) => b.onclick = () => {
      if (!installApp()) toast('Gunakan menu pelayar, kemudian pilih "Tambah ke Skrin Utama"', 3500);
    });

    // ?lesen=SAI-... from a WhatsApp link activates directly
    const q = new URLSearchParams(location.search).get('lesen');
    if (q) {
      const r = EduStore.activate(q);
      toast(r.ok ? `${r.package.name} diaktifkan` : r.error, 3500);
      history.replaceState(null, '', location.pathname);
    }

    window.addEventListener('pageshow', refresh);
    refresh();
    registerSW();
  })();
  </script>
</body>
</html>
