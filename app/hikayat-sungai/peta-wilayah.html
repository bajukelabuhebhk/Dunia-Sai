<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peta Wilayah · Hikayat Sungai Ilmu</title>
<link rel="stylesheet" href="enjin/enjin.css">
<style>
.pw { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pw-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(255,255,255,.94); border: 3px solid rgba(35,118,102,.17); box-shadow: 0 7px 0 rgba(19,99,81,.12); border-radius: 22px; padding: 10px 14px; }
.pw-head h1 { font: 400 clamp(1.3rem, 3vw, 1.8rem)/1 var(--display); color: #195b52; margin: 0 auto 0 0; display: flex; align-items: center; gap: 8px; }
.pw-head h1 small { display: block; font: 900 .6rem var(--body); letter-spacing: 2px; color: #639087; }
.pw-gems { display: flex; gap: 4px; align-items: center; font: 900 .85rem var(--body); color: #3c4f9a; background: #eef3ff; border: 2px solid #c8d4ff; border-radius: 13px; padding: 6px 10px; }
.pw-gems i { font-style: normal; font-size: 1.05rem; filter: grayscale(1) opacity(.35); }
.pw-gems i.on { filter: none; }
.pw-map { position: relative; width: 100%; max-width: min(100%, calc((100svh - 250px) * 4 / 3)); min-width: min(100%, 520px); margin: 0 auto; border: 6px solid #fff; outline: 3px solid #317e68; border-radius: 26px; overflow: hidden; box-shadow: 0 11px 0 #77b8a1, 0 17px 36px rgba(34,96,81,.25); background: #8fd3e8; }
.pw-map svg { display: block; width: 100%; height: auto; }
.node { cursor: pointer; }
.node .ring { transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.node:hover .ring, .node.sel .ring { transform: scale(1.15); }
.node text { font-family: var(--body); font-weight: 900; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.node.lock { opacity: .9; }
.route { fill: none; stroke-linecap: round; }
.me-marker { animation: hero-bob 1.6s ease-in-out infinite; transform-box: fill-box; }
.pw-card { background: #fffdf6; color: var(--ink); border: 3px solid #fedc95; border-radius: 20px; padding: 14px 16px; box-shadow: 0 6px 0 #f5ce7d; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.pw-card .em { font-size: 2.6rem; line-height: 1; }
.pw-card .tx { flex: 1; min-width: 200px; }
.pw-card h2 { margin: 0; font: 400 1.35rem var(--display); color: #24536a; }
.pw-card p { margin: 4px 0 0; font-weight: 800; line-height: 1.4; color: #3d6670; }
.pw-tag { display: inline-block; font: 900 .7rem var(--body); padding: 3px 9px; border-radius: 999px; background: #e5f4e8; color: #2a7a3d; margin-right: 4px; }
.pw-tag.lock { background: #f1f1f1; color: #777; } .pw-tag.done { background: #fff1b8; color: #8a6418; }
.pw-uji { background: #fff4e5; border: 2px dashed #f0a24a; border-radius: 16px; padding: 10px 14px; font-weight: 800; color: #8a4a12; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.pw-foot { text-align: center; font-weight: 800; color: #3d6670; font-size: .82rem; }
@media (max-width: 560px) { .pw-head { padding: 8px 10px; } .pw-card .em { font-size: 2rem; } }
</style>
<link rel="manifest" href="/manifest.json"><script src="/shared/js/balik.js" defer></script>
</head>
<body>
<div class="pw">
  <div class="pw-head"><h1><span class="brand-emoji">🗺️</span><span><span id="tTitle">Peta Wilayah</span><small id="tSub">LEMBAH SUNGAI ILMU</small></span></h1>
    <div class="pw-gems" id="gems"></div>
    <button class="icon-btn" id="lang" type="button" style="font:800 .9rem var(--body);background:#f1fbf7;border:2px solid #d2ebe2;border-radius:13px;padding:8px 10px;color:#27605b">EN</button></div>
  <div class="pw-map" id="mapBox"></div>
  <div class="pw-card" id="card"></div>
  <div class="pw-uji" id="uji" hidden></div>
  <p class="pw-foot" id="foot"></p>
</div>
<script src="enjin/lesen.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let lang = 'ms'; try { lang = sessionStorage.getItem('hs-lang') || 'ms'; } catch {}
  const L = (ms, en) => ({ ms, en }), tx = o => o[lang] ?? o.ms, ms = () => lang === 'ms';
  const UJI_HOST = /\.dunia-sai\.pages\.dev$/.test(location.hostname) || ['localhost', '127.0.0.1', ''].includes(location.hostname);
  try { if (UJI_HOST && /[?&]uji=1/.test(location.search)) sessionStorage.setItem('hs-uji', '1'); } catch {}
  const uji = () => { try { return UJI_HOST && sessionStorage.getItem('hs-uji') === '1'; } catch { return false; } };
  let st = {}; try { st = JSON.parse(localStorage.getItem('hikayat-sungai-3') || '{}') || {}; } catch {}
  const D = st.dunia || { visited: [], mutiara: [], f: {} }; D.f = D.f || {}; D.mutiara = D.mutiara || []; D.visited = D.visited || [];
  const F = st.f || {};
  let full = false;
  try { const s = localStorage.getItem('hikayat_licence'); if (s) { const b = KJL2.find(s); const r = b ? KJL2.verify(b, 4, { 2: 'QVgEegZrfviPeApvWbbbkzk3xI6ZKX0zKd2wEfy9pS0=' }, [], nacl) : KJL.verify(s, 4, { 2: 'QVgEegZrfviPeApvWbbbkzk3xI6ZKX0zKd2wEfy9pS0=' }, [], nacl); full = !!(r && r.ok); } } catch {}
  const mut = new Set(D.mutiara); if (F.buaya) mut.add(1);

  // Bandar dan laluan. siap() = sudah tamat, buka() = boleh dimasuki sekarang
  const P = {
    'bandar-1': { em: '🏡', x: 60, y: 248, nama: L('Kampung Tepi Sungai', 'Riverside Village'), tema: L('Terapung dan tenggelam', 'Float and sink'), ke: 'index.html#main', buka: () => true, siap: () => !!F.buaya, mutiara: 1 },
    'laluan-1': { em: '🧭', route: true, nama: L('Laluan Kompas', 'Compass Trail'), tema: L('Puzzle: maze kompas dalam kabus', 'Puzzle: compass maze in the fog'), ke: 'laluan-1.html', buka: () => (full && !!F.buaya) || uji(), siap: () => !!D.f['laluan-1:siap'] },
    'bandar-2': { em: '🧲', x: 160, y: 222, nama: L('Pekan Bukit Besi', 'Iron Hill Town'), tema: L('Magnet dan litar elektrik', 'Magnets and circuits'), ke: 'bandar-2.html', buka: () => (full && !!D.f['laluan-1:siap']) || uji(), siap: () => mut.has(2), mutiara: 2 },
    'laluan-2': { em: '🪨', route: true, nama: L('Gua Batu Tolak', 'Boulder Cave'), tema: L('Puzzle: tolak batu ke atas plat', 'Puzzle: push boulders onto plates') },
    'bandar-3': { em: '🌿', x: 252, y: 246, nama: L('Rimba Hijau', 'Green Forest'), tema: L('Tumbuhan dan haiwan', 'Plants and animals'), mutiara: 3 },
    'laluan-3': { em: '🛷', route: true, nama: L('Lembah Lumpur Licin', 'Slippery Mud Valley'), tema: L('Puzzle: lantai licin', 'Puzzle: slippery floor') },
    'bandar-4': { em: '🔦', x: 296, y: 160, nama: L('Pelabuhan Cahaya', 'Harbour of Light'), tema: L('Cahaya, bayang, cermin, kanta', 'Light, shadows, mirrors, lenses'), mutiara: 4 },
    'laluan-4': { em: '🪞', route: true, nama: L('Menara Cermin', 'Mirror Tower'), tema: L('Puzzle: pantul cahaya dengan cermin', 'Puzzle: bounce light with mirrors') },
    'bandar-5': { em: '☁️', x: 196, y: 102, nama: L('Desa Awan', 'Cloud Village'), tema: L('Cuaca dan kitaran air', 'Weather and the water cycle'), mutiara: 5 },
    'laluan-5': { em: '🌉', route: true, nama: L('Titian Awan', 'Cloud Bridge'), tema: L('Puzzle: sambung paip dan wayar', 'Puzzle: connect pipes and wires') },
    'bandar-6': { em: '⛰️', x: 342, y: 52, nama: L('Puncak Mata Air', 'Spring Peak'), tema: L('Bumi dan angkasa, bos akhir', 'Earth and space, final boss'), mutiara: 6 },
  };
  const ORDER = ['bandar-1', 'laluan-1', 'bandar-2', 'laluan-2', 'bandar-3', 'laluan-3', 'bandar-4', 'laluan-4', 'bandar-5', 'laluan-5', 'bandar-6'];
  // titik kawalan lengkung setiap laluan (antara dua bandar)
  const CURVE = { 'laluan-1': [110, 262], 'laluan-2': [205, 262], 'laluan-3': [300, 220], 'laluan-4': [262, 104], 'laluan-5': [270, 40] };
  const ends = id => { const i = ORDER.indexOf(id); return [P[ORDER[i - 1]], P[ORDER[i + 1]]]; };
  const at = D.at && P[D.at] ? D.at : 'bandar-1';
  let sel = at;

  function svg() {
    const routes = ORDER.filter(id => P[id].route).map(id => {
      const [a, b] = ends(id), [cx, cy] = CURVE[id], p = P[id], open = p.buka && p.buka(), done = p.siap && p.siap();
      const d = `M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`;
      const mx = .25 * a.x + .5 * cx + .25 * b.x, my = .25 * a.y + .5 * cy + .25 * b.y;
      return `<g class="node${sel === id ? ' sel' : ''}${open ? '' : ' lock'}" data-id="${id}">
        <path class="route" d="${d}" stroke="#5a3a1e" stroke-width="9" opacity=".35"/>
        <path class="route" d="${d}" stroke="${done ? '#ffd76f' : open ? '#fff6d8' : '#d9d2c0'}" stroke-width="5" stroke-dasharray="${open ? '0' : '2 8'}"/>
        <path class="route" d="${d}" stroke="transparent" stroke-width="22"/>
        <g class="ring"><circle cx="${mx}" cy="${my}" r="12" fill="${open ? '#fffdf4' : '#ece8de'}" stroke="#5a3a1e" stroke-width="2.5"/>
        <text x="${mx}" y="${my + 5}" text-anchor="middle" font-size="13">${open ? p.em : '🔒'}</text></g></g>`;
    }).join('');
    const cities = ORDER.filter(id => !P[id].route).map(id => {
      const p = P[id], open = p.buka && p.buka(), done = p.siap && p.siap();
      return `<g class="node${sel === id ? ' sel' : ''}${open ? '' : ' lock'}" data-id="${id}">
        <g class="ring"><circle cx="${p.x}" cy="${p.y}" r="19" fill="${open ? (done ? '#fff1b8' : '#ffffff') : '#e7e2d6'}" stroke="${done ? '#d9a24a' : '#2f6b5a'}" stroke-width="3.5"/>
        <text x="${p.x}" y="${p.y + 7}" text-anchor="middle" font-size="20">${open ? p.em : '🔒'}</text></g>
        <text x="${p.x}" y="${p.y + 34}" text-anchor="middle" font-size="10.5" fill="${open ? '#1f4f45' : '#7a7a7a'}">${esc(tx(p.nama))}</text>
        ${done && p.mutiara ? `<text x="${p.x + 17}" y="${p.y - 12}" font-size="11">💎</text>` : ''}</g>`;
    }).join('');
    const me = P[at].route ? (() => { const [a, b] = ends(at), [cx, cy] = CURVE[at]; return { x: .25 * a.x + .5 * cx + .25 * b.x, y: .25 * a.y + .5 * cy + .25 * b.y - 16 }; })() : { x: P[at].x, y: P[at].y - 30 };
    return `<svg viewBox="0 0 400 300" role="img" aria-label="${esc(ms() ? 'Peta Lembah Sungai Ilmu' : 'Map of the River of Knowledge valley')}">
      <defs><linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9a5"/><stop offset="1" stop-color="#8fcf74"/></linearGradient>
        <pattern id="waves" width="16" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 Q4 0 8 4 T16 4" stroke="#bfeaf6" stroke-width="1.2" fill="none"/></pattern></defs>
      <rect width="400" height="300" fill="#7cc8e2"/><rect width="400" height="300" fill="url(#waves)" opacity=".7"/>
      <path d="M0,0 H355 Q338,70 352,120 Q372,150 330,182 Q312,210 340,250 Q356,282 330,300 H0 Z" fill="#e9d8a6"/>
      <path d="M0,0 H346 Q330,70 343,120 Q362,150 322,180 Q302,210 330,250 Q345,282 320,300 H0 Z" fill="url(#land)"/>
      <path d="M270,0 L300,38 L322,10 L352,62 L380,30 L400,60 L400,0 Z" fill="#b8c2b0"/><path d="M296,34 l26,-24 l14,22 Z M352,62 l20,-28 l10,16 Z" fill="#fff" opacity=".85"/>
      <path d="M330,52 C300,80 260,70 236,100 C210,130 170,120 140,150 C110,180 150,205 170,232 C185,250 110,250 70,268 C40,282 20,290 0,296" fill="none" stroke="#3aa6d6" stroke-width="7" stroke-linecap="round"/>
      <path d="M330,52 C300,80 260,70 236,100 C210,130 170,120 140,150 C110,180 150,205 170,232 C185,250 110,250 70,268 C40,282 20,290 0,296" fill="none" stroke="#9fe0f6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 9"/>
      ${[[40, 60], [70, 40], [30, 110], [60, 160], [110, 180], [215, 292], [150, 60], [100, 100], [230, 160], [20, 210], [140, 290]].map(([x, y]) => `<g opacity=".9"><circle cx="${x}" cy="${y}" r="9" fill="#3f9a5a"/><circle cx="${x - 6}" cy="${y + 4}" r="6.5" fill="#3f9a5a"/><circle cx="${x + 6}" cy="${y + 4}" r="6.5" fill="#3f9a5a"/><circle cx="${x - 2}" cy="${y - 3}" r="3.5" fill="#6cc27f"/></g>`).join('')}
      <g opacity=".85"><ellipse cx="230" cy="40" rx="22" ry="8" fill="#fff"/><ellipse cx="244" cy="34" rx="14" ry="8" fill="#fff"/><ellipse cx="120" cy="24" rx="18" ry="6" fill="#fff"/></g>
      <text x="372" y="240" font-size="18" opacity=".8">⛵</text>
      ${routes}${cities}
      <g class="me-marker"><circle cx="${me.x}" cy="${me.y - 2}" r="11" fill="#ffd76f" stroke="#a86520" stroke-width="2"/><text x="${me.x}" y="${me.y + 3}" text-anchor="middle" font-size="13">${st.av && st.av.g === 'g' ? '🧕' : '👦'}</text></g>
    </svg>`;
  }
  function card() {
    const p = P[sel], open = p.buka && p.buka(), done = p.siap && p.siap(), soon = !p.ke;
    const tag = soon ? `<span class="pw-tag lock">🔒 ${esc(ms() ? 'Akan datang' : 'Coming soon')}</span>` : done ? `<span class="pw-tag done">✔ ${esc(ms() ? 'Selesai' : 'Done')}</span>` : open ? `<span class="pw-tag">${esc(ms() ? 'Boleh dilawati' : 'Open')}</span>` : `<span class="pw-tag lock">🔒 ${esc(ms() ? 'Belum dibuka' : 'Locked')}</span>`;
    let why = '';
    if (!open && !soon) why = !full && sel !== 'bandar-1' ? (ms() ? 'Bahagian ini dibuka dengan lesen versi penuh.' : 'This part opens with the full version licence.')
      : sel === 'laluan-1' ? (ms() ? 'Kalahkan Sang Buaya di Kampung Tepi Sungai dahulu.' : 'Beat Sang Buaya in the riverside village first.')
      : (ms() ? 'Lalui Laluan Kompas dahulu.' : 'Cross the Compass Trail first.');
    if (soon) why = ms() ? 'Bahagian ini sedang dibina dan akan dibuka dalam kemas kini akan datang.' : 'This part is being built and opens in a future update.';
    $('card').innerHTML = `<span class="em">${p.em}</span><div class="tx"><h2>${esc(tx(p.nama))}</h2><p>${tag}${esc(tx(p.tema))}</p>${why ? `<p>${esc(why)}</p>` : ''}</div>
      ${open && p.ke ? `<button class="btn" id="goBtn" type="button">${esc(sel === at ? (ms() ? '▶ Sambung di sini' : '▶ Continue here') : (ms() ? '▶ Pergi' : '▶ Go'))}</button>` : ''}`;
    const g = $('goBtn'); if (g) g.onclick = () => { try { const s = JSON.parse(localStorage.getItem('hikayat-sungai-3') || '{}'); s.dunia = Object.assign(s.dunia || {}, { from: 'peta' }); localStorage.setItem('hikayat-sungai-3', JSON.stringify(s)); } catch {} location.href = p.ke; };
  }
  function draw() {
    $('tTitle').textContent = ms() ? 'Peta Wilayah' : 'Region Map';
    $('tSub').textContent = ms() ? 'LEMBAH SUNGAI ILMU' : 'RIVER OF KNOWLEDGE VALLEY';
    $('lang').textContent = ms() ? 'EN' : 'BM';
    $('gems').innerHTML = `${[1, 2, 3, 4, 5, 6].map(n => `<i class="${mut.has(n) ? 'on' : ''}">💎</i>`).join('')} <span>${mut.size}/6</span>`;
    $('mapBox').innerHTML = svg();
    $('mapBox').querySelectorAll('.node').forEach(n => n.onclick = () => { sel = n.dataset.id; draw(); });
    card();
    $('foot').textContent = ms() ? 'Kumpul 6 Mutiara Sungai dan pulangkan ke Mata Air supaya Sungai Ilmu mengalir penuh semula.' : 'Collect 6 River Pearls and return them to the Spring so the River of Knowledge flows again.';
    if (UJI_HOST) {
      $('uji').hidden = false;
      $('uji').innerHTML = `🧪 <span style="flex:1;min-width:200px">${esc(ms() ? 'Mod uji (hanya pautan pratonton, tiada di laman live): buka semua peta tanpa lesen dan tanpa main dari awal.' : 'Test mode (preview links only, never on the live site): open every map without a licence or replaying.')}</span><button class="btn ${uji() ? '' : 'secondary'}" id="ujiBtn" type="button">${uji() ? (ms() ? 'HIDUP' : 'ON') : (ms() ? 'MATI' : 'OFF')}</button>`;
      $('ujiBtn').onclick = () => { try { uji() ? sessionStorage.removeItem('hs-uji') : sessionStorage.setItem('hs-uji', '1'); } catch {} draw(); };
    }
  }
  $('lang').onclick = () => { lang = ms() ? 'en' : 'ms'; try { sessionStorage.setItem('hs-lang', lang); } catch {} draw(); };
  draw();
})();
</script>
</body>
</html>
