<style>
/* Layout: a handheld-console RPG. HUD and quest line on top, a 4:3 world view with overlays (dialogue, lab, battle), then a D-pad and action button. Single jungle-dusk look on purpose. */
:root {
  --jungle: #0d2f24;
  --leaf: #2f8f5b;
  --river: #2aa7d6;
  --gold: #ffc94a;
  --panel: #fbfdf8;
  --ink: #17301f;
  --muted: #56705f;
  --red: #e5484d;
  --display: "Lilita One", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; color: #fff; font-family: var(--body); font-size: 16px; background: var(--jungle);
  background-image: radial-gradient(ellipse at 15% 0%, #1d6b4c 0, transparent 55%), radial-gradient(ellipse at 90% 100%, #145238 0, transparent 50%);
  padding-inline: 16px; padding-block: 10px 24px;
  -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 660px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hud .title { font-family: var(--display); font-size: 1.2rem; color: var(--gold); margin-right: auto; }
.chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 3px 10px; font-weight: 800; font-size: .88rem; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.xpbar { width: 56px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); transition: width .4s; }
.icon-btn { font: 800 .85rem var(--body); background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.quest { background: rgba(0,0,0,.35); border-left: 4px solid var(--gold); border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: .92rem; }
.quest b { color: var(--gold); font-family: var(--display); font-weight: 400; margin-right: 6px; }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 18px; overflow: hidden; border: 3px solid #000; box-shadow: 0 6px 0 #000; background: #2f6b3d; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.overlay { position: absolute; inset: 0; }
/* dialogue */
.dlg { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); color: var(--ink); border: 3px solid #000; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; box-shadow: 0 4px 0 #000; cursor: pointer; }
.dlg .face { font-size: 2.4rem; line-height: 1; }
.dlg .body { flex: 1; min-width: 0; }
.dlg b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
.dlg p { margin: 2px 0 0; font-size: 1rem; line-height: 1.45; min-height: 2.9em; }
.dlg .more { position: absolute; right: 12px; bottom: 6px; font-size: .8rem; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
/* cards inside overlays */
.card { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); color: var(--ink); border: 3px solid #000; border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 0 #000; display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 16px); overflow: auto; }
.card .q { font: 400 1.1rem/1.3 var(--display); margin: 0; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.opt { font: 800 .95rem/1.25 var(--body); text-align: left; background: #fff; color: var(--ink); border: 3px solid #000; border-radius: 10px; padding: 7px 8px; cursor: pointer; box-shadow: 0 3px 0 #000; display: flex; gap: 6px; align-items: center; min-width: 0; }
.opt .em { font-size: 1.3rem; }
.opt.right { background: #b9f0cd; }
.opt.wrong { background: #ffc9cb; }
.btn { font: 400 1.05rem var(--display); color: var(--ink); background: var(--gold); border: 3px solid #000; border-radius: 12px; padding: 7px 16px; cursor: pointer; box-shadow: 0 4px 0 #000; }
.btn.ghost { background: #fff; }
.btn:active, .opt:active, .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
button:focus-visible { outline: 3px solid var(--river); outline-offset: 2px; }
.why { background: #fff3c4; border-radius: 10px; padding: 7px 9px; line-height: 1.4; font-size: .95rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* lab */
.lab { background: rgba(5, 20, 15, .55); }
.below { background: var(--panel); color: var(--ink); border: 3px solid #000; border-radius: 14px; padding: 10px 12px; box-shadow: 0 4px 0 #000; display: flex; flex-direction: column; gap: 8px; }
.below .q { font: 400 1.1rem/1.3 var(--display); margin: 0; }
.lab canvas { position: absolute; left: 8px; right: 8px; top: 8px; width: calc(100% - 16px); height: calc(100% - 16px); border: 3px solid #000; border-radius: 12px; background: #f4fbff; }
/* battle */
.battle { background: var(--bbg, linear-gradient(#5a7f3c, #2c4a22)); overflow: hidden; }
.battle .ground { position: absolute; left: -10%; right: -10%; bottom: 34%; height: 18%; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.28), transparent 70%); }
.ftr { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ftr .sprite { font-size: clamp(3rem, 15vw, 5.6rem); line-height: 1; filter: drop-shadow(0 8px 0 rgba(0,0,0,.3)); }
.ftr .plat { width: clamp(80px, 24vw, 140px); height: 22px; margin-top: -16px; border-radius: 50%; border: 3px solid #000; background: radial-gradient(ellipse at 50% 35%, var(--pt, #9ad66f), var(--pb, #3f7a2c) 75%); box-shadow: 0 6px 0 rgba(0,0,0,.35); position: relative; z-index: 0; }
.ftr .sprite { position: relative; z-index: 1; }
.stage:has(.battle) .toast { top: auto; bottom: 10px; }
.battle .hills { position: absolute; left: 0; right: 0; top: 30%; height: 22%; background: var(--hills); pointer-events: none; }
.battle .mote { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--mote, rgba(255,250,200,.8)); pointer-events: none; animation: mote 4s linear infinite; }
@keyframes mote { from { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } to { transform: translate(30px, -120px); opacity: 0; } }
.spark { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 2px solid #000; pointer-events: none; z-index: 5; }
.banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font: 400 clamp(1.7rem, 8vw, 2.6rem) var(--display); color: #ff6a3d; -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000; z-index: 7; pointer-events: none; animation: banner 1.8s forwards; }
@keyframes banner { 0% { transform: scale(2.4); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }
.battle.rage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(transparent 35%, rgba(190, 20, 20, .5)); animation: rage 0.9s ease-in-out infinite alternate; }
@keyframes rage { from { opacity: .45; } to { opacity: 1; } }
.bar .hpw.boss { height: 12px; background-image: repeating-linear-gradient(90deg, transparent 0 9%, rgba(0,0,0,.6) 9% 10%); }
.ftr.me { left: 8%; bottom: 36%; }
.ftr.foe { right: 8%; top: 8%; }
.ftr.foe .sprite { font-size: clamp(3.6rem, 19vw, 6.8rem); animation: idle 1.8s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-6px) scale(1.03); } }
.bar { background: rgba(0,0,0,.65); border: 2px solid #000; border-radius: 10px; padding: 4px 8px; min-width: 130px; }
.bar .nm { font: 400 .9rem var(--display); display: flex; justify-content: space-between; gap: 8px; }
.bar .hpw { height: 9px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 3px; }
.bar .hpw i { display: block; height: 100%; background: linear-gradient(90deg, #4be37b, #b6f36b); transition: width .45s; }
.bar .hpw i.low { background: linear-gradient(90deg, #ff6a3d, #ffb13d); }
.timer { height: 8px; border-radius: 4px; background: #ddd; overflow: hidden; }
.timer i { display: block; height: 100%; background: linear-gradient(90deg, #ff6a3d, var(--gold)); transform-origin: left; }
.combo { font: 400 .95rem var(--display); color: #ff6a3d; }
.dmg { position: absolute; font: 400 1.9rem var(--display); color: var(--gold); -webkit-text-stroke: 2px #000; pointer-events: none; animation: up .9s forwards; z-index: 4; }
.dmg.bad { color: var(--red); }
@keyframes up { to { transform: translateY(-50px); opacity: 0; } }
.proj { position: absolute; font-size: 2rem; pointer-events: none; z-index: 3; }
.flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(transparent 40%, rgba(229,72,77,.6)); animation: fade .5s forwards; }
@keyframes fade { to { opacity: 0; } }
.taunt { position: absolute; right: 6%; top: 46%; background: #fff; color: var(--ink); border: 2px solid #000; border-radius: 12px; padding: 4px 8px; font-weight: 800; font-size: .85rem; max-width: 45%; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
.hitfx { animation: hitfx .45s; }
@keyframes hitfx { 25% { filter: brightness(3) drop-shadow(0 0 0 #fff); transform: translateX(10px) rotate(8deg); } 60% { transform: translateX(-8px) rotate(-6deg); } }
.lunge { animation: lunge .35s; }
@keyframes lunge { 50% { transform: translate(-30%, 25%) scale(1.15); } }
/* title + end */
.title-screen { background: linear-gradient(#ffb36b 0%, #ff8a5c 35%, #6a4c93 70%, #2b2d5c 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
.title-screen h1 { font: 400 clamp(2rem, 9vw, 3.3rem)/1 var(--display); margin: 0; color: var(--gold); -webkit-text-stroke: 2px #000; text-shadow: 0 5px 0 #000; }
.title-screen p { margin: 0; font-weight: 800; }
.title-screen .art { font-size: clamp(2.6rem, 12vw, 4rem); animation: idle 2.4s ease-in-out infinite; }
.toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--gold); color: var(--ink); border: 3px solid #000; border-radius: 999px; padding: 4px 14px; font: 400 1rem var(--display); z-index: 9; white-space: nowrap; pointer-events: none; }
/* controls */
.controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 46px); gap: 4px; touch-action: none; }
.pad button, .abtn { font: 400 1.3rem var(--display); background: #f2f2f2; color: var(--ink); border: 3px solid #000; border-radius: 12px; cursor: pointer; box-shadow: 0 3px 0 #000; touch-action: none; }
.abtn { width: 78px; height: 78px; border-radius: 50%; background: var(--gold); font-size: 1.6rem; }
.help { font-size: .8rem; color: #cfe6d8; text-align: right; max-width: 200px; line-height: 1.4; }
@media (max-width: 440px) { .opts { grid-template-columns: minmax(0, 1fr); } .hud .title { font-size: 1rem; } .help { display: none; } .ftr .sprite { font-size: 3rem; } .ftr.foe .sprite { font-size: 3.8rem; } }
@media (prefers-reduced-motion: reduce) { .ftr.foe .sprite, .title-screen .art, .dlg .more, .battle .mote, .battle.rage::after { animation: none; } }

/* ===== Wonder-River Edition: playful desktop + tablet + phone layout ===== */
:root { --jungle:#124b45; --leaf:#2caa76; --gold:#ffd76f; --panel:#fffdf8; --ink:#193b46; --muted:#5b7880; color-scheme:light; }
body { min-height:100svh; color:var(--ink); padding:clamp(8px,1.9vw,24px); background:
 radial-gradient(circle at 9% 7%,rgba(255,227,151,.8) 0 52px,transparent 53px),
 radial-gradient(circle at 88% 12%,rgba(162,232,222,.85) 0 120px,transparent 121px),
 radial-gradient(circle at 72% 82%,rgba(190,236,174,.65) 0 150px,transparent 151px),
 linear-gradient(125deg,#e3f9f2,#f6fcdb 52%,#daf0fd); }
button { -webkit-tap-highlight-color:transparent; transition:transform .13s,filter .15s,background .18s; }
button:hover:not(:disabled) { filter:brightness(1.045); }
button:disabled { cursor:default; }
.wrap { max-width:1130px; margin:0 auto; display:grid; gap:14px; grid-template-columns:minmax(0,1fr) 282px; grid-template-rows:auto auto auto 1fr; align-items:start; }
.hud { grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:rgba(255,255,255,.94); border:3px solid rgba(35,118,102,.17); box-shadow:0 7px 0 rgba(19,99,81,.12),0 12px 30px rgba(0,70,60,.08); border-radius:22px; padding:11px 15px; }
.hud .title { color:#195b52; font-size:clamp(1.2rem,2.2vw,1.65rem); display:flex; align-items:center; gap:9px; line-height:.93; margin-right:auto; letter-spacing:.15px; }
.hud .title strong { color:#ed8550; font-weight:400; }
.hud .title small { font:900 .57rem/1.6 var(--body);letter-spacing:2.2px; color:#639087;display:block; padding-top:5px; }
.brand-emoji { display:grid;place-items:center;width:48px;height:48px; flex:none; border-radius:16px;background:#fff0bd;box-shadow:inset 0 -4px 0 rgba(223,154,53,.2);font-size:1.85rem; }
.hud .chip { background:#e7f8f1; color:#215c56; border:2px solid #c5ecdd; border-radius:13px; padding:8px 10px; font-size:.93rem; }
.hud .icon-btn { color:#27605b; background:#f1fbf7; border:2px solid #d2ebe2; border-radius:13px; padding:9px 10px; font-size:.92rem; }
.hud .arcade-head { background:#ffecad;color:#76521b;border-color:#ffd37e; }
.xpbar { background:#c5e2d6; height:9px; width:62px; }
.xpbar i { background:linear-gradient(90deg,#ffad51,#ffd662); }
.quest { grid-column:2;grid-row:2; background:#ffffff; color:#244c4c; padding:18px; border:3px solid #b6e9d7; border-left:6px solid #35bba5; border-radius:19px; box-shadow:0 6px 0 #c5e6d9; line-height:1.48; }
.quest b { color:#1b877a; }
.quest-heading { display:flex;justify-content:space-between;gap:7px;font:900 .85rem var(--body); color:#238c79; }
.quest-text { font:800 1rem/1.5 var(--body); margin:9px 0 15px; }
.quest-progress { border-radius:999px; height:10px; overflow:hidden;background:#e5f4e8;box-shadow:inset 0 2px 3px rgba(10,55,20,.11); }
.quest-progress i { display:block; height:100%; border-radius:999px;background:linear-gradient(90deg,#44c9a3,#ffd45e);transition:width .35s; }
.stage { grid-column:1; grid-row:2 / span 3; width:100%; background:#69bf7e; border:6px solid #fff; outline:3px solid #317e68; border-radius:26px; box-shadow:0 11px 0 #77b8a1,0 17px 36px rgba(34,96,81,.25); }
.controls { grid-column:2; grid-row:3; background:rgba(255,255,255,.93);border:3px solid #d1eadf;border-radius:20px; padding:14px 12px; box-shadow:0 5px 0 #d1e9dd;flex-wrap:wrap;justify-content:center;gap:10px; }
.pad { grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,47px);gap:4px; }
.pad button { background:linear-gradient(#fff,#ddf0e7);color:#246257;border:2px solid #337f69;box-shadow:0 4px 0 #27644c;border-radius:14px; }
.abtn { background:linear-gradient(#ffe98a,#ffb952);border:3px solid #bf812d;box-shadow:0 5px 0 #a86520; color:#654113;width:74px;height:74px; }
.help { display:block;max-width:245px;color:#528479;text-align:center;font-size:.76rem;line-height:1.4;width:100%;margin:0; }
.below { grid-column:2;grid-row:3 / span 2; background:#fffdf6; color:var(--ink); border:3px solid #fedc95;border-radius:20px; padding:14px; box-shadow:0 6px 0 #f5ce7d;gap:12px; max-height: min(73svh,650px); overflow:auto; }
.below .q { font-size:clamp(1rem,1.65vw,1.18rem);color:#24536a; }
.opt { border:2px solid #bfd8d6;box-shadow:0 4px 0 #b8d7d1; min-height:49px; border-radius:13px; background:#fff; padding:10px; }
.opt:hover:not(:disabled) { background:#f0fbf6; }
.btn { border:2px solid #bd8537;box-shadow:0 4px 0 #ac762c;border-radius:13px; padding:10px 15px;min-height:43px; }
.why { border:2px solid #ffe1a0; background:#fff3cc; color:#665028; }
.dlg { border:3px solid #72c3a0;box-shadow:0 5px 0 #207e63,0 12px 22px rgba(0,0,0,.15); padding:14px; border-radius:17px; }
.card { border:3px solid #67bd9d; box-shadow:0 5px 0 #207e63; border-radius:18px; }
.bar { color:#fff; border-color:rgba(255,255,255,.15);background:rgba(16,43,47,.86); }
.toast { max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;background:#fff3ae; border-color:#ecb853;box-shadow:0 5px 0 rgba(70,47,0,.25); }
/* Cheerful adventure title artwork, no downloads or external images */
.title-screen { isolation:isolate; overflow:auto; background:linear-gradient(180deg,#6ad5ea 0%,#a9ebea 45%,#ddf3a7 62%,#67be77 63%,#34946e 100%);padding:20px 16px;gap:0; }
.title-screen:before { content:'☁️        ☁️         ☁️';font-size:clamp(1.8rem,4vw,3rem);position:absolute;left:-4%;right:-4%;top:4%;opacity:.9;letter-spacing:20px;white-space:nowrap;pointer-events:none;animation:cloud-drift 12s ease-in-out infinite alternate; }
.title-screen:after { content:''; position:absolute; z-index:-1; width:150%;height:50%;left:-25%;bottom:-28%;background:radial-gradient(ellipse at 45% 5%,#b9e681 0 32%,transparent 33%),linear-gradient(#4dad69,#277d62);border-radius:50% 50% 0 0;pointer-events:none; }
@keyframes cloud-drift { to { transform:translateX(25px); } }
.hero-content { display:flex; flex-direction:column;align-items:center;gap:9px; width:100%;max-width:570px;margin:auto;position:relative;z-index:2; }
.title-screen .eyebrow { background:rgba(255,255,255,.88);border:2px solid rgba(255,255,255,.98); border-radius:999px; padding:7px 14px;font:900 .76rem var(--body);color:#338475;letter-spacing:2px;box-shadow:0 3px 0 rgba(12,104,92,.18); }
.hero-characters { display:flex;justify-content:center;align-items:end;gap:10px;filter:drop-shadow(0 8px 3px rgba(29,81,47,.22));margin:0;font-size:clamp(2.6rem,7vw,4.3rem); animation:hero-bob 2.8s ease-in-out infinite; }
.hero-characters span:nth-child(2) { transform:translateY(-12px) scale(1.1); }
@keyframes hero-bob { 50% { transform:translateY(-6px); } }
.title-screen h1 { font:900 clamp(2.15rem,5.6vw,4rem)/.95 var(--display);margin:3px 0;text-shadow:0 5px 0 #1c6b62,0 8px 12px rgba(0,80,70,.35);-webkit-text-stroke:1.2px #215e58;color:#fff2a2; }
.title-screen h1 span {color:#fffdf4;}
.title-screen p { color:#164c53;font-weight:900;font-size:clamp(.92rem,1.6vw,1.12rem);max-width:500px;text-shadow:0 1px rgba(255,255,255,.4); }
.hero-actions { display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px; }
.hero-actions .btn { font-size:clamp(.92rem,1.8vw,1.17rem);padding:12px 18px; border:3px solid #265f54;box-shadow:0 6px 0 #215d50; }
.hero-actions .btn.secondary {background:#fffef1;color:#1f7f72;}
.hero-foot { background:rgba(255,255,255,.87);border-radius:16px;padding:8px 14px;color:#2b7666;font-weight:900;font-size:.78rem; }
/* Tap-friendly science arcade with three independent activities */
.arcade { background:#e8faff; }
.arcade-screen { position:absolute;inset:0; overflow:auto;display:flex; flex-direction:column;gap:12px; padding:17px 18px 16px; color:#234e57; background:linear-gradient(135deg,#e8fcfd,#fff7de 65%,#e4fbe2); }
.arcade-top { display:flex;align-items:center;justify-content:space-between;gap:8px; }
.arcade-top .back { font:900 .83rem var(--body);border:2px solid #aad5d0;border-radius:14px;background:#fff;color:#23685a;padding:8px 12px;cursor:pointer; }
.arcade-top .counter { font:900 .83rem var(--body);color:#31867a;background:#d8f8ec;padding:8px 12px;border-radius:999px; }
.arcade-screen h2 { font:900 clamp(1.55rem,3.8vw,2.35rem)/1.07 var(--display);margin:0;color:#245c60; }
.arcade-screen .arcade-sub { margin:0;font-size:clamp(.86rem,1.6vw,1.03rem);font-weight:850;line-height:1.35; }
.arcade-tiles { display:grid;grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; flex:1;align-items:center; }
.arcade-tile { display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:5px;min-height:265px;max-height:325px;justify-content:center;border:3px solid var(--tile-border,#79b8a7);border-radius:21px;padding:16px 10px 12px;background:var(--tile-bg,#fff);box-shadow:0 6px 0 var(--tile-shadow,#c2e0ce);cursor:pointer;color:#234e57; }
.arcade-tile .tile-art { display:grid;place-items:center; font-size:clamp(2.7rem,6vw,4rem);min-height:65px;filter:drop-shadow(0 5px 2px rgba(40,90,70,.13)); }
.arcade-tile .tile-name {font:900 clamp(1.06rem,2.4vw,1.37rem)/1.1 var(--display);}
.arcade-tile .tile-desc {font:800 .78rem/1.25 var(--body);color:#4d7c7a;}
.arcade-tile .tile-tag {background:#fff8c7;border-radius:999px;color:#82682e;font-weight:900;font-size:.75rem;padding:4px 10px;margin-top:14px;}
.arcade-tile:hover { transform:translateY(-3px); }
.arcade-progress { background:rgba(255,255,255,.78);border-radius:14px;padding:10px;text-align:center;font-weight:900;color:#377c73; }
.mini-head { text-align:center; display:flex;flex-direction:column;gap:5px; }
.mini-scene { flex:1; min-height:0; display:flex;flex-direction:column;justify-content:center;align-items:center;gap:13px; }
.mini-counter { font:900 .78rem var(--body);color:#3f817b; }
.magnet-art {font-size:clamp(3rem,6vw,4.7rem);line-height:1;filter:drop-shadow(0 6px 2px #abd5d3);animation:magnet-pulse 2s ease-in-out infinite;}
@keyframes magnet-pulse {50%{transform:rotate(-9deg) scale(1.08)}}

  // Draws the hero with its feet at (0,0) on context c. step: walk phase (-1..1)
  function paintAvatar(c, a, step, time, flash) {
    const W = a.wear || {}, skin = SKIN[a.skin], shirt = SHIRTS[a.shirt], ink = '#1a120b';
    const sway = reduce ? 0 : Math.sin(time / 260) * 1.2;
    const back = W.back && AVI[W.back];
    if (back && back.cape) {   // cape or lab coat behind the body
      c.fillStyle = ink; c.beginPath(); c.moveTo(-5.5, -12); c.lineTo(5.5, -12); c.lineTo(7 + sway, 0.5); c.lineTo(-7 + sway, 0.5); c.closePath(); c.fill();
      c.fillStyle = back.cape; c.beginPath(); c.moveTo(-4.5, -11.3); c.lineTo(4.5, -11.3); c.lineTo(6 + sway, -0.5); c.lineTo(-6 + sway, -0.5); c.closePath(); c.fill();
    }
    if (back && !back.cape) { c.save(); c.translate(5.5, -7); drawSpriteOn(c, back.em, 0, 0, 8); c.restore(); }
    // legs (or skirt for the girl)
    const l1 = step * 1.6, l2 = -step * 1.6;
    c.fillStyle = ink; c.fillRect(-3.6, -4.5, 3.2, 5 + Math.max(0, l1) * -0.5); c.fillRect(0.4, -4.5, 3.2, 5);
    c.fillStyle = '#2c3e66'; c.fillRect(-3, -4 + Math.min(0, l1), 2, 4); c.fillRect(1, -4 + Math.min(0, l2), 2, 4);
    c.fillStyle = '#3a2412'; c.fillRect(-3.3, -0.8 + Math.min(0, l1), 2.6, 1.6); c.fillRect(0.7, -0.8 + Math.min(0, l2), 2.6, 1.6);
    if (a.g === 'g') { c.fillStyle = ink; c.beginPath(); c.moveTo(-4.6, -6); c.lineTo(4.6, -6); c.lineTo(6, -1.6); c.lineTo(-6, -1.6); c.closePath(); c.fill(); c.fillStyle = shirt; c.beginPath(); c.moveTo(-4, -5.5); c.lineTo(4, -5.5); c.lineTo(5.2, -2.2); c.lineTo(-5.2, -2.2); c.closePath(); c.fill(); }
    // arms swing with the step
    c.fillStyle = ink; c.fillRect(-7, -10.5 - step, 3, 6); c.fillRect(4, -10.5 + step, 3, 6);
    c.fillStyle = skin; c.fillRect(-6.4, -6.2 - step, 1.8, 1.8); c.fillRect(4.6, -6.2 + step, 1.8, 1.8);
    c.fillStyle = shirt; c.fillRect(-6.4, -10 - step, 1.8, 3.8); c.fillRect(4.6, -10 + step, 1.8, 3.8);
    // torso
    c.fillStyle = ink; c.beginPath(); c.roundRect ? c.roundRect(-5, -12, 10, 8.4, 2.5) : c.rect(-5, -12, 10, 8.4); c.fill();
    c.fillStyle = shirt; c.beginPath(); c.roundRect ? c.roundRect(-4.3, -11.3, 8.6, 7, 2) : c.rect(-4.3, -11.3, 8.6, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-3.4, -10.6, 2, 5.2);
    if (back && back.id === 'coat') { c.fillStyle = '#ffffff'; c.fillRect(-4.3, -11.3, 2.4, 7); c.fillRect(1.9, -11.3, 2.4, 7); c.fillStyle = ink; c.fillRect(-1.9, -11.3, .6, 7); c.fillRect(1.3, -11.3, .6, 7); }

  }
  function drawSpriteOn(c, em, x, y, size, white) { const s = spriteImg(em, size, white); c.drawImage(s, x - s.w / 2, y - s.w / 2, s.w, s.w); }
  // Portrait as an image, for dialogue, battle and title

  const MUSIC = (() => {
    const NOTE = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };

    const CH = { F: ['F', 'A', 'C'], Dm: ['D', 'F', 'A'], Bb: ['Bb', 'D', 'F'], C: ['C', 'E', 'G'], Am: ['A', 'C', 'E'], G: ['G', 'B', 'D'], Em: ['E', 'G', 'B'], A: ['A', 'C#', 'E'] };
    const T = {
